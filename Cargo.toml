[package]
name = "tokenix"
version = "1.0.1"
edition = "2021"
# Floor, not a preference. Two things break silently below it: `Command` only
# quotes arguments safely for Windows `.cmd`/`.bat` shims since 1.77.2
# (CVE-2024-24576), and `cmd_filter` spawns exactly those shims with
# repo-controlled argv. 1.90 is where the dependency tree already lands
# (tree-sitter 0.27), so this costs nothing and makes the assumption fail
# at build time instead of at exploit time.
rust-version = "1.90"
description = "Symbol graphs, lexical code search, secrets scanning, output filters, and CLI hooks that save 60-90% LLM tokens"
license = "MIT"
repository = "https://github.com/juninmd/tokenix"
homepage = "https://github.com/juninmd/tokenix"
readme = "README.md"
keywords = ["llm", "code-search", "symbol-graph", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["/tokenix-logo.png", "/assets/screenshots", "/benchmark", "/.github"]

[[bin]]
name = "tokenix"
path = "src/main.rs"

[features]
# The default build is the agent-facing core: the hook, the MCP server, the
# index, the symbol graph, the output filters and the credential scanner. The
# rest is opt-in, and `full` is what the release binaries ship.
default = []
# Interactive terminal dashboard (bare `tokenix`). Its tabs call the forensics
# scanners and the filter studio directly, so it brings both.
tui = ["forensics", "authoring", "dep:ratatui"]
# Analytics over agent transcripts: usage/cost, discover, conversation-audit,
# prompt-audit, session-audit, egress-audit and benchmark.
forensics = []
# Writing filters: `filter record` and `filter generate` (which drives an AI CLI).
authoring = []
# Hook and MCP installers for Copilot, Codex, OpenCode and Antigravity. Claude
# Code is always built.
agents-extra = []
full = ["tui", "forensics", "authoring", "agents-extra"]

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
once_cell = "1"
walkdir = "2"
ignore = "0.4"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
indicatif = "0.18"
colored = "3"
# ansi feature: measures cell display-width ignoring ANSI color codes, so colored
# cells stay aligned. default-features off keeps it to the table core (no derive).
tabled = { version = "0.22", default-features = false, features = ["ansi"] }
# Interactive filter browser (`tokenix filter` in a TTY). Default features bring
# the crossterm backend, re-exported as `ratatui::crossterm` so we pin one version.
ratatui = { version = "0.30", optional = true }
dirs = "7"
rayon = "1"
toml = "1.1"
regex = "1"
rust-embed = { version = "8", features = ["include-exclude"] }
libc = "0.2"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-go = "0.25"
tree-sitter-cpp = "0.23"
# Release downloads for `tokenix update`. Blocking and small: no async runtime or
# HTTP/2 stack, and TLS roots come from the OS trust store.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# Shareable index snapshots. rust_backend keeps this to miniz_oxide (pure Rust,
# already in the tree via reqwest) instead of pulling a C zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

# Debug builds overflow the main thread's stack (clap derive over the 33-variant
# Commands enum builds a huge unoptimized frame). opt-level 1 keeps frames sane.
[profile.dev]
opt-level = 1

