name: Release

on:
  push:
    branches:
      - main

# Least privilege by default: the pipeline reads the repo. Each job opts into the
# narrow extra scope it needs (bump-version/release: contents:write; build &
# publish: id-token for attestation/Trusted Publishing).
permissions:
  contents: read

# Serialize releases: a second semantic push waits rather than racing the
# in-flight release for tag/artifact creation. cancel-in-progress is false so a
# release that is mid cross-compile is never aborted half-published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      bump: ${{ steps.version.outputs.bump }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute next semantic version
        id: version
        run: |
          set -euo pipefail

          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="v0.0.0"
            RANGE=""
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          if [ -n "$RANGE" ]; then
            COMMITS=$(git log --format='%s%n%b%n---END---' "$RANGE")
          else
            COMMITS=$(git log --format='%s%n%b%n---END---')
          fi

          if [ -z "$(echo "$COMMITS" | tr -d '[:space:]')" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "bump=none" >> $GITHUB_OUTPUT
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "No commits since $PREVIOUS_TAG."
            exit 0
          fi

          BUMP="none"
          if echo "$COMMITS" | grep -Eq '(^|[[:space:]])BREAKING CHANGE:|^[a-zA-Z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eq '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -Eq '^(fix|perf)(\([^)]+\))?:'; then
            BUMP="patch"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "bump=none" >> $GITHUB_OUTPUT
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "No semantic release commit found since $PREVIOUS_TAG."
            exit 0
          fi

          BASE="${PREVIOUS_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Next release: $TAG ($BUMP from $PREVIOUS_TAG)"

  # CI gate — fmt, clippy and tests must pass before ANYTHING is tagged, released
  # or published. bump-version (and therefore build, release and publish-crate,
  # which all depend on it) needs this job, so a red pipeline never produces a
  # GitHub release or a crates.io push.
  ci:
    name: CI gate
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-ci-gate-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ci-gate-cargo-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  bump-version:
    needs: [check-version, ci]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # bump-version pushes the release commit, so the checkout credentials must
        # persist — persist-credentials:false would break `git push`.
        with:
          fetch-depth: 0 # zizmor: ignore[artipacked]

      - name: Write release version into Cargo.toml + Cargo.lock
        # Pass workflow data through env, never interpolated into the script body,
        # so a crafted value can never break out into shell (template injection).
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          # [package] version is the first `version = ` line in Cargo.toml
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          # keep the crate's own entry in Cargo.lock in sync so --locked builds pass
          sed -i "/^name = \"tokenix\"$/{n;s/^version = \".*\"/version = \"${VERSION}\"/}" Cargo.lock
          echo "Cargo.toml -> $(grep -m1 '^version' Cargo.toml)"
          # Fail fast if either sed missed: a stale Cargo.lock breaks every
          # downstream `--locked` build, and we want a clear signal here.
          grep -q "^version = \"${VERSION}\"$" Cargo.toml \
            || { echo "::error::Cargo.toml version not updated to ${VERSION}"; exit 1; }
          grep -A1 '^name = "tokenix"$' Cargo.lock | grep -q "version = \"${VERSION}\"" \
            || { echo "::error::Cargo.lock tokenix version not updated to ${VERSION}"; exit 1; }

      - name: Commit and push bump
        id: commit
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cargo.toml already at the release version; nothing to commit."
          else
            # [skip ci] so this bump commit does not re-trigger the release pipeline
            git commit -am "chore(release): ${TAG} [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [check-version, bump-version]
    if: needs.check-version.outputs.should_release == 'true'
    # Provenance attestation needs to mint an OIDC token and write the attestation;
    # the source checkout is read-only.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on 22.04 (glibc 2.35) not 24.04 (glibc 2.39): a dynamically
          # linked binary inherits the build host's glibc floor, so 24.04 made
          # binaries fail with "GLIBC_2.39 not found" on Ubuntu 22.04 / Debian 12
          # / RHEL 9. 2.35 covers all current mainstream distros. (musl static is
          # not an option — fastembed's ONNX Runtime is glibc C++.)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: tokenix-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            artifact: tokenix-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: tokenix-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tokenix-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tokenix-windows-x86_64.exe
          # GPU-accelerated Windows build. DirectML ships in the pyke ORT
          # prebuilt, so no extra toolkit is needed on the runner. CUDA is
          # intentionally omitted — its toolkit install is too fragile for an
          # auto-release pipeline; CUDA users build from source with --locked.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tokenix-windows-x86_64-directml.exe
            features: "--features directml"

    runs-on: ${{ matrix.os }}
    steps:
      # harden-runner is Linux-only; skip on the macOS/Windows matrix legs.
      - name: Harden runner
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/tokenix ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target\${{ matrix.target }}\release\tokenix.exe" "${{ matrix.artifact }}"

      # SLSA build provenance: cryptographically binds this exact binary's digest
      # to the workflow + commit that produced it. Consumers verify with
      # `gh attestation verify <file> --repo juninmd/tokenix`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [check-version, bump-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # Creating the GitHub Release + tag needs write to repo contents.
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Download SLSA provenance bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          for file in tokenix-*; do
            digest="$(sha256sum "$file" | cut -d' ' -f1)"
            gh attestation download "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --predicate-type https://slsa.dev/provenance/v1
            mv "sha256:${digest}.jsonl" "${file}.intoto.jsonl"
            test -s "${file}.intoto.jsonl"
          done

      - name: Extract changelog entry
        id: changelog
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          PREVIOUS_TAG: ${{ needs.check-version.outputs.previous_tag }}
          BUMP: ${{ needs.check-version.outputs.bump }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          NOTES="Release v${VERSION}\n\nSemantic bump: \`${BUMP}\`.\nBuilt from commit \`${COMMIT_SHA}\` on \`${REF_NAME}\`."
          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            # Exclude the auto-generated chore(release) bump commit from the notes.
            CHANGES=$(git log --format='- %s (%h)' "${PREVIOUS_TAG}..HEAD" | grep -v 'chore(release):' || true)
            NOTES="${NOTES}\n\nChanges since ${PREVIOUS_TAG}:\n${CHANGES}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2 # zizmor: ignore[superfluous-actions]
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          target_commitish: ${{ needs.bump-version.outputs.sha }}
          name: tokenix ${{ needs.check-version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            artifacts/tokenix-linux-x86_64
            artifacts/tokenix-linux-aarch64
            artifacts/tokenix-macos-x86_64
            artifacts/tokenix-macos-aarch64
            artifacts/tokenix-windows-x86_64.exe
            artifacts/tokenix-windows-x86_64-directml.exe
            artifacts/sha256sums.txt
            artifacts/*.intoto.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the same version to crates.io alongside the GitHub release.
  # Prefers OIDC Trusted Publishing (no standing secret); falls back to a
  # CARGO_REGISTRY_TOKEN secret if Trusted Publishing is not yet configured on
  # crates.io. When neither is available the job no-ops with a warning so releases
  # are never blocked.
  publish-crate:
    needs: [check-version, bump-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the OIDC token for crates.io Trusted Publishing
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      # Exchanges the workflow's OIDC identity for a short-lived (30 min) crates.io
      # token. Requires a one-time Trusted Publisher config on crates.io
      # (crate Settings -> Trusted Publishing -> repo juninmd/tokenix, this
      # workflow). continue-on-error lets the token fallback run until then.
      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        env:
          TP_TOKEN: ${{ steps.auth.outputs.token }}
          FALLBACK_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # The checked-out bump commit already carries the release version.
          if [ -n "${TP_TOKEN:-}" ]; then
            echo "Publishing to crates.io via Trusted Publishing (OIDC)."
            CARGO_REGISTRY_TOKEN="$TP_TOKEN" cargo publish --locked
          elif [ -n "${FALLBACK_TOKEN:-}" ]; then
            echo "::warning::Trusted Publishing unavailable; using CARGO_REGISTRY_TOKEN. Configure Trusted Publishing on crates.io to drop the standing secret."
            CARGO_REGISTRY_TOKEN="$FALLBACK_TOKEN" cargo publish --locked
          else
            echo "::warning::Neither Trusted Publishing nor CARGO_REGISTRY_TOKEN is available — skipping crates.io publish."
          fi
