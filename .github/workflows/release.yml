name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      bump: ${{ steps.version.outputs.bump }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version
        id: version
        run: |
          set -euo pipefail

          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="v0.0.0"
            RANGE=""
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          if [ -n "$RANGE" ]; then
            COMMITS=$(git log --format='%s%n%b%n---END---' "$RANGE")
          else
            COMMITS=$(git log --format='%s%n%b%n---END---')
          fi

          if [ -z "$(echo "$COMMITS" | tr -d '[:space:]')" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "bump=none" >> $GITHUB_OUTPUT
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "No commits since $PREVIOUS_TAG."
            exit 0
          fi

          BUMP="none"
          if echo "$COMMITS" | grep -Eq '(^|[[:space:]])BREAKING CHANGE:|^[a-zA-Z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eq '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -Eq '^(fix|perf)(\([^)]+\))?:'; then
            BUMP="patch"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "bump=none" >> $GITHUB_OUTPUT
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "No semantic release commit found since $PREVIOUS_TAG."
            exit 0
          fi

          BASE="${PREVIOUS_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Next release: $TAG ($BUMP from $PREVIOUS_TAG)"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tokenix-linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: tokenix-linux-x86_64-musl
            musl: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: tokenix-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: tokenix-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tokenix-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tokenix-windows-x86_64.exe
          # GPU-accelerated Windows build. DirectML ships in the pyke ORT
          # prebuilt, so no extra toolkit is needed on the runner. CUDA is
          # intentionally omitted — its toolkit install is too fragile for an
          # auto-release pipeline; CUDA users build from source with --locked.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tokenix-windows-x86_64-directml.exe
            features: "--features directml"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
          if [[ "${{ matrix.musl }}" == "true" ]]; then
            sudo apt-get install -y musl-tools
            rustup target add x86_64-unknown-linux-musl
          fi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/tokenix ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target\${{ matrix.target }}\release\tokenix.exe" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          PREVIOUS_TAG="${{ needs.check-version.outputs.previous_tag }}"
          NOTES="Release v${VERSION}\n\nSemantic bump: \`${{ needs.check-version.outputs.bump }}\`.\nBuilt from commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\`."
          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            NOTES="${NOTES}\n\nChanges since ${PREVIOUS_TAG}:\n$(git log --format='- %s (%h)' ${PREVIOUS_TAG}..HEAD)"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: tokenix ${{ needs.check-version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            artifacts/tokenix-linux-x86_64
            artifacts/tokenix-linux-aarch64
            artifacts/tokenix-macos-x86_64
            artifacts/tokenix-macos-aarch64
            artifacts/tokenix-windows-x86_64.exe
            artifacts/tokenix-windows-x86_64-directml.exe
            artifacts/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
