name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

# Serialize releases: a second semantic push waits rather than racing the
# in-flight release for tag/artifact creation. cancel-in-progress is false so a
# release that is mid cross-compile is never aborted half-published.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.version.outputs.should_release }}
      bump: ${{ steps.version.outputs.bump }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version
        id: version
        run: |
          set -euo pipefail

          PREVIOUS_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)
          if [ -z "$PREVIOUS_TAG" ]; then
            PREVIOUS_TAG="v0.0.0"
            RANGE=""
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          if [ -n "$RANGE" ]; then
            COMMITS=$(git log --format='%s%n%b%n---END---' "$RANGE")
          else
            COMMITS=$(git log --format='%s%n%b%n---END---')
          fi

          if [ -z "$(echo "$COMMITS" | tr -d '[:space:]')" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "bump=none" >> $GITHUB_OUTPUT
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "No commits since $PREVIOUS_TAG."
            exit 0
          fi

          BUMP="none"
          if echo "$COMMITS" | grep -Eq '(^|[[:space:]])BREAKING CHANGE:|^[a-zA-Z]+(\([^)]+\))?!:'; then
            BUMP="major"
          elif echo "$COMMITS" | grep -Eq '^feat(\([^)]+\))?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -Eq '^(fix|perf)(\([^)]+\))?:'; then
            BUMP="patch"
          fi

          if [ "$BUMP" = "none" ]; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "bump=none" >> $GITHUB_OUTPUT
            echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
            echo "No semantic release commit found since $PREVIOUS_TAG."
            exit 0
          fi

          BASE="${PREVIOUS_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "should_release=true" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
          echo "Next release: $TAG ($BUMP from $PREVIOUS_TAG)"

  bump-version:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write release version into Cargo.toml + Cargo.lock
        run: |
          set -euo pipefail
          VERSION="${{ needs.check-version.outputs.version }}"
          # [package] version is the first `version = ` line in Cargo.toml
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          # keep the crate's own entry in Cargo.lock in sync so --locked builds pass
          sed -i "/^name = \"tokenix\"$/{n;s/^version = \".*\"/version = \"${VERSION}\"/}" Cargo.lock
          echo "Cargo.toml -> $(grep -m1 '^version' Cargo.toml)"
          # Fail fast if either sed missed: a stale Cargo.lock breaks every
          # downstream `--locked` build, and we want a clear signal here.
          grep -q "^version = \"${VERSION}\"$" Cargo.toml \
            || { echo "::error::Cargo.toml version not updated to ${VERSION}"; exit 1; }
          grep -A1 '^name = "tokenix"$' Cargo.lock | grep -q "version = \"${VERSION}\"" \
            || { echo "::error::Cargo.lock tokenix version not updated to ${VERSION}"; exit 1; }

      - name: Commit and push bump
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cargo.toml already at the release version; nothing to commit."
          else
            # [skip ci] so this bump commit does not re-trigger the release pipeline
            git commit -am "chore(release): ${{ needs.check-version.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: [check-version, bump-version]
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: tokenix-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: tokenix-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: tokenix-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: tokenix-macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tokenix-windows-x86_64.exe
          # GPU-accelerated Windows build. DirectML ships in the pyke ORT
          # prebuilt, so no extra toolkit is needed on the runner. CUDA is
          # intentionally omitted — its toolkit install is too fragile for an
          # auto-release pipeline; CUDA users build from source with --locked.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: tokenix-windows-x86_64-directml.exe
            features: "--features directml"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.artifact }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.artifact }}-cargo-

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.features }}

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/tokenix ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          Copy-Item "target\${{ matrix.target }}\release\tokenix.exe" "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [check-version, bump-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        run: |
          cd artifacts
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Extract changelog entry
        id: changelog
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          PREVIOUS_TAG="${{ needs.check-version.outputs.previous_tag }}"
          NOTES="Release v${VERSION}\n\nSemantic bump: \`${{ needs.check-version.outputs.bump }}\`.\nBuilt from commit \`${{ github.sha }}\` on \`${{ github.ref_name }}\`."
          if [ "$PREVIOUS_TAG" != "v0.0.0" ]; then
            # Exclude the auto-generated chore(release) bump commit from the notes.
            CHANGES=$(git log --format='- %s (%h)' "${PREVIOUS_TAG}..HEAD" | grep -v 'chore(release):' || true)
            NOTES="${NOTES}\n\nChanges since ${PREVIOUS_TAG}:\n${CHANGES}"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo -e "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          target_commitish: ${{ needs.bump-version.outputs.sha }}
          name: tokenix ${{ needs.check-version.outputs.tag }}
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            artifacts/tokenix-linux-x86_64
            artifacts/tokenix-linux-aarch64
            artifacts/tokenix-macos-x86_64
            artifacts/tokenix-macos-aarch64
            artifacts/tokenix-windows-x86_64.exe
            artifacts/tokenix-windows-x86_64-directml.exe
            artifacts/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the same version to crates.io alongside the GitHub release.
  # Requires a CARGO_REGISTRY_TOKEN repo secret (crates.io API token). When the
  # secret is absent the job no-ops with a warning so releases are never blocked.
  publish-crate:
    needs: [check-version, bump-version, release]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish. Add the secret to enable it (Settings → Secrets and variables → Actions)."
            exit 0
          fi
          # Builds in default (no-GPU) config, runs the verify build, then uploads.
          # The checked-out bump commit already carries the release version.
          cargo publish --locked
