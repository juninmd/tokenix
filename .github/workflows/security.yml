name: Security Scan
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# The reusable workflow declares no permissions of its own, so it inherits these.
# Secret scans need read-only repo and PR metadata access.
permissions:
  contents: read
  pull-requests: read
jobs:
  gitleaks:
    uses: juninmd/base-actions/.github/workflows/reusable-security-scan.yml@main
    secrets: inherit
