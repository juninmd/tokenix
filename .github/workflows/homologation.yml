name: Homologation (Linux)

# Validates the full CLI surface on Linux: build, smoke, integration, binary sanity.
# Runs in addition to the fast unit-test job in rust.yml.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:  # allow manual trigger from GitHub UI

concurrency:
  group: homologation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Job 1: Build release binary (shared across test matrix) ────────────
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    outputs:
      binary-path: ${{ steps.bin.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-homologation-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-homologation-

      - name: Build release
        run: cargo build --release --locked

      - name: Locate binary
        id: bin
        run: echo "path=$(pwd)/target/release/tokenix" >> $GITHUB_OUTPUT

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenix-linux-x86_64
          path: target/release/tokenix
          retention-days: 3

  # ─── Job 2: Full homologation suite ─────────────────────────────────────
  homologation:
    name: Homologation suite
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: tokenix-linux-x86_64
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/tokenix

      - name: Install test helpers (nc, file, ldd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends netcat-openbsd file binutils

      - name: Run homologation suite
        env:
          TOKENIX_BIN: ./bin/tokenix
          VERBOSE: 0
        run: bash scripts/homologation.sh ./bin/tokenix

      - name: Run hook functional tests
        run: bash scripts/test_hooks.sh ./bin/tokenix

      - name: Run Copilot integration tests
        run: bash scripts/test_copilot_hook.sh ./bin/tokenix

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: homologation-logs
          path: /tmp/tokenix-*
          retention-days: 7

  # ─── Job 3: Binary sanity across architectures (build only) ─────────────
  cross-compile-check:
    name: Cross-compile check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + cross target
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update -qq
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y gcc-aarch64-linux-gnu
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
            x86_64-unknown-linux-musl)
              sudo apt-get install -y musl-tools
              ;;
          esac

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cross-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cross-${{ matrix.target }}-

      - name: Build for ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify ELF header and architecture
        run: |
          BIN="target/${{ matrix.target }}/release/tokenix"
          file "$BIN"
          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              file "$BIN" | grep -q "ARM aarch64" || { echo "FAIL: wrong arch"; exit 1; }
              ;;
            x86_64-unknown-linux-musl)
              file "$BIN" | grep -q "x86-64" || { echo "FAIL: wrong arch"; exit 1; }
              file "$BIN" | grep -qi "static" || echo "WARN: not statically linked (musl target)"
              ;;
          esac
          echo "PASS: binary matches expected target"

  # ─── Job 4: Cargo unit tests on Linux (fast) ────────────────────────────
  unit-tests-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-tests-

      - name: Run fast unit tests
        run: cargo test --locked -- --test-threads=4

      - name: Clippy (Linux target)
        run: cargo clippy --all-targets --locked -- -D warnings

  # ─── Summary gate ────────────────────────────────────────────────────────
  homologation-gate:
    name: Homologation gate (required)
    runs-on: ubuntu-latest
    needs:
      - homologation
      - unit-tests-linux
      - cross-compile-check
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "homologation : ${{ needs.homologation.result }}"
          echo "unit-tests   : ${{ needs.unit-tests-linux.result }}"
          echo "cross-compile: ${{ needs.cross-compile-check.result }}"
          if [ "${{ needs.homologation.result }}" != "success" ] || \
             [ "${{ needs.unit-tests-linux.result }}" != "success" ] || \
             [ "${{ needs.cross-compile-check.result }}" != "success" ]; then
            echo "FAIL: one or more jobs did not succeed"
            exit 1
          fi
          echo "PASS: all homologation jobs succeeded"
