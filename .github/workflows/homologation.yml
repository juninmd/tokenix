name: Homologation (Linux)

# Validates the full CLI surface on Linux: build, smoke, integration, binary sanity.
# Runs in addition to the fast unit-test job in rust.yml.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:  # allow manual trigger from GitHub UI

concurrency:
  group: homologation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Least privilege: homologation only builds and tests; no write scope needed.
permissions:
  contents: read

jobs:
  # ─── Job 1: Build release binary (shared across test matrix) ────────────
  build:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    outputs:
      binary-path: ${{ steps.bin.outputs.path }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-homologation-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-homologation-

      - name: Build release
        run: cargo build --release --locked

      - name: Locate binary
        id: bin
        run: echo "path=$(pwd)/target/release/tokenix" >> $GITHUB_OUTPUT

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tokenix-linux-x86_64
          path: target/release/tokenix
          retention-days: 3

  # ─── Job 2: Full homologation suite ─────────────────────────────────────
  homologation:
    name: Homologation suite
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Download binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tokenix-linux-x86_64
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/tokenix

      - name: Install test helpers (nc, file, ldd)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends netcat-openbsd file binutils

      - name: Run homologation suite
        env:
          TOKENIX_BIN: ./bin/tokenix
          VERBOSE: 0
        run: bash scripts/homologation.sh ./bin/tokenix

      - name: Run hook functional tests
        run: bash scripts/test_hooks.sh ./bin/tokenix

      - name: Run Copilot integration tests
        run: bash scripts/test_copilot_hook.sh ./bin/tokenix

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homologation-logs
          path: /tmp/tokenix-*
          retention-days: 7

  # ─── Job 3: Binary sanity on aarch64 (native build) ─────────────────────
  # Built natively on an ARM runner, matching the release workflow. Cross-compiling
  # aarch64/musl from x86 pulls openssl-sys (via hf-hub native-tls), which has no
  # cross OpenSSL available on the runner.
  cross-compile-check:
    name: Binary sanity (aarch64 native)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-arm-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-arm-

      - name: Build release (native aarch64)
        run: cargo build --release --locked

      - name: Verify ELF header and architecture
        run: |
          BIN="target/release/tokenix"
          file "$BIN"
          file "$BIN" | grep -q "ARM aarch64" || { echo "FAIL: wrong arch"; exit 1; }
          echo "PASS: aarch64 binary built natively"

  # ─── Job 4: Cargo unit tests on Linux (fast) ────────────────────────────
  unit-tests-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: rustup update stable && rustup default stable

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-tests-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-tests-

      - name: Run fast unit tests
        run: cargo test --locked -- --test-threads=4

      - name: Clippy (Linux target)
        run: cargo clippy --all-targets --locked -- -D warnings

  # ─── Summary gate ────────────────────────────────────────────────────────
  homologation-gate:
    name: Homologation gate (required)
    runs-on: ubuntu-latest
    needs:
      - homologation
      - unit-tests-linux
      - cross-compile-check
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          echo "homologation : ${{ needs.homologation.result }}"
          echo "unit-tests   : ${{ needs.unit-tests-linux.result }}"
          echo "cross-compile: ${{ needs.cross-compile-check.result }}"
          if [ "${{ needs.homologation.result }}" != "success" ] || \
             [ "${{ needs.unit-tests-linux.result }}" != "success" ] || \
             [ "${{ needs.cross-compile-check.result }}" != "success" ]; then
            echo "FAIL: one or more jobs did not succeed"
            exit 1
          fi
          echo "PASS: all homologation jobs succeeded"
