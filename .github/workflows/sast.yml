name: SAST

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  sast:
    uses: juninmd/base-actions/.github/workflows/reusable-sast.yml@main
    with:
      # Relatorio no primeiro ciclo; aperte para true depois do triage.
      fail-semgrep: false
