name: Validate
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

# gitleaks-action@v3 requires pull-requests: read to scan PR diffs.
permissions:
  contents: read
  pull-requests: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history for reliable Gitleaks incremental scans
          persist-credentials: false
      - uses: juninmd/base-actions/validate-pr@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
