name: Validate
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for reliable Gitleaks incremental scans
      - uses: juninmd/base-actions/validate-pr@main
