name: Supply Chain

# Dependency + workflow supply-chain gates. Complements security.yml (secret
# scanning) and rust.yml (build/test). Runs on every PR and push, plus weekly so
# newly-published advisories are caught even without a code change.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays, offset from the security.yml gitleaks cron

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

# Default to read-only; jobs opt into the narrow extra scope they need.
permissions:
  contents: read

jobs:
  # cargo-deny enforces deny.toml: RUSTSEC advisories, license allowlist, banned
  # crates, and source allowlist (crates.io only). This is the Rust dependency gate.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2.0.20
        with:
          command: check advisories bans licenses sources

  # Static analysis of the workflows themselves: catches template injection,
  # over-broad permissions, unpinned actions, and dangerous triggers.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab (public repo)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6

  # Supply-chain guard for the install path: `tokenix install-hook` /
  # `install-binary` are purely local (filesystem + PATH). The ONLY external
  # HTTPS endpoint the binary ever contacts is huggingface.co, and that is in the
  # indexer's model download — never in install. This job builds the binary and
  # runs both install commands under harden-runner egress AUDIT, so every
  # outbound HTTPS connection is recorded in the run's "Insights → Network
  # events" report. Expected egress = build dependencies only (crates.io /
  # github); install must add zero. Any new endpoint here is a red flag.
  install-egress-audit:
    name: install-egress-audit
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Cache cargo
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Build release binary
        run: cargo build --release --locked
      # Run both install commands against a throwaway HOME so the runner is not
      # polluted. Everything install touches is local; if either command ever
      # makes an external HTTPS call it surfaces in the egress audit above.
      - name: Run tokenix install under egress audit
        run: |
          export HOME="$(mktemp -d)"
          echo "::group::tokenix install-hook --tool all"
          ./target/release/tokenix install-hook --tool all
          echo "::endgroup::"
          echo "::group::tokenix install-binary"
          ./target/release/tokenix install-binary
          echo "::endgroup::"

  # On PRs, diff the dependency manifests and block introductions of vulnerable or
  # disallowed-license dependencies before they merge.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
