version: 2
updates:
  # Rust dependency updates — the core supply-chain channel for this crate.
  # (npm/pip/docker were removed: no package.json/requirements.txt/Dockerfile exist.)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # increase-if-necessary: bump the Cargo.toml requirement ONLY when the new
    # version falls outside the current range, and always keep Cargo.lock in sync.
    # This keeps manifest + lockfile consistent so `cargo --locked` CI never fails
    # with "cannot update the lock file because --locked was passed".
    # (lockfile-only could bump the lock past the manifest range — e.g. dirs 5→6 —
    # leaving Cargo.toml="5" but Cargo.lock=6.0.0, which breaks every --locked build.)
    versioning-strategy: increase-if-necessary
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions are pinned to commit SHAs; Dependabot bumps the SHA and keeps
  # the trailing `# vX` version comment current, so pinning costs no manual upkeep.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns: ["*"]
