version: 2
updates:
- package-ecosystem: cargo
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  versioning-strategy: auto
  groups:
    cargo-minor-patch:
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
      - '*'
  cooldown:
    default-days: 7
