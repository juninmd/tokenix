# --- Keys, tokens & generic last-resort rules ------------------------------

[[rules]]
id = "private-key-block"
pattern = '-----BEGIN [A-Z0-9 ]*PRIVATE KEY(?: BLOCK)?-----'

[[rules]]
id = "age-secret-key"
pattern = '\bAGE-SECRET-KEY-1[0-9A-Z]{58}\b'

[[rules]]
id = "jwt"
pattern = '\beyJ[A-Za-z0-9_-]{8,}\.eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b'

# Credentials embedded in a URL or DB connection string — redact the password.
# Scheme is restricted to credential-bearing protocols to avoid matching arbitrary
# `foo://a:b@c` strings that appear in prose/logs.
[[rules]]
id = "basic-auth-url"
pattern = '(?i)(?:https?|ftps?|smtps?|ldaps?)://[^\s/:@]{1,64}:([^\s/:@${}<>%][^\s/:@]{5,63})@[^\s/]+'
capture = 1
min_entropy = 3.5

[[rules]]
id = "db-connection-uri"
pattern = '(?i)(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp)://[^\s:@/]+:([^\s:@/${}<>%][^\s:@/]{3,})@'
capture = 1
min_entropy = 2.8

# Generic `key = value` assignment, entropy-gated to cut false positives.
[[rules]]
id = "generic-secret-assignment"
pattern = '''(?i)(?:api[_-]?key|secret|token|password|passwd|pwd|access[_-]?token|client[_-]?secret|private[_-]?key)["' ]?\s*[:=]\s*["']?([A-Za-z0-9+/_-]{16,})'''
capture = 1
min_entropy = 3.5
