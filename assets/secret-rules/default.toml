# Default credential patterns for `tokenix scan-secrets`.
#
# Add your own patterns without touching this file: drop a `*.toml` with the
# same `[[rules]]` shape into `~/.tokenix/secret-rules/` (user) or
# `<repo>/.tokenix/secret-rules/` (per-project). A user/local rule whose `id`
# matches a bundled one overrides it; new ids are appended.
#
# Fields per rule:
#   id          unique label shown in output (required)
#   pattern     Rust `regex` crate syntax — backtracking-free, no lookaround (required)
#   capture     capture group holding the secret, 0 = whole match (default 0)
#   min_entropy minimum Shannon entropy in bits/char to accept the match,
#               0 disables the gate (default 0.0; use ~3.5 for generic rules)
#
# Patterns are anchored on distinctive provider prefixes to stay high-signal and
# low-false-positive. Generic / context rules with an entropy gate are kept LAST
# so a specific provider rule wins when both match the same secret on one line.

# --- Cloud providers -------------------------------------------------------

[[rules]]
id = "aws-access-key-id"
pattern = '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA)[0-9A-Z]{16}\b'

[[rules]]
id = "aws-secret-access-key"
pattern = '''(?i)aws_?secret_?(?:access_?)?key["' ]?\s*[:=]\s*["']?([A-Za-z0-9/+]{40})'''
capture = 1
min_entropy = 4.0

[[rules]]
id = "google-api-key"
pattern = '\bAIza[0-9A-Za-z_-]{35}\b'

[[rules]]
id = "gcp-oauth-client-secret"
pattern = '\bGOCSPX-[0-9A-Za-z_-]{28}\b'

[[rules]]
id = "digitalocean-token"
pattern = '\bdo[oprt]_v1_[0-9a-f]{64}\b'

[[rules]]
id = "azure-storage-account-key"
pattern = '(?i)AccountKey=([A-Za-z0-9+/]{86}==)'
capture = 1

