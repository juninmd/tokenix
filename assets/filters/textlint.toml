[filters.textlint]
description = "Keep textlint findings and problem total, drop filename headers"
match_command = "^(npx\\s+)?textlint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
keep_lines_matching = [
  "^\\s*\\d+:\\d+\\s+(error|warning)",
  "✖",
  "problems?\\b",
  "(?i)error",
]
max_lines = 100
on_empty = "textlint: no issues"

[[tests.textlint]]
name = "findings and total kept"
input = """
/docs/guide.md
  1:5  error  Found double spaces  no-doubled-spaces
  3:1  error  Don't start with lowercase  some-rule

✖ 2 problems (2 errors, 0 warnings)
"""
expected = """  1:5  error  Found double spaces  no-doubled-spaces
  3:1  error  Don't start with lowercase  some-rule
✖ 2 problems (2 errors, 0 warnings)"""

[[tests.textlint]]
name = "clean run collapses"
input = ""
expected = "textlint: no issues"
