[filters.terraform-providers]
description = "Compact terraform providers output"
match_command = "^terraform\\s+providers\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\."
]
keep_lines_matching = [
  "^\\w+",
  "hashicorp/",
  "registry.terraform.io",
  "Error"
]
max_lines = 30

[[tests.terraform-providers]]
name = "providers tree"
input = """
.
├── provider[registry.terraform.io/hashicorp/aws] ~> 5.0
├── provider[registry.terraform.io/hashicorp/random] ~> 3.0
└── module.vpc
    └── provider[registry.terraform.io/hashicorp/aws] ~> 5.0
"""
expected = """
├── provider[registry.terraform.io/hashicorp/aws] ~> 5.0
├── provider[registry.terraform.io/hashicorp/random] ~> 3.0
    └── provider[registry.terraform.io/hashicorp/aws] ~> 5.0"""

[[tests.terraform-providers]]
name = "provider query failure preserved"
input = """
╷
│ Error: Failed to query available provider packages
│
│ Could not retrieve the list of available versions for provider hashicorp/aws
╵
"""
expected = """
│ Error: Failed to query available provider packages
│ Could not retrieve the list of available versions for provider hashicorp/aws"""
