[filters.node-test]
description = "Compact node built-in test runner output — failures and summary only"
match_command = "^node\\s+(--test|--run)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*[✔#]",
  "^\\s*ℹ (tests|suites|pass \\d|cancelled|skipped|todo|duration_ms)",
]
max_lines = 60
on_empty = "node --test: all tests passed"

[[tests.node-test]]
name = "all passing"
input = """
✔ adds numbers (1.2ms)
✔ parses config (0.4ms)
ℹ tests 2
ℹ suites 0
ℹ pass 2
ℹ fail 0
ℹ cancelled 0
ℹ skipped 0
ℹ todo 0
ℹ duration_ms 52.3
"""
expected = "ℹ fail 0"

[[tests.node-test]]
name = "failure details kept"
input = """
✔ adds numbers (1.2ms)
✖ parses config (3.1ms)
  AssertionError [ERR_ASSERTION]: Expected values to be strictly equal:
  actual: undefined
  expected: 8080
ℹ tests 2
ℹ pass 1
ℹ fail 1
ℹ duration_ms 60.1
"""
expected = """✖ parses config (3.1ms)
  AssertionError [ERR_ASSERTION]: Expected values to be strictly equal:
  actual: undefined
  expected: 8080
ℹ fail 1"""
