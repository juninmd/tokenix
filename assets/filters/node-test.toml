    generatedMessage: true,
    code: 'ERR_ASSERTION',
    actual: 3,
    expected: 2,
    operator: 'strictEqual',
    diff: 'simple'
  }
"""
expected = """✖ updateGame handles ghost collision (1.671ms)
ℹ tests 2
ℹ pass 1
ℹ fail 1
✖ failing tests:
test at test/game.test.js:78:1
✖ updateGame handles ghost collision (1.671ms)
  AssertionError [ERR_ASSERTION]: Expected values to be strictly equal:
  3 !== 2
      at TestContext.<anonymous> (file:///w/test/game.test.js:88:10)
    actual: 3,
    expected: 2,"""
