[filters.bun]
description = "Compact bun command output"
match_command = "^bun\\s+(run|test|install|add|remove|pm|x|build|dev)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+ packages",
  "^\\s*installed",
  "^\\s*removed",
  "^\\s*cached",
  "^\\s*resolved",
  "^\\s*fetching",
  "^\\s*downloading",
  "^\\s*extracting",
  "^\\s*linking",
  "^\\s*done",
  "^\\s*elapsed",
]
keep_lines_matching = [
  "error",
  "ERROR",
  "fail",
  "FAIL",
  "panic",
  "warning",
  "WARNING",
  "WARN",
  "^\\s*[✗✖]",
  "^\\s+at ",
  "^\\s+(Expected|Received|Actual)[:\\s]",
  "^\\s*\\d+ \\|",
  "^\\s*\\^\\s*$",
  "^\\s*\\d+ (pass|skip|todo)\\b",
  "^Ran \\d+ tests",
]
max_lines = 40
replace_patterns = [
  ["bun v[\\d.]+", "bun v<version>"],
  ["\\d+\\.\\d+s", "<duration>"],
  ["\\d+\\.\\d+ms", "<duration>"],
  ["[a-z0-9_-]+@[\\d.]+", "<package>@<version>"],
]
deduplicate_blocks = { min_block_lines = 2, similarity = 0.7 }
token_budget = 1500


[[tests.bun]]
name = "test failure keeps assertion payload and stack"
input = """
bun test v1.1.0
test/add.test.ts:
✗ adds numbers [0.12ms]
  error: expect(received).toBe(expected)

  Expected: 4
  Received: 3

      at /app/test/add.test.ts:5:19
 1 pass
 1 fail
Ran 2 tests across 1 file.
"""
expected = """✗ adds numbers [<duration>]
  error: expect(received).toBe(expected)
  Expected: 4
  Received: 3
      at /app/test/add.test.ts:5:19
 1 pass
 1 fail
Ran 2 tests across 1 file."""

[[tests.bun]]
name = "test success keeps counts only"
input = """
bun test v1.1.0
test/add.test.ts:
✓ adds numbers [0.10ms]
 1 pass
 0 fail
Ran 1 tests across 1 file.
"""
expected = """ 1 pass
 0 fail
Ran 1 tests across 1 file."""

[[tests.bun]]
name = "silent success stays empty"
input = ""
expected = ""