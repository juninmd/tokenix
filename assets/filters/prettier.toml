[filters.prettier]
description = "Compact Prettier output"
match_command = "^(npx\\s+)?prettier\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\w+\\.(js|ts|jsx|tsx|json|css|md)\\s*$"
]
keep_lines_matching = [
  "error",
  "SyntaxError",
  "Could not parse"
]
max_lines = 40


[[tests.prettier]]
name = "parse error shown"
input = """
src/main.ts
SyntaxError: Could not parse src/main.ts: Unexpected token (10:5)
"""
expected = "SyntaxError: Could not parse src/main.ts: Unexpected token (10:5)"