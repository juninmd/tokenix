[filters.go-mod-tidy]
description = "Compact go mod tidy output"
match_command = "^go\\s+mod\\s+tidy\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^go: finding",
  "^go: downloading",
  "^go: extracting"
]
max_lines = 20


[[tests.go-mod-tidy]]
name = "missing module error preserved"
input = """
go: finding module for package github.com/acme/internal/util
go: github.com/acme/app imports
	github.com/acme/internal/util: cannot find module providing package github.com/acme/internal/util
"""
expected = """
go: github.com/acme/app imports
	github.com/acme/internal/util: cannot find module providing package github.com/acme/internal/util"""
