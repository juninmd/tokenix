[filters.pip-compile]
description = "Keep pip-compile pinned requirements, drop comment provenance lines"
match_command = "^pip-compile\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*#",
]
keep_lines_matching = [
  "==",
  "(?i)error",
]
max_lines = 200
on_empty = "pip-compile: no requirements"
token_budget = 2500

[[tests.pip-compile]]
name = "pins kept, provenance comments dropped"
input = """
#
# This file is autogenerated by pip-compile
#
click==8.1.7
    # via flask
flask==3.0.0
    # via -r requirements.in
"""
expected = """click==8.1.7
flask==3.0.0"""

[[tests.pip-compile]]
name = "empty collapses"
input = ""
expected = "pip-compile: no requirements"
