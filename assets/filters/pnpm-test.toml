[filters.pnpm-test]
description = "Compact pnpm test output"
match_command = "^pnpm\\s+test\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\$ ",
  "^\\s*Running ",
  "^\\s*Done in"
]
keep_lines_matching = [
  "FAIL",
  "PASS",
  "Test Suites:",
  "Tests:",
  "Error:",
  "TypeError:",
  "AssertionError",
  "●",
  "Expected:",
  "Received:"
]
max_lines = 60

[[tests.pnpm-test]]
name = "tests pass"
input = """
Running test: jest
 PASS  src/utils.test.ts
Test Suites: 1 passed, 1 total
Tests:       10 passed, 10 total
Done in 2.34s.
"""
expected = """
 PASS  src/utils.test.ts
Test Suites: 1 passed, 1 total
Tests:       10 passed, 10 total"""

[[tests.pnpm-test]]
name = "failing test details preserved"
input = """
> myapp@1.0.0 test
> jest

 FAIL  src/auth.test.ts
  ● login › rejects invalid password

    expect(received).toBe(expected)

    Expected: 401
    Received: 200

Test Suites: 1 failed, 1 total
Tests:       1 failed, 9 passed, 10 total
"""
expected = """
 FAIL  src/auth.test.ts
  ● login › rejects invalid password
    Expected: 401
    Received: 200
Test Suites: 1 failed, 1 total
Tests:       1 failed, 9 passed, 10 total"""
