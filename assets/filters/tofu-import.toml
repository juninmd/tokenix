[filters.tofu-import]
description = "Compact OpenTofu import output"
match_command = "^tofu\\s+import\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\w+\\.\\w+:\\s+Importing",
  "^\\s*\\w+\\.\\w+:\\s+Import complete",
  "^Import successful"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "Failed",
  "│ Error",
  "│ Warning"
]
max_lines = 30
on_empty = "tofu import: done"

[[tests.tofu-import]]
name = "clean import"
input = """
aws_instance.web: Importing from ID "i-1234567890abcdef0"...
aws_instance.web: Import complete!
Import successful!
"""
expected = "tofu import: done"

[[tests.tofu-import]]
name = "error shown"
input = """
aws_instance.web: Importing from ID "i-1234567890abcdef0"...
Error: Error importing instance: InvalidInstanceID.NotFound
"""
expected = "Error: Error importing instance: InvalidInstanceID.NotFound"