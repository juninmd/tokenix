[filters.git-worktree]
description = "Compact git worktree output"
match_command = "^git\\s+worktree\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+",
  "\\[",
  "\\]",
  "detached"
]
max_lines = 30

[[tests.git-worktree]]
name = "list worktrees"
input = """
/path/to/repo          abc1234 [main]
/path/to/repo-feature  def5678 [feature/new-ui]
"""
expected = """
/path/to/repo          abc1234 [main]
/path/to/repo-feature  def5678 [feature/new-ui]"""

[[tests.git-worktree]]
name = "already checked out error preserved"
input = """
fatal: 'feature/new-ui' is already checked out at '/path/to/repo-feature'
"""
expected = "fatal: 'feature/new-ui' is already checked out at '/path/to/repo-feature'"
