[filters.biome]
description = "Compact biome check/format output"
match_command = "^biome\\s+(check|lint|format)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+ files?",
  "^\\s*No issues found",
  "^\\s*All checks passed",
  "^\\s*Formatted"
]
keep_lines_matching = [
  "error:",
  "warning:",
  "info:",
  "hint:"
]
max_lines = 60
on_empty = "biome: no issues"

[[tests.biome]]
name = "clean check"
input = """
Checked 50 files in 200ms. No issues found.
"""
expected = "biome: no issues"

[[tests.biome]]
name = "issues shown"
input = """
error: Unexpected console statement. Use a logger instead.
  ┌─ src/main.ts:10:1
  │
10 │ console.log("hello");
   │ ^^^^^^^^^^^^^^^^^^^

warning: Variable 'x' is assigned a value but never used.
  ┌─ src/main.ts:15:5
  │
15 │     let x = 5;
   │     ^^^^^^^^^^
"""
expected = """
error: Unexpected console statement. Use a logger instead.
  ┌─ src/main.ts:10:1
  │
10 │ console.log("hello");
   │ ^^^^^^^^^^^^^^^^^^^

warning: Variable 'x' is assigned a value but never used.
  ┌─ src/main.ts:15:5
  │
15 │     let x = 5;
   │     ^^^^^^^^^^"""