[filters.biome]
description = "Compact biome check/lint/format/ci output"
match_command = "^biome\\s+(check|lint|format|ci)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+ files?",
  "^\\s*No issues found",
  "^\\s*All checks passed",
  "^\\s*Formatted",
  "^\\s*Checked \\d+ files?"
]
max_lines = 100
on_empty = "biome: ok"

[[tests.biome]]
name = "issues shown"
input = """
error: Unexpected console statement. Use a logger instead.
  ┌─ src/main.ts:10:1
  │
10 │ console.log("hello");
   │ ^^^^^^^^^^^^^^^^^^^
warning: Variable 'x' is assigned a value but never used.
  ┌─ src/main.ts:15:5
  │
15 │     let x = 5;
   │     ^^^^^^^^^^
"""
expected = """error: Unexpected console statement. Use a logger instead.
  ┌─ src/main.ts:10:1
  │
10 │ console.log("hello");
   │ ^^^^^^^^^^^^^^^^^^^
warning: Variable 'x' is assigned a value but never used.
  ┌─ src/main.ts:15:5
  │
15 │     let x = 5;
   │     ^^^^^^^^^^"""

[[tests.biome]]
name = "clean ci run reports ok"
command = "biome ci ."
input = """
Checked 42 files in 12ms. No fixes applied.
"""
expected = "biome: ok"

[[tests.biome]]
name = "empty input reports ok"
input = ""
expected = "biome: ok"
