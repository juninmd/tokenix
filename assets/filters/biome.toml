[filters.biome]
description = "Compact biome check/format output"
match_command = "^biome\\s+(check|lint|format)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+ files?",
  "^\\s*No issues found",
  "^\\s*All checks passed",
  "^\\s*Formatted",
  "^\\s*Checked \\d+ files?"
]
max_lines = 100


[[tests.biome]]
name = "issues shown"
input = """
error: Unexpected console statement. Use a logger instead.
  ┌─ src/main.ts:10:1
  │
10 │ console.log("hello");
   │ ^^^^^^^^^^^^^^^^^^^

warning: Variable 'x' is assigned a value but never used.
  ┌─ src/main.ts:15:5
  │
15 │     let x = 5;
   │     ^^^^^^^^^^
"""
expected = """error: Unexpected console statement. Use a logger instead.
  ┌─ src/main.ts:10:1
  │
10 │ console.log("hello");
   │ ^^^^^^^^^^^^^^^^^^^
warning: Variable 'x' is assigned a value but never used.
  ┌─ src/main.ts:15:5
  │
15 │     let x = 5;
   │     ^^^^^^^^^^"""