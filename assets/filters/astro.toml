[filters.astro]
description = "Keep astro build totals and errors, drop per-page generated lines"
match_command = "^(npx\\s+)?astro\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "▶ ",
  "└─ ",
  "^\\s*generating ",
]
keep_lines_matching = [
  "page\\(s\\) built",
  "Complete!",
  "Server built",
  "built in",
  "(?i)error",
  "(?i)fail",
  "^\\s+(Hint|Location|Error reference|Stack trace):",
  "^\\s+at ",
  "^\\s{4,}\\S",
]
max_lines = 60
on_empty = "astro: build done"

[[tests.astro]]
name = "build totals kept, per-page dropped"
input = """
12:00:00 [build] Building static entrypoints...
▶ src/pages/index.astro
└─ /index.html (+12ms)
12:00:01 [build] 10 page(s) built in 1.23s
12:00:01 [build] Complete!
"""
expected = """12:00:01 [build] 10 page(s) built in 1.23s
12:00:01 [build] Complete!"""

[[tests.astro]]
name = "build error with hint and stack kept"
input = """
▶ src/pages/index.astro
 error   Could not resolve "./missing" from "src/pages/index.astro".
  Hint:
    This is often caused by a typo in the import path.
  Stack trace:
    at nodeResolve (/app/node_modules/vite/dist/node.js:1:100)
"""
expected = """ error   Could not resolve "./missing" from "src/pages/index.astro".
  Hint:
    This is often caused by a typo in the import path.
  Stack trace:
    at nodeResolve (/app/node_modules/vite/dist/node.js:1:100)"""
