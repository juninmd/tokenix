[filters.terraform-graph]
description = "Compact terraform graph output"
match_command = "^terraform\\s+graph\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "digraph",
  "->",
  "label",
  "shape",
  "Error"
]
max_lines = 50
on_empty = "terraform graph: empty"

[[tests.terraform-graph]]
name = "graph output"
input = """
digraph {
  compound = true
  newrank = true
  "aws_instance.web" -> "provider.aws"
  "aws_s3_bucket.data" -> "provider.aws"
}
"""
expected = "digraph {\n  \"aws_instance.web\" -> \"provider.aws\"\n  \"aws_s3_bucket.data\" -> \"provider.aws\""

[[tests.terraform-graph]]
name = "missing configuration error preserved"
input = """
╷
│ Error: No configuration files
│
│ Apply requires configuration to be present.
╵
"""
expected = "│ Error: No configuration files"
