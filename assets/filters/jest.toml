[filters.jest]
description = "Compact Jest test output"
match_command = "^((pnpm\\s+exec|pnpm\\s+dlx|yarn\\s+dlx|deno\\s+task|npx|bunx|pnpm|yarn)\\s+)?jest\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*PASS\\s+",
  "^\\s*Test Suites:",
  "^\\s*Tests:",
  "^\\s*Snapshots:",
  "^\\s*Time:",
  "^\\s*Ran all test suites"
]
keep_lines_matching = [
  "FAIL",
  "● ",
  "expect",
  "Received:",
  "Expected:",
  "TypeError",
  "ReferenceError",
  "SyntaxError"
]
max_lines = 80


[[tests.jest]]
name = "test failure shown"
input = """
 FAIL  src/utils.test.ts
  ● add › should add two numbers

    expect(received).toBe(expected) // Object.is equality

    Expected: 3
    Received: 4

      12 |   expect(add(1, 2)).toBe(3);
      13 | });

Test Suites: 1 failed, 1 passed, 2 total
Tests:       1 failed, 14 passed, 15 total
"""
expected = """
 FAIL  src/utils.test.ts
  ● add › should add two numbers
    expect(received).toBe(expected) // Object.is equality
    Expected: 3
    Received: 4
      12 |   expect(add(1, 2)).toBe(3);"""

