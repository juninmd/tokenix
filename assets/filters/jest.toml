[filters.jest]
description = "Compact Jest output — short-circuit all-pass runs, keep failure detail verbatim"
match_command = "^((pnpm\\s+exec|pnpm\\s+dlx|yarn\\s+dlx|deno\\s+task|npx|bunx|pnpm|yarn)\\s+)?jest\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*PASS\\s+",
  "^\\s*✓",
  "^\\s*Test Suites:\\s+\\d+ passed",
  "^\\s*Tests:\\s+\\d+ passed",
  "^\\s*Snapshots:\\s+0 total",
  "^\\s*Time:",
  "^\\s*Ran all test suites",
]
match_output = [
  { pattern = "Tests:\\s+\\d+ passed, \\d+ total", message = "ok (all tests passed)", unless = "(?i)fail|error|✕|●" },
]
max_lines = 80

[[tests.jest]]
name = "all tests passed short-circuits to ok"
input = """
PASS src/utils.test.ts
PASS src/app.test.ts

Test Suites: 2 passed, 2 total
Tests:       15 passed, 15 total
Snapshots:   0 total
Time:        1.2 s
Ran all test suites.
"""
expected = "ok (all tests passed)"

[[tests.jest]]
name = "failure keeps assertion, code frame, caret and stack"
input = """
PASS src/app.test.ts
 FAIL  src/utils.test.ts
  ● add › should add two numbers

    expect(received).toBe(expected) // Object.is equality

    Expected: 3
    Received: 4

      11 | test('adds', () => {
    > 12 |   expect(add(1, 2)).toBe(3);
         |                     ^
      13 | });

      at Object.<anonymous> (src/utils.test.ts:12:21)

Test Suites: 1 failed, 1 passed, 2 total
Tests:       1 failed, 14 passed, 15 total
Snapshots:   0 total
Time:        1.4 s
Ran all test suites.
"""
expected = """
 FAIL  src/utils.test.ts
  ● add › should add two numbers
    expect(received).toBe(expected) // Object.is equality
    Expected: 3
    Received: 4
      11 | test('adds', () => {
    > 12 |   expect(add(1, 2)).toBe(3);
         |                     ^
      13 | });
      at Object.<anonymous> (src/utils.test.ts:12:21)
Test Suites: 1 failed, 1 passed, 2 total
Tests:       1 failed, 14 passed, 15 total"""

[[tests.jest]]
name = "silent success stays empty"
input = ""
expected = ""
