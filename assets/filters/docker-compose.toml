[filters.docker-compose]
description = "Compact docker compose output"
match_command = "^docker\\s+compose\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+\\.\\d+s",
  "^\\s*\\d+/\\d+",
  "^\\s*=>",
  "^\\s*CACHED",
  "^\\s*DONE",
  "^\\s*CREATED",
  "^\\s*STARTED",
  "^\\s*HEALTHY",
  "^\\s*UNHEALTHY"
]
keep_lines_matching = [
  "error:",
  "failed to",
  "ERROR:",
  "unhealthy",
  "exited",
  "killed"
]
max_lines = 40


