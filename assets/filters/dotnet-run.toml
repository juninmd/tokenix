[filters.dotnet-run]
description = "Compact `dotnet run` output — drop build/restore banner noise, keep application output and build errors."
match_command = "^dotnet\\s+run\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Determining projects to restore",
  "^\\s*Restored ",
  "^\\s*All projects are up-to-date for restore",
  "^Build succeeded\\.$",
  "^\\s*\\d+ Warning\\(s\\)",
  "^\\s*\\d+ Error\\(s\\)",
  "^\\s*Time Elapsed ",
]
keep_lines_matching = [
  "error",
  "Error",
  "Exception",
  "Unhandled",
  ": warning ",
  ": error ",
]
max_lines = 60
on_empty = "dotnet run: ok"

[[tests.dotnet-run]]
name = "build error preserved"
input = """
Determining projects to restore...
Restored /app/app.csproj (in 120 ms).
/app/Program.cs(10,13): error CS0103: The name 'foo' does not exist in the current context
    1 Error(s)
"""
expected = "/app/Program.cs(10,13): error CS0103: The name 'foo' does not exist in the current context"

[[tests.dotnet-run]]
name = "clean run with no captured app output falls back to on_empty"
input = """
Determining projects to restore...
All projects are up-to-date for restore.
Build succeeded.
    0 Warning(s)
    0 Error(s)
Time Elapsed 00:00:02.34
"""
expected = "dotnet run: ok"
