[filters.bat]
description = "Compact bat (cat) output"
match_command = "^bat\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
max_lines = 100

[[tests.bat]]
name = "file content"
input = """
  1 | fn main() {
  2 |     println!("Hello, world!");
  3 | }
"""
expected = """
  1 | fn main() {
  2 |     println!("Hello, world!");
  3 | }"""

[[tests.bat]]
name = "missing file error preserved"
input = """
[bat error]: 'src/missing.rs': No such file or directory (os error 2)
"""
expected = "[bat error]: 'src/missing.rs': No such file or directory (os error 2)"
