[filters.ctest]
description = "Compact ctest output: keep failures and the pass/fail summary"
match_command = "^ctest\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Start\\s+\\d+:",
  "^Test project ",
  "^\\s*\\d+/\\d+ Test\\s+#\\d+:.*Passed",
]
max_lines = 50
replace_patterns = [
  ["\\d+\\.\\d+ sec", "<duration>"],
]
token_budget = 1500

[[tests.ctest]]
name = "output-on-failure assertion payload survives"
input = """
Test project /work/build
    Start 1: math_test
1/3 Test #1: math_test ........................   Passed    0.01 sec
    Start 2: io_test
2/3 Test #2: io_test ..........................***Failed    0.05 sec
/work/tests/io_test.cc:42: Failure
Expected equality of these values:
  read_count
    Which is: 5
  6
    Start 3: net_test
3/3 Test #3: net_test .........................   Passed    0.02 sec

67% tests passed, 1 tests failed out of 3
Total Test time (real) =   0.09 sec

The following tests FAILED:
	  2 - io_test (Failed)
Errors while running CTest
"""
expected = """2/3 Test #2: io_test ..........................***Failed    <duration>
/work/tests/io_test.cc:42: Failure
Expected equality of these values:
  read_count
    Which is: 5
  6
67% tests passed, 1 tests failed out of 3
Total Test time (real) =   <duration>
The following tests FAILED:
	  2 - io_test (Failed)
Errors while running CTest"""

[[tests.ctest]]
name = "all pass collapses to summary"
input = """
Test project /work/build
    Start 1: math_test
1/2 Test #1: math_test ........................   Passed    0.01 sec
    Start 2: io_test
2/2 Test #2: io_test ..........................   Passed    0.03 sec

100% tests passed, 0 tests failed out of 2
Total Test time (real) =   0.04 sec
"""
expected = """100% tests passed, 0 tests failed out of 2
Total Test time (real) =   <duration>"""
