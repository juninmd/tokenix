[filters.dart-test]
description = "Keep dart test final result and failures, drop passing tick lines"
match_command = "^dart\\s+test\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\d\\d:\\d\\d \\+\\d+: .*[^!]$",
]
keep_lines_matching = [
  "All tests passed",
  "Some tests failed",
  "-\\d+:",
  "\\[E\\]",
  "(?i)error",
  "^\\s+Expected:",
  "^\\s+Actual:",
  "^\\s+Which:",
  "^\\s+Exception:",
  "^\\s+package:",
  "^\\s+\\S+\\.dart[ :]\\d",
]
max_lines = 80
on_empty = "dart test: passed"

[[tests.dart-test]]
name = "failure keeps assertion payload and stack frames"
input = """
00:01 +1: test/calc_test.dart: adds numbers
00:02 +1 -1: test/calc_test.dart: subtracts numbers [E]
  Expected: <3>
    Actual: <4>
     Which: is not <3>

  package:matcher                       expect
  test/calc_test.dart 12:5              main.<fn>

00:02 +1 -1: Some tests failed.
"""
expected = """00:02 +1 -1: test/calc_test.dart: subtracts numbers [E]
  Expected: <3>
    Actual: <4>
     Which: is not <3>
  package:matcher                       expect
  test/calc_test.dart 12:5              main.<fn>
00:02 +1 -1: Some tests failed."""

[[tests.dart-test]]
name = "all pass kept"
input = """
00:01 +1: test one
00:02 +10: All tests passed!
"""
expected = "00:02 +10: All tests passed!"
