[filters.yarn-install]
description = "Compact yarn install output"
match_command = "^yarn\\s+(install|add|i)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]",
  "➤",
  "fetching",
  "linking",
  "Building fresh packages",
  "success.*saved",
  "Done in",
  "warning.*package-lock",
  "warning.*deprecated",
  "^yarn install v",
  "^yarn add v",
  "^\\[\\d+/\\d+\\]",
  "^info "
]
max_lines = 40


[[tests.yarn-install]]
name = "missing version error preserved"
input = """
yarn install v1.22.19
[1/5] Validating package.json...
error Couldn't find any versions for "left-pad" that matches "99.9.9"
info Visit https://yarnpkg.com/en/docs/cli/install for documentation about this command.
"""
expected = """
error Couldn't find any versions for "left-pad" that matches "99.9.9\""""

[[tests.yarn-install]]
name = "silent success stays empty"
input = ""
expected = ""