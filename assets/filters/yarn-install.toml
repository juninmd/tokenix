[filters.yarn-install]
description = "Compact yarn install output"
match_command = "^yarn\\s+(install|add|i)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]",
  "➤",
  "fetching",
  "linking",
  "Building fresh packages",
  "success.*saved",
  "Done in",
  "warning.*package-lock",
  "warning.*deprecated"
]
max_lines = 40
on_empty = "yarn install: ok"

[[tests.yarn-install]]
name = "yarn install clean"
input = """
yarn install v1.22.19
[1/5] Validating package.json...
[2/5] Resolving packages...
[3/5] Fetching packages...
[4/5] Linking dependencies...
[5/5] Building fresh packages...
Done in 5.23s.
"""
expected = "yarn install: ok"