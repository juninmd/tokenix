[filters.golangci-lint]
description = "Compact golangci-lint output"
match_command = "^golangci-lint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Issues:",
  "^\\s*Found \\d+ issues"
]
keep_lines_matching = [
  "\\.go:\\d+:\\d+:",
  "error:",
  "warning:",
  "^\\t",
  "^\\s+\\^"
]
max_lines = 60


[[tests.golangci-lint]]
name = "issues shown with source line and caret"
input = """
main.go:10:5: unused variable x (unused)
	x := 5
	^
pkg/utils/utils.go:15:1: line too long (lll)
"""
expected = """
main.go:10:5: unused variable x (unused)
	x := 5
	^
pkg/utils/utils.go:15:1: line too long (lll)"""

[[tests.golangci-lint]]
name = "silent success stays empty"
input = ""
expected = ""
