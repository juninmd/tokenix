[filters.go-lint]
description = "Compact go lint output (golint)"
match_command = "^golint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "\\.go:\\d+:\\d+:",
  "error:",
  "warning:"
]
max_lines = 50


[[tests.go-lint]]
name = "issues shown including subdirectory paths"
input = """
main.go:10:5: exported function Add should have comment or be unexported
pkg/utils/utils.go:15:1: don't use ALL_CAPS in Go names; use CamelCase
"""
expected = """
main.go:10:5: exported function Add should have comment or be unexported
pkg/utils/utils.go:15:1: don't use ALL_CAPS in Go names; use CamelCase"""

[[tests.go-lint]]
name = "silent success stays empty"
