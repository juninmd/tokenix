[filters.ruff]
description = "Compact ruff lint/check output"
match_command = "^ruff\\s+(check|lint|format)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+ files?",
  "^\\s*All checks passed",
  "^\\s*No issues found",
  "^\\s*Formatted",
  "^\\s*Found \\d+ issues?\\b"
]
max_lines = 100


[[tests.ruff]]
name = "issues shown"
input = """
src/main.py:10:5: F841 Local variable `x` assigned to but never used
src/main.py:15:1: E501 Line too long (120 > 88)
Found 2 issues.
"""
expected = """src/main.py:10:5: F841 Local variable `x` assigned to but never used
src/main.py:15:1: E501 Line too long (120 > 88)"""