[filters.swift-build]
description = "Compact swift build output"
match_command = "^swift\\s+build\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Compile ",
  "^\\s*Linking ",
  "^\\s*Build complete"
]
keep_lines_matching = [
  "error:",
  "warning:",
  "note:"
]
max_lines = 60
on_empty = "swift build: success"

[[tests.swift-build]]
name = "clean build"
input = """
Compile MyPackage main.swift
Linking .build/debug/MyPackage
Build complete! (2.3s)
"""
expected = "swift build: success"

[[tests.swift-build]]
name = "error shown"
input = """
Compile MyPackage main.swift
main.swift:10:5: error: cannot find 'foo' in scope
    foo()
    ^~~
"""
expected = """
Compile MyPackage main.swift
main.swift:10:5: error: cannot find 'foo' in scope
    foo()
    ^~~"""