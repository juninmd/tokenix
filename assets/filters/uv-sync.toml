[filters.uv-sync]
description = "Compact uv sync output"
match_command = "^uv\\s+sync\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Resolving",
  "^\\s*Installing",
  "^\\s*Building",
  "^\\s*Installed",
  "^\\s*Updated",
  "packages in",
  "in \\d+\\.\\d+s"
]
max_lines = 30


[[tests.uv-sync]]
name = "pyproject parse error preserved"
input = """
error: Failed to parse `pyproject.toml` during settings discovery:
  TOML parse error at line 12, column 1
"""
expected = """
error: Failed to parse `pyproject.toml` during settings discovery:
  TOML parse error at line 12, column 1"""

[[tests.uv-sync]]
name = "silent success stays empty"
input = ""
expected = ""