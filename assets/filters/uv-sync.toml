[filters.uv-sync]
description = "Compact uv sync output"
match_command = "^uv\\s+sync\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Resolving",
  "^\\s*Installing",
  "^\\s*Building",
  "^\\s*Installed",
  "^\\s*Updated",
  "packages in",
  "in \\d+\\.\\d+s"
]
max_lines = 30
on_empty = "uv sync: ok"

[[tests.uv-sync]]
name = "uv sync clean"
input = """
Resolving dependencies...
Installing 45 packages...
Installed 45 packages in 2.1s
"""
expected = "uv sync: ok"

[[tests.uv-sync]]
name = "pyproject parse error preserved"
input = """
error: Failed to parse `pyproject.toml` during settings discovery:
  TOML parse error at line 12, column 1
"""
expected = """
error: Failed to parse `pyproject.toml` during settings discovery:
  TOML parse error at line 12, column 1"""
