[filters.cargo-fmt]
description = "Compact cargo fmt output"
match_command = "^cargo\\s+fmt\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Checking",
  "^\\s*Formatted"
]
keep_lines_matching = [
  "error:",
  "Diff at"
]
max_lines = 30


[[tests.cargo-fmt]]
name = "check mode with diff"
input = """
Checking fmt (0.12.0)
Diff at src/main.rs:10:5
-    let x = 5;
+    let x = 5 ;
"""
expected = "Diff at src/main.rs:10:5"

[[tests.cargo-fmt]]
name = "silent success stays empty"
input = ""
expected = ""