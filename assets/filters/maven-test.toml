[filters.maven-test]
description = "Compact Maven test output"
match_command = "^mvn\\s+test\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\[INFO\\]\\s+---",
  "^\\[INFO\\]\\s+Running ",
  "^\\[INFO\\]\\s+Tests run:",
  "^\\[INFO\\]\\s+BUILD SUCCESS"
]
keep_lines_matching = [
  "ERROR",
  "FAILURE",
  "FAILURE!",
  "Tests run:.*Failures:",
  "Tests run:.*Errors:",
  "<<< FAILURE",
  "<<< ERROR",
  "^\\s+(?:symbol|location|required|found|reason):",
  "^[\\w.]*(?:Exception|Error)(?::|$)",
  "^Caused by:",
  "^\\s*(?:expected|but was)\\s*:"
]
max_lines = 60


