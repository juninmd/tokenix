[filters.bats]
description = "Compact bats (bash test) TAP output: keep failures and diagnostics"
match_command = "\\bbats\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^ok \\d+",
  "^\\d+\\.\\.\\d+$",
]
keep_lines_matching = [
  "^not ok ",
  "^# ",
  "(?i)error",
  "failed",
]
max_lines = 60
on_empty = "bats: all passed"
token_budget = 2000

[[tests.bats]]
name = "failures and diagnostics kept"
input = """
1..3
ok 1 adds numbers
not ok 2 divides numbers
# (in test file math.bats, line 10)
#   `[ "$result" -eq 5 ]' failed
ok 3 subtracts numbers
"""
expected = """not ok 2 divides numbers
# (in test file math.bats, line 10)
#   `[ \"$result\" -eq 5 ]' failed"""

[[tests.bats]]
name = "all passed collapses"
input = """
1..2
ok 1 adds numbers
ok 2 subtracts numbers
"""
expected = "bats: all passed"
