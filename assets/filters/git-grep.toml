[filters.git-grep]
description = "Compact git grep output"
match_command = "^git\\s+grep\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  ":",
  "error:",
  "fatal:"
]
max_lines = 50
on_empty = "git grep: no matches"

[[tests.git-grep]]
name = "matches found"
input = """
src/main.rs:    let foo = "bar";
src/utils.rs:   println!("{}", foo);
"""
expected = """
src/main.rs:    let foo = "bar";
src/utils.rs:   println!("{}", foo);"""

[[tests.git-grep]]
name = "no matches"
input = """
"""
expected = "git grep: no matches"