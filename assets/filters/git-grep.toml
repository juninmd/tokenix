[filters.git-grep]
description = "Compact git grep output"
match_command = "^git\\s+grep\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  ":",
  "error:",
  "fatal:"
]
max_lines = 50

[[tests.git-grep]]
name = "matches found"
input = """
src/main.rs:    let foo = "bar";
src/utils.rs:   println!("{}", foo);
"""
expected = """
src/main.rs:    let foo = "bar";
src/utils.rs:   println!("{}", foo);"""

[[tests.git-grep]]
name = "silent success stays empty"
input = ""
expected = ""