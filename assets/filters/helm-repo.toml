[filters.helm-repo]
description = "Compact helm repo output"
match_command = "^helm\\s+repo\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^NAME\\s+URL"
]
keep_lines_matching = [
  "^\\w+",
  "http",
  "https",
  "oci://"
]
max_lines = 20
on_empty = "helm repo: none"

[[tests.helm-repo]]
name = "list repos"
input = """
NAME    URL
stable  https://charts.helm.sh/stable
bitnami https://charts.bitnami.com/bitnami
"""
expected = """
stable  https://charts.helm.sh/stable
bitnami https://charts.bitnami.com/bitnami"""

[[tests.helm-repo]]
name = "add repo"
input = """
"stable" has been added to your repositories
"""
expected = "helm repo: none"