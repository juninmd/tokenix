[filters.revive]
description = "Compact revive output"
match_command = "^revive\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+\\.go:\\d+:\\d+:",
  "error:",
  "warning:"
]
max_lines = 50
on_empty = "revive: no issues"

[[tests.revive]]
name = "clean"
input = """
"""
expected = "revive: no issues"

[[tests.revive]]
name = "issues shown"
input = """
main.go:10:5: exported: Add: exported function should have comment
utils.go:15:1: var-naming: don't use underscores in Go names
"""
expected = """
main.go:10:5: exported: Add: exported function should have comment
utils.go:15:1: var-naming: don't use underscores in Go names"""