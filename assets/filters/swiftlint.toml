[filters.swiftlint]
description = "Compact swiftlint output: keep violations and the summary"
match_command = "\\bswiftlint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Linting '",
  "^Linting Swift files",
  "^Collecting ",
]
keep_lines_matching = [
  ": (?:warning|error):",
  "Found \\d+ violation",
  "Done linting",
]
max_lines = 60
token_budget = 2000

[[tests.swiftlint]]
name = "violations kept, per-file noise dropped"
input = """
Linting Swift files in current working directory
Linting 'AppDelegate.swift' (1/42)
Linting 'ViewController.swift' (2/42)
/work/Sources/App/View.swift:12:1: warning: Line Length Violation: Line should be 120 characters or less (line_length)
/work/Sources/App/Model.swift:8:5: error: Force Cast Violation: Force casts should be avoided (force_cast)
Done linting! Found 2 violations, 1 serious in 42 files.
"""
expected = """/work/Sources/App/View.swift:12:1: warning: Line Length Violation: Line should be 120 characters or less (line_length)
/work/Sources/App/Model.swift:8:5: error: Force Cast Violation: Force casts should be avoided (force_cast)
Done linting! Found 2 violations, 1 serious in 42 files."""

[[tests.swiftlint]]
name = "clean run keeps summary"
input = """
Linting Swift files in current working directory
Linting 'App.swift' (1/1)
Done linting! Found 0 violations, 0 serious in 1 file.
"""
expected = """Done linting! Found 0 violations, 0 serious in 1 file."""
