[filters.cargo-check]
description = "Compact cargo check output"
match_command = "^cargo\\s+check\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Checking",
  "^\\s*Fresh",
  "^\\s*Downloading",
  "^\\s*Downloaded"
]
max_lines = 60


[[tests.cargo-check]]
name = "full diagnostic block shown"
input = """
Checking my-crate v0.1.0
warning: unused variable: `x`
 --> src/main.rs:10:9
  |
10 |     let x = 5;
  |         ^^ help: if this is intentional, prefix with underscore: `_x`
  |
  = note: `#[warn(unused_variables)]` on by default

Finished dev [unoptimized + debuginfo] target(s) in 0.5s
"""
expected = """warning: unused variable: `x`
 --> src/main.rs:10:9
  |
10 |     let x = 5;
  |         ^^ help: if this is intentional, prefix with underscore: `_x`
  |
  = note: `#[warn(unused_variables)]` on by default
Finished dev [unoptimized + debuginfo] target(s) in 0.5s"""

