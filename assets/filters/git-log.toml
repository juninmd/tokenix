[filters.git-log]
description = "Compact git log output"
match_command = "^git\\s+log\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Author:",
  "^Date:"
]
keep_lines_matching = [
  "^commit ",
  "^    "
]
max_lines = 40
on_empty = "git log: no commits"

[[tests.git-log]]
name = "compact log"
input = """
commit abc123def456 (HEAD -> main, origin/main)
Author: John Doe <john@example.com>
Date:   Mon Jan 15 10:30:00 2024 +0000

    Add new feature

commit def456abc123
Author: Jane Smith <jane@example.com>
Date:   Fri Jan 12 15:45:00 2024 +0000

    Fix bug in parser
"""
expected = """
commit abc123def456 (HEAD -> main, origin/main)
    Add new feature
commit def456abc123
    Fix bug in parser"""