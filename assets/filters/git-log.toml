[filters.git-log]
description = "Compact git log: short hash, refs, subject and the first body lines of each commit"
match_command = "^git\\s+log\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Author:",
  "^Date:",
  "(?i)^    (co-authored-by|signed-off-by|reviewed-by|acked-by|tested-by|reported-by|change-id|claude-session):",
]
keep_lines_matching = [
  "^commit ",
  "^    ",
  "^Merge:",
]
# Compact variants (`git log --oneline`, `--graph`) don't match the full-log keep
# rules; show the real output instead of a false "no commits".
passthrough_when_emptied = true
# Hashes stay usable: an agent's next step is `git show <hash>`.
replace_patterns = [
  ["^commit ([a-f0-9]{12})[a-f0-9]{28}", "commit $1"],
]
# One section per commit: the end pattern never matches, so each `commit` line
# starts the next section. The rest of a long body is `git show` away.
extract_sections = [
  { start_pattern = "^commit ", end_pattern = "[^\\s\\S]", include_markers = true, split_on_start = true, max_lines = 4 },
]
token_budget = 3000

[[tests.git-log]]
name = "oneline format is not falsely reported empty"
input = """
0852d57 feat: scan-secrets Copilot Chat DB
9f36421 chore(release): v0.33.2
44f26a4 fix: robustness pass
"""
expected = """
0852d57 feat: scan-secrets Copilot Chat DB
9f36421 chore(release): v0.33.2
44f26a4 fix: robustness pass"""

[[tests.git-log]]
name = "compact log keeps every commit subject"
input = """
commit abc123def456 (HEAD -> main, origin/main)
Author: John Doe <john@example.com>
Date:   Mon Jan 15 10:30:00 2024 +0000

    Add new feature

commit def456abc123
Author: Jane Smith <jane@example.com>
Date:   Fri Jan 12 15:45:00 2024 +0000

    Fix bug in parser
"""
expected = """
commit abc123def456 (HEAD -> main, origin/main)
    Add new feature
commit def456abc123
    Fix bug in parser"""

[[tests.git-log]]
name = "full hashes shortened and long bodies capped per commit"
input = """
commit 0123456789abcdef0123456789abcdef01234567 (HEAD -> main)
Author: John Doe
Date:   Mon Jan 15 10:30:00 2024 +0000

    fix(index): stop perpetual refresh

    The inline refresh counted every dirty file.
    Second line of body.
    Third line of body.
    Fourth line of body.

    Co-Authored-By: Someone <someone@example.com>

commit fedcba9876543210fedcba9876543210fedcba98
Author: Jane Smith
Date:   Fri Jan 12 15:45:00 2024 +0000

    docs: tweak wording
"""
expected = """
commit 0123456789ab (HEAD -> main)
    fix(index): stop perpetual refresh
    The inline refresh counted every dirty file.
    Second line of body.
    [... 2 lines omitted ...]
commit fedcba987654
    docs: tweak wording"""
