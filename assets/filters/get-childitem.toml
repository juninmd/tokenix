[filters.get-childitem]
description = "Compact PowerShell Get-ChildItem directory listings"
match_command = "^(Get-ChildItem|gci)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*FullName\\s*$",
  "^\\s*--------\\s*$",
]
truncate_lines_at = 200
max_lines = 60
token_budget = 2000

[[tests.get-childitem]]
name = "listing preserved"
input = """
    Directory: D:\\Solutions\\pessoal\\tokenix\\src

Mode    LastWriteTime    Length Name
----    -------------    ------ ----
-a---   2026-06-16          120 main.rs
-a---   2026-06-16        45000 filters.rs
"""
expected = """
    Directory: D:\\Solutions\\pessoal\\tokenix\\src
Mode    LastWriteTime    Length Name
----    -------------    ------ ----
-a---   2026-06-16          120 main.rs
-a---   2026-06-16        45000 filters.rs"""

[[tests.get-childitem]]
name = "empty directory"
input = """
"""
expected = ""

[[tests.get-childitem]]
name = "select full name strips header"
command = "Get-ChildItem -Recurse | Select-Object FullName"
input = """
FullName
--------
C:\\repo\\src\\main.rs
C:\\repo\\src\\lib.rs
"""
expected = """C:\\repo\\src\\main.rs
C:\\repo\\src\\lib.rs"""

