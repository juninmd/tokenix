[filters.go-build]
description = "Compact go build output"
match_command = "^go\\s+build\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^# "
]
keep_lines_matching = [
  "error:",
  "warning:",
  "undefined:",
  "cannot find package"
]
max_lines = 40


[[tests.go-build]]
name = "build error shown"
input = """
# github.com/user/project
./main.go:10:5: undefined: foo
"""
expected = "./main.go:10:5: undefined: foo"