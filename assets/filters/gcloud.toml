[filters.gcloud]
description = "Compact gcloud output"
match_command = "^gcloud\\s+\\w+\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Created ",
  "^Updated ",
  "^Deleted ",
  "^Listed ",
  "^Operation ",
  "^Waiting for ",
  "^DONE"
]
keep_lines_matching = [
  "ERROR:",
  "ERROR ",
  "Failed",
  "FAILED",
  "Permission denied",
  "Quota exceeded"
]
max_lines = 40
on_empty = "gcloud: ok"

[[tests.gcloud]]
name = "clean operation"
input = """
Created [https://compute.googleapis.com/projects/my-project/zones/us-central1-a/instances/my-instance].
NAME        ZONE           MACHINE_TYPE   PREEMPTIBLE  INTERNAL_IP  EXTERNAL_IP     STATUS
my-instance  us-central1-a  e2-medium                   10.128.0.2   34.123.45.67   RUNNING
"""
expected = """
Created [https://compute.googleapis.com/projects/my-project/zones/us-central1-a/instances/my-instance].
NAME        ZONE           MACHINE_TYPE   PREEMPTIBLE  INTERNAL_IP  EXTERNAL_IP     STATUS
my-instance  us-central1-a  e2-medium                   10.128.0.2   34.123.45.67   RUNNING"""

[[tests.gcloud]]
name = "error shown"
input = """
ERROR: (gcloud.compute.instances.create) Could not fetch resource:
 - Quota 'CPUS' exceeded. Limit: 24.0 in region us-central1.
"""
expected = """
ERROR: (gcloud.compute.instances.create) Could not fetch resource:
 - Quota 'CPUS' exceeded. Limit: 24.0 in region us-central1."""