[filters.buck2]
description = "Keep buck2 build result and job summary, drop per-action progress"
match_command = "^buck2\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Action: ",
  "^\\s*Cache ",
  "^Watchman",
  "^Buck UI:",
  "^Network:",
  "^\\s*Downloaded \\d+",
  "^File changed:",
]
max_lines = 60
on_empty = "buck2: build done"

[[tests.buck2]]
name = "result and summary kept"
input = """
Watchman fresh instance
Buck UI: https://app.buck2.re/builds/0000
Action: compile //app:lib
Network: Up: 0B  Down: 1.2MiB
Jobs completed: 120. Time elapsed: 12.3s.
BUILD SUCCEEDED
"""
expected = """Jobs completed: 120. Time elapsed: 12.3s.
BUILD SUCCEEDED"""

[[tests.buck2]]
name = "build failure keeps compiler stderr continuation"
input = """
Action: compile //app:lib
Action failed: root//app:lib (rustc app/lib.rs)
Remote command returned non-zero exit code 1
stderr:
error[E0308]: mismatched types
 --> app/lib.rs:5:5
  |
5 |     "x"
  |     ^^^ expected `i32`, found `&str`
BUILD FAILED
Failed to build 'root//app:lib'
"""
expected = """Action failed: root//app:lib (rustc app/lib.rs)
Remote command returned non-zero exit code 1
stderr:
error[E0308]: mismatched types
 --> app/lib.rs:5:5
  |
5 |     "x"
  |     ^^^ expected `i32`, found `&str`
BUILD FAILED
Failed to build 'root//app:lib'"""
