[filters.gosec]
description = "Compact gosec output"
match_command = "^gosec\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Summary:",
  "^\\s*Gosec ",
  "^\\s*Scanning"
]
keep_lines_matching = [
  "^\\w+\\.go:\\d+:\\d+:",
  "HIGH:",
  "MEDIUM:",
  "LOW:",
  "Error:",
  "WARNING:"
]
max_lines = 50


[[tests.gosec]]
name = "issues shown"
input = """
main.go:10:5: G101: Hardcoded credentials (HIGH)
utils.go:15:1: G104: Errors unhandled (MEDIUM)
"""
expected = """
main.go:10:5: G101: Hardcoded credentials (HIGH)
utils.go:15:1: G104: Errors unhandled (MEDIUM)"""