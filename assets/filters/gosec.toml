[filters.gosec]
description = "Compact gosec output"
match_command = "^gosec\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Summary:",
  "^\\s*Gosec ",
  "^\\s*Scanning"
]
keep_lines_matching = [
  "\\.go:\\d+",
  "^\\[",
  "^\\s*>?\\s*\\d+:\\s",
  "HIGH",
  "MEDIUM",
  "LOW",
  "Error:",
  "WARNING:"
]
max_lines = 50


[[tests.gosec]]
name = "finding keeps location line and source snippet"
input = """
[/work/main.go:10] - G101 (CWE-798): Potential hardcoded credentials (Confidence: LOW, Severity: HIGH)
    9: func main() {
  > 10: 	password := "secret123"
   11: }

Summary:
  Issues: 1
"""
expected = """[/work/main.go:10] - G101 (CWE-798): Potential hardcoded credentials (Confidence: LOW, Severity: HIGH)
    9: func main() {
  > 10: 	password := "secret123"
   11: }"""

[[tests.gosec]]
name = "silent success stays empty"
input = ""
expected = ""
