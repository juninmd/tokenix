[filters.psql]
description = "Compact psql output"
match_command = "^psql\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*psql \\(.*\\)",
  "^\\s*Type \"help\"",
  "^\\s*\\\\",
  "^\\s*You are now connected"
]
keep_lines_matching = [
  "ERROR:",
  "ERROR:",
  "FATAL:",
  "PANIC:",
  "WARNING:",
  "NOTICE:"
]
max_lines = 50


[[tests.psql]]
name = "error shown"
input = """
ERROR:  relation "users" does not exist
LINE 1: SELECT * FROM users;
               ^
"""
expected = "ERROR:  relation \"users\" does not exist"

[[tests.psql]]
name = "silent success stays empty"
input = ""
expected = ""