[filters.flutter-build]
description = "Keep flutter build result artifact and errors, drop Gradle/Xcode progress"
match_command = "^flutter\\s+build\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "Running Gradle task",
  "^\\s*Running ",
  "^\\s*Resolving dependencies",
]
keep_lines_matching = [
  "✓ Built",
  "Built build/",
  "(?i)error",
  "(?i)fail",
  "(?i)exception",
  "^\\* ",
  "^> ",
  "^\\s+at ",
]
max_lines = 60
on_empty = "flutter build: done"

[[tests.flutter-build]]
name = "built artifact kept"
input = """
Running Gradle task 'assembleRelease'...
Resolving dependencies...
✓ Built build/app/outputs/flutter-apk/app-release.apk (12.3MB)
"""
expected = "✓ Built build/app/outputs/flutter-apk/app-release.apk (12.3MB)"

[[tests.flutter-build]]
name = "build failure keeps what-went-wrong section"
input = """
Running Gradle task 'assembleRelease'...
FAILURE: Build failed with an exception.

* What went wrong:
Execution failed for task ':app:compileFlutterBuildRelease'.
> Process 'command flutter' finished with non-zero exit value 1
"""
expected = """FAILURE: Build failed with an exception.
* What went wrong:
Execution failed for task ':app:compileFlutterBuildRelease'.
> Process 'command flutter' finished with non-zero exit value 1"""
