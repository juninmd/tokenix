[filters.scp]
description = "Compact scp output"
match_command = "^scp\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\d+%",
  "^\\s*\\d+\\.\\d+ [KM]B/s",
  "^\\s*\\d{2}:\\d{2}:\\d{2}"
]
keep_lines_matching = [
  "error:",
  "Error:",
  "Permission denied",
  "No such file",
  "Connection refused",
  "lost connection"
]
max_lines = 20


[[tests.scp]]
name = "error shown"
input = """
scp: /remote/path/main.rs: Permission denied
lost connection
"""
expected = """
scp: /remote/path/main.rs: Permission denied
lost connection"""

[[tests.scp]]
name = "silent success stays empty"
input = ""
expected = ""