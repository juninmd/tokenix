[filters.dprint]
description = "Keep dprint unformatted-file list and errors, collapse clean runs"
match_command = "^dprint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
keep_lines_matching = [
  "not formatted",
  "^Error",
  "from ",
  "\\.(ts|js|tsx|jsx|json|md):",
  "(?i)error",
]
max_lines = 80
on_empty = "dprint: all formatted"

[[tests.dprint]]
name = "unformatted files kept"
input = """
src/app.ts
src/utils.ts

Found 2 not formatted files.
"""
expected = """Found 2 not formatted files."""

[[tests.dprint]]
name = "clean run collapses"
input = ""
expected = "dprint: all formatted"
