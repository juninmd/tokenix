[filters.sqlite3]
description = "Compact sqlite3 output"
match_command = "^sqlite3\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*SQLite version",
  "^\\s*Enter \".help\"",
  "^\\s*Connected to"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "near ",
  "syntax error"
]
max_lines = 30


[[tests.sqlite3]]
name = "error shown"
input = """
Error: near "SELCT": syntax error
"""
expected = """
Error: near "SELCT": syntax error"""

[[tests.sqlite3]]
name = "silent success stays empty"
input = ""
expected = ""