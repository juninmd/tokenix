[filters.sqlite3]
description = "Compact sqlite3 output"
match_command = "^sqlite3\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*SQLite version",
  "^\\s*Enter \".help\"",
  "^\\s*Connected to"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "near ",
  "syntax error"
]
max_lines = 30
on_empty = "sqlite3: ok"

[[tests.sqlite3]]
name = "clean connection"
input = """
SQLite version 3.45.0 2024-01-15 10:30:00
Enter ".help" for usage hints.
Connected to a transient in-memory database.
Use ".open FILENAME" to reopen on a persistent database.
sqlite> 
"""
expected = "sqlite3: ok"

[[tests.sqlite3]]
name = "error shown"
input = """
Error: near "SELCT": syntax error
"""
expected = """
Error: near "SELCT": syntax error"""