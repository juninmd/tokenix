[filters.tofu-plan]
description = "Compact OpenTofu plan output"
match_command = "^tofu\\s+plan\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Refreshing OpenTofu state",
  "^\\s*data\\.",
  "^\\s*# ",
  "^\\s*\\+\\/\\-",
  "^\\s*\\-",
  "^Plan:",
  "^\\s*\\d+ to add",
  "^\\s*\\d+ to change",
  "^\\s*\\d+ to destroy"
]
keep_lines_matching = [
  "Error:",
  "Warning:",
  "Error: ",
  "│ Error",
  "│ Warning"
]
max_lines = 60


