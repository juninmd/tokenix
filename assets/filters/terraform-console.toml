[filters.terraform-console]
description = "Compact terraform console output"
match_command = "^terraform\\s+console\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*>"
]
keep_lines_matching = [
  "^\\w+",
  "Error:",
  "Error:"
]
max_lines = 30
on_empty = "terraform console: ready"

[[tests.terraform-console]]
name = "console session"
input = """
> var.instance_type
"t3.micro"
> length(var.subnet_ids)
2
"""
expected = "2"