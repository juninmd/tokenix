[filters.node-e-json]
description = "Compact node -e JSON/SQLite probe output"
match_command = "^node\\s+-e\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
replace_patterns = [
  ["\"summary\":\"[^\"]{120,}\"", "\"summary\":\"<omitted>\""],
  ["\"content\":\"[^\"]{120,}\"", "\"content\":\"<omitted>\""],
  ["\"body\":\"[^\"]{120,}\"", "\"body\":\"<omitted>\""],
  ["\"metrics_json\":\"\\{\\}\"", "\"metrics_json\":{}"]
]
truncate_lines_at = 220
max_lines = 40
on_empty = "node -e: ok"

[[tests.node-e-json]]
name = "sqlite json lines are bounded"
input = """
--- cycle_runs ---
{"id":1,"type":"crawl","status":"running","metrics_json":"{}","error":null,"started_at":"2026-06-16T00:00:00Z"}
{"id":2,"title":"x","summary":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"}
"""
expected = """
--- cycle_runs ---
{"id":1,"type":"crawl","status":"running","metrics_json":{},"error":null,"started_at":"2026-06-16T00:00:00Z"}
{"id":2,"title":"x","summary":"<omitted>"}"""

[[tests.node-e-json]]
name = "node error"
input = """
/app/index.js:12
throw new Error("connection failed");
^
Error: connection failed
    at Object.<anonymous> (/app/index.js:12:7)
"""
expected = """/app/index.js:12
throw new Error("connection failed");
^
Error: connection failed
    at Object.<anonymous> (/app/index.js:12:7)"""

