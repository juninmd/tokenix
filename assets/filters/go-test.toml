[filters.go-test]
description = "Compact go test output"
match_command = "^go\\s+test\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^ok\\s+",
  "^\\s*--- PASS:",
  "^\\s*PASS\\s*$"
]
keep_lines_matching = [
  "FAIL",
  "--- FAIL:",
  "panic:",
  "Error:",
  "error:",
  "FAIL\\s+"
]
max_lines = 60


[[tests.go-test]]
name = "test failure shown"
input = """
--- FAIL: TestAdd (0.00s)
    main_test.go:15: expected 3, got 4
FAIL
FAIL    github.com/user/project  0.234s
"""
expected = """
--- FAIL: TestAdd (0.00s)
FAIL
FAIL    github.com/user/project  0.234s"""

[[tests.go-test]]
name = "silent success stays empty"
input = ""
expected = ""