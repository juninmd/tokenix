[filters.detect-secrets]
description = "Keep detect-secrets findings metadata, never echo the secret"
match_command = "^detect-secrets\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Secret:\\s",
]
keep_lines_matching = [
  "Potential secrets",
  "^Secret Type:",
  "^Location:",
  "(?i)error",
  "Failed to",
]
max_lines = 60
token_budget = 2000

[[tests.detect-secrets]]
name = "finding metadata kept, secret value dropped"
input = """
ERROR: Potential secrets about to be committed to git repo!

Secret Type: AWS Access Key
Location:    config/prod.py:10
Secret:      AKIAIOSFODNN7EXAMPLE
"""
expected = """ERROR: Potential secrets about to be committed to git repo!
Secret Type: AWS Access Key
Location:    config/prod.py:10"""

[[tests.detect-secrets]]
name = "empty scan passes through"
input = ""
expected = ""
