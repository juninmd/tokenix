[filters.python-pytest]
description = "Compact python -m pytest output"
match_command = "^python\\s+-m\\s+pytest\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\.\\.\\.",
  "^\\s*======",
  "^\\s*---",
  "^\\s*passed\\s+in\\s+",
  "^\\s*\\d+ passed",
  "^\\s*\\d+ failed",
  "^\\s*\\d+ skipped",
  "^\\s*\\d+ warnings",
  "^\\s*===.*===",
  "^\\s*PASSED",
  "^\\s*SKIPPED"
]
keep_lines_matching = [
  "FAILED",
  "ERROR",
  "AssertionError",
  "Traceback",
  "File ",
  "assert ",
  "E       "
]
max_lines = 80


[[tests.python-pytest]]
name = "failure shown"
input = """
============================= test session starts =============================
collected 15 items

test_utils.py ......F...

============================= FAILED test_utils.py::test_add =============================
def test_add():
    assert add(1, 2) == 3
E   AssertionError: assert 4 == 3
E    +  where 4 = add(1, 2)

============================= 1 failed, 14 passed in 0.52s =============================
"""
expected = """
    assert add(1, 2) == 3
E   AssertionError: assert 4 == 3"""

[[tests.python-pytest]]
name = "silent success stays empty"
input = ""
expected = ""