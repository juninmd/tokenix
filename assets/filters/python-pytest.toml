[filters.python-pytest]
description = "Compact python -m pytest output"
match_command = "^python\\s+-m\\s+pytest\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\.\\.\\.",
  "^\\s*======",
  "^\\s*---",
  "^\\s*passed\\s+in\\s+",
  "^\\s*\\d+ passed",
  "^\\s*\\d+ failed",
  "^\\s*\\d+ skipped",
  "^\\s*\\d+ warnings",
  "^\\s*===.*===",
  "^\\s*PASSED",
  "^\\s*SKIPPED"
]
keep_lines_matching = [
  "FAILED",
  "ERROR",
  "AssertionError",
  "Traceback",
  "File ",
  "assert ",
  "^E\\s+",
  "^>\\s",
  "\\.py:\\d+",
  "^_+ [^_].* _+$",
]
max_lines = 80


[[tests.python-pytest]]
name = "exception failure keeps header, source, E-line and locations"
input = """
