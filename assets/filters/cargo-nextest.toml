[filters.cargo-nextest]
description = "Compact cargo nextest output"
match_command = "^cargo\\s+nextest\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Starting",
  "^\\s*Compiling",
  "^\\s*Finished",
  "^\\s*Fresh",
  "^\\s*Downloading",
  "^\\s*Downloaded",
  "^\\s*PASS \\[",
  "^\\s*running \\d+ test",
  "^-+$",
]
max_lines = 60

[[tests.cargo-nextest]]
name = "all tests pass"
input = """
    Starting 2 tests across 1 binary
        PASS [   0.010s] my-crate tests::test1
        PASS [   0.012s] my-crate tests::test2
------------
     Summary [   0.025s] 2 tests run: 2 passed, 0 skipped
"""
expected = "     Summary [   0.025s] 2 tests run: 2 passed, 0 skipped"

[[tests.cargo-nextest]]
name = "failure keeps panic payload and left/right values"
input = """
    Starting 2 tests across 1 binary
        PASS [   0.010s] my-crate tests::test1
        FAIL [   0.015s] my-crate tests::test2

--- STDOUT:              my-crate tests::test2 ---

running 1 test
thread 'tests::test2' panicked at src/lib.rs:10:5:
assertion `left == right` failed
  left: 3
 right: 4
test tests::test2 ... FAILED

  Cancelling due to test failure
------------
     Summary [   0.030s] 2 tests run: 1 passed, 1 failed, 0 skipped
"""
expected = """        FAIL [   0.015s] my-crate tests::test2
--- STDOUT:              my-crate tests::test2 ---
thread 'tests::test2' panicked at src/lib.rs:10:5:
assertion `left == right` failed
  left: 3
 right: 4
test tests::test2 ... FAILED
  Cancelling due to test failure
     Summary [   0.030s] 2 tests run: 1 passed, 1 failed, 0 skipped"""
