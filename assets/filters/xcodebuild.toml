[filters.xcodebuild]
description = "Compact xcodebuild output"
match_command = "^xcodebuild\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*=== BUILD TARGET",
  "^\\s*=== BUILD",
  "^\\s*Build succeeded",
  "^\\s*\\*\\*\\* BUILD",
  "^\\s*\\d+\\.\\d+s$"
]
keep_lines_matching = [
  "error:",
  "warning:",
  "FAILED",
  "BUILD FAILED",
  "Build failed"
]
max_lines = 60
on_empty = "xcodebuild: success"

[[tests.xcodebuild]]
name = "clean build"
input = """
=== BUILD TARGET MyApp OF PROJECT MyApp WITH CONFIGURATION Debug ===
Build succeeded.
"""
expected = "xcodebuild: success"

[[tests.xcodebuild]]
name = "failure shown"
input = """
=== BUILD TARGET MyApp OF PROJECT MyApp WITH CONFIGURATION Debug ===
/Users/me/MyApp/ViewController.swift:10:5: error: cannot find 'foo' in scope
    foo()
    ^~~
** BUILD FAILED **
"""
expected = """
/Users/me/MyApp/ViewController.swift:10:5: error: cannot find 'foo' in scope
** BUILD FAILED **"""