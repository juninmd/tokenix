[filters.uv-pip-install]
description = "Compact uv pip install output"
match_command = "^uv\\s+pip\\s+install\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Collecting",
  "^\\s*Downloading",
  "^\\s*Installing collected packages",
  "^\\s*Successfully installed",
  "^\\s*Requirement already satisfied",
  "packages in",
  "found 0 vulnerabilities"
]
max_lines = 30


[[tests.uv-pip-install]]
name = "no solution error preserved"
input = """
  × No solution found when resolving dependencies:
  ╰─▶ Because nonexistent-package-xyz was not found in the package registry and you require nonexistent-package-xyz, we can conclude that your requirements are unsatisfiable.
"""
expected = """
  × No solution found when resolving dependencies:
  ╰─▶ Because nonexistent-package-xyz was not found in the package registry and you require nonexistent-package-xyz, we can conclude that your requirements are unsatisfiable."""

[[tests.uv-pip-install]]
name = "silent success stays empty"
input = ""
expected = ""