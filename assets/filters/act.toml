[filters.act]
description = "Compact act (local GitHub Actions) output: keep failures and job results"
match_command = "^act\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "\\]\\s+🚀\\s+Start ",
  "\\]\\s+⭐\\s+Run ",
  "\\]\\s+☁\\s+",
  "\\]\\s+✅\\s+Success - ",
  "\\]\\s+🐳\\s+docker ",
]
keep_lines_matching = [
  "❌",
  "Failure -",
  "Job failed",
  "Job succeeded",
  "(?i)error",
  "exitcode",
  "(?i)fail",
  "(?i)\\|\\s+.*(expected|received|assert)",
  "\\|\\s+at ",
  "[✕✖✗●]",
]
max_lines = 60
on_empty = "act: ok"
token_budget = 2000

[[tests.act]]
name = "failing step payload surfaced"
input = """
[CI/build] 🚀  Start image=node:20
[CI/build] ⭐ Run Set up job
[CI/build]   ✅  Success - Set up job
[CI/build] ⭐ Run tests
[CI/build]   | > app@1.0.0 test
[CI/build]   | FAIL src/app.test.js
[CI/build]   | ● adds numbers
[CI/build]   |   Expected: 4
[CI/build]   |   Received: 3
[CI/build]   |       at Object.<anonymous> (src/app.test.js:5:19)
[CI/build]   | Tests: 1 failed, 1 total
[CI/build]   ❌  Failure - Run tests
[CI/build] exitcode '1': failure
"""
expected = """[CI/build]   | FAIL src/app.test.js
[CI/build]   | ● adds numbers
[CI/build]   |   Expected: 4
[CI/build]   |   Received: 3
[CI/build]   |       at Object.<anonymous> (src/app.test.js:5:19)
[CI/build]   | Tests: 1 failed, 1 total
[CI/build]   ❌  Failure - Run tests
[CI/build] exitcode '1': failure"""

[[tests.act]]
name = "all success collapses"
input = """
[CI/build] 🚀  Start image=node:20
[CI/build] ⭐ Run Set up job
[CI/build]   ✅  Success - Set up job
[CI/build]   ✅  Success - Run tests
"""
expected = "act: ok"
