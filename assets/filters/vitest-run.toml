[filters.vitest-run]
description = "Compact vitest run output"
match_command = "^(npx\\s+)?vitest\\s+run\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*PASS\\s+",
  "^\\s*Test Files\\s+",
  "^\\s*Tests\\s+",
  "^\\s*Time\\s+"
]
keep_lines_matching = [
  "FAIL",
  "× ",
  "AssertionError",
  "Error:",
  "TypeError:",
  "ReferenceError:",
  "SyntaxError:"
]
max_lines = 80
on_empty = "vitest run: all tests passed"

[[tests.vitest-run]]
name = "all pass"
input = """
 PASS  src/utils.test.ts (2 tests)
 PASS  src/components.test.tsx (3 tests)

 Test Files  2 passed (2)
 Tests  5 passed (5)
 Time  1.23s
"""
expected = "vitest run: all tests passed"

[[tests.vitest-run]]
name = "failure shown"
input = """
 FAIL  src/utils.test.ts [ src/utils.test.ts ]
 × add › should add two numbers
   AssertionError: expected 4 toBe 3
   => 12 |   expect(add(1, 2)).toBe(3);
        |             ^

 Test Files  1 failed (2)
 Tests  1 failed (5)
"""
expected = """
 FAIL  src/utils.test.ts [ src/utils.test.ts ]
 × add › should add two numbers
   AssertionError: expected 4 toBe 3"""