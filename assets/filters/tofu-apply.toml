[filters.tofu-apply]
description = "Compact OpenTofu apply output"
match_command = "^tofu\\s+apply\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\w+\\.\\w+:\\s+Creating",
  "^\\s*\\w+\\.\\w+:\\s+Creation complete",
  "^\\s*\\w+\\.\\w+:\\s+Modification complete",
  "^\\s*\\w+\\.\\w+:\\s+Destruction complete",
  "^Apply complete"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "│ Error",
  "│ Warning",
  "still creating",
  "still modifying",
  "still destroying"
]
max_lines = 60


[[tests.tofu-apply]]
name = "error shown"
input = """
aws_instance.web: Creating...
aws_instance.web: Still creating... [10s elapsed]
Error: Error launching instance: InvalidParameterValue
"""
expected = "Error: Error launching instance: InvalidParameterValue"

[[tests.tofu-apply]]
name = "silent success stays empty"
input = ""
expected = ""