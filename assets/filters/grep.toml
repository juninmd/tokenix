[filters.grep]
description = "Compact grep output"
match_command = "^grep\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
# grep output *is* the requested signal — every matched line matters. An earlier
# `keep_lines_matching = [":"]` masked real matches from single-file greps
# (`grep pat file` emits bare lines with no `file:line:` prefix) as "no matches".
replace_patterns = [
  ["^([^:\\n]+):(\\d+):(\\s*)", "$1:$2:"]
]
truncate_lines_at = 180
max_lines = 50

[[tests.grep]]
name = "source matches are compacted"
input = """
src/agent/editorial.ts:65:  if (draft.title.trim().length > 100) errors.push("title is too long");
src/agent/writer.ts:123:        const attempt = await retryDraft();
"""
expected = """
src/agent/editorial.ts:65:if (draft.title.trim().length > 100) errors.push("title is too long");
src/agent/writer.ts:123:const attempt = await retryDraft();"""

[[tests.grep]]
name = "single-file matches without colon prefix are preserved"
input = """
    let total = compute(a, b);
    return total + 1;
"""
expected = """
    let total = compute(a, b);
    return total + 1;"""

