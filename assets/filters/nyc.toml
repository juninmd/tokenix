File      | % Stmts | % Branch | % Funcs | % Lines |
All files |   85.5  |    70    |   90    |  85.5   |"""

[[tests.nyc]]
name = "per-file table kept"
input = """
----------|---------|----------|---------|---------|
File      | % Stmts | % Branch | % Funcs | % Lines |
----------|---------|----------|---------|---------|
All files |   85.5  |    70    |   90    |  85.5   |
