[filters.curl]
description = "Compact curl output"
match_command = "^curl\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^  % Total",
  "^  % \\d+",
  "^  \\d+  ",
  "^\\s*\\{",
  "^\\s*}"
]
keep_lines_matching = [
  "HTTP/",
  "curl:",
  "Failed",
  "Connection",
  "refused",
  "timeout",
  "SSL",
  "certificate"
]
max_lines = 30
on_empty = "curl: ok"

[[tests.curl]]
name = "success response"
input = """
  % Total    % Received % Xferd  Average Speed   Time    Time     Time  Current
                                 Dload  Upload   Total   Spent    Left  Speed
100   234  100   234    0     0    234      0  0:00:01  0:00:01 --:--:--   234
{"status": "ok", "data": {"id": 1}}
"""
expected = """
{"status": "ok", "data": {"id": 1}}"""

[[tests.curl]]
name = "connection error shown"
input = """
curl: (7) Failed to connect to api.example.com port 443: Connection refused
"""
expected = """
curl: (7) Failed to connect to api.example.com port 443: Connection refused"""