[filters.curl]
description = "Compact curl output"
match_command = "^curl\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^  % Total",
  "^  % \\d+",
  "^  \\d+  ",
  "^\\s*\\{",
  "^\\s*}"
]
keep_lines_matching = [
  "HTTP/",
  "curl:",
  "Failed",
  "Connection",
  "refused",
  "timeout",
  "SSL",
  "certificate"
]
max_lines = 30


[[tests.curl]]
name = "connection error shown"
input = """
curl: (7) Failed to connect to api.example.com port 443: Connection refused
"""
expected = """
curl: (7) Failed to connect to api.example.com port 443: Connection refused"""

[[tests.curl]]
name = "silent success stays empty"
input = ""
expected = ""