[filters.yamllint]
description = "Compact yamllint output"
match_command = "^yamllint\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+:\\d+:\\d+:",
  "error:",
  "warning:"
]
max_lines = 50
on_empty = "yamllint: no issues"

[[tests.yamllint]]
name = "clean"
input = """
"""
expected = "yamllint: no issues"

[[tests.yamllint]]
name = "issues shown"
input = """
.github/workflows/ci.yml:10:15: error: mapping values are not allowed in this context
.github/workflows/ci.yml:20:1: warning: trailing spaces
"""
expected = """
.github/workflows/ci.yml:10:15: error: mapping values are not allowed in this context
.github/workflows/ci.yml:20:1: warning: trailing spaces"""