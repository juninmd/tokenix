[filters.tofu-graph]
description = "Compact OpenTofu graph output"
match_command = "^tofu\\s+graph\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "digraph",
  "->",
  "label",
  "shape"
]
max_lines = 50
on_empty = "tofu graph: empty"

[[tests.tofu-graph]]
name = "graph output"
input = """
digraph {
  compound = true
  newrank = true
  "aws_instance.web" -> "provider.aws"
  "aws_s3_bucket.data" -> "provider.aws"
}
"""
expected = "digraph {\n  \"aws_instance.web\" -> \"provider.aws\"\n  \"aws_s3_bucket.data\" -> \"provider.aws\""