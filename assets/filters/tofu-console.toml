[filters.tofu-console]
description = "Compact OpenTofu console output — drop echoed prompts, keep evaluated values"
match_command = "^tofu\\s+console\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*>"
]
max_lines = 30
on_empty = "tofu console: ready"

[[tests.tofu-console]]
name = "evaluated values preserved (including quoted strings)"
input = """
> var.instance_type
"t3.micro"
> length(var.subnet_ids)
2
"""
expected = """
"t3.micro"
2"""

[[tests.tofu-console]]
name = "undeclared variable error preserved"
input = """
╷
│ Error: Reference to undeclared input variable
│
│   on <console-input> line 1:
│    1: var.missing
╵
"""
expected = """
╷
│ Error: Reference to undeclared input variable
│
│   on <console-input> line 1:
│    1: var.missing
╵"""