[filters.ansible-playbook]
description = "Compact ansible-playbook output"
match_command = "^ansible-playbook\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^PLAY \\[",
  "^TASK \\[",
  "^\\s*ok: ",
  "^\\s*changed: ",
  "^\\s*skipping: ",
  "^\\s*\\d+ hosts",
  "^\\s*PLAY RECAP"
]
keep_lines_matching = [
  "FAILED",
  "fatal:",
  "ERROR",
  "unreachable",
  "failed=",
  "MSG:",
  "\"msg\"\\s*:|^\\s*msg:",
  "\"stderr(_lines)?\"\\s*:|^\\s*stderr(_lines)?:",
  "\"stdout(_lines)?\"\\s*:|^\\s*stdout(_lines)?:",
  "\"reason\"\\s*:|^\\s*reason:",
  "\"rc\"\\s*:|^\\s*rc:"
]
max_lines = 50


[[tests.ansible-playbook]]
name = "failure shown"
input = """
PLAY [webservers] ************************************************************

TASK [Install nginx] *********************************************************
fatal: [web1]: FAILED! => {"msg": "Failed to install nginx: apt update failed"}

PLAY RECAP *******************************************************************
web1                   : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0
"""
expected = '''
fatal: [web1]: FAILED! => {"msg": "Failed to install nginx: apt update failed"}
web1                   : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0'''

[[tests.ansible-playbook]]
name = "pretty-printed failure payload survives"
input = """
PLAY [webservers] ************************************************************

TASK [Install nginx] *********************************************************
fatal: [web1]: FAILED! => {
    "changed": false,
    "msg": "No package matching 'nginxx' is available",
    "rc": 100,
    "stderr": "E: Unable to locate package nginxx"
}

PLAY RECAP *******************************************************************
web1                   : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0
"""
expected = '''fatal: [web1]: FAILED! => {
    "msg": "No package matching 'nginxx' is available",
    "rc": 100,
    "stderr": "E: Unable to locate package nginxx"
web1                   : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0'''

[[tests.ansible-playbook]]
name = "clean run keeps recap"
input = """
PLAY [webservers] ************************************************************

TASK [ping] *****************************************************************
ok: [web1]

PLAY RECAP *****************************************************************
web1                   : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0
"""
expected = "web1                   : ok=2    changed=0    unreachable=0    failed=0    skipped=0    rescued=0    ignored=0"