[filters.ansible-playbook]
description = "Compact ansible-playbook output"
match_command = "^ansible-playbook\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^PLAY \\[",
  "^TASK \\[",
  "^\\s*ok: ",
  "^\\s*changed: ",
  "^\\s*skipping: ",
  "^\\s*\\d+ hosts",
  "^\\s*PLAY RECAP",
  "^\\s*\\w+\\s+:\\s+ok="
]
keep_lines_matching = [
  "FAILED",
  "fatal:",
  "ERROR",
  "unreachable",
  "failed=",
  "MSG:"
]
max_lines = 50


[[tests.ansible-playbook]]
name = "failure shown"
input = """
PLAY [webservers] ************************************************************

TASK [Install nginx] *********************************************************
fatal: [web1]: FAILED! => {"msg": "Failed to install nginx: apt update failed"}

PLAY RECAP *******************************************************************
web1                   : ok=1    changed=0    unreachable=0    failed=1    skipped=0    rescued=0    ignored=0
"""
expected = "fatal: [web1]: FAILED! => {\"msg\": \"Failed to install nginx: apt update failed\"}"