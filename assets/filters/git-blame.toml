[filters.git-blame]
description = "Compact git blame output"
match_command = "^git\\s+blame\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+",
  "\\(.*\\)",
  "\\d+)",
  ")"
]
max_lines = 50
on_empty = "git blame: empty file"

[[tests.git-blame]]
name = "blame output"
input = """
abc1234 (John Doe  2024-01-15 10:30:00 +0000  1) fn main() {
def5678 (Jane Smith 2024-01-10 15:45:00 +0000  2)     println!("Hello");
abc1234 (John Doe  2024-01-15 10:30:00 +0000  3) }
"""
expected = """
abc1234 (John Doe  2024-01-15 10:30:00 +0000  1) fn main() {
def5678 (Jane Smith 2024-01-10 15:45:00 +0000  2)     println!("Hello");
abc1234 (John Doe  2024-01-15 10:30:00 +0000  3) }"""