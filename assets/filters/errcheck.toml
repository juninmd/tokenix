[filters.errcheck]
description = "Compact errcheck output"
match_command = "^errcheck\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+\\.go:\\d+:\\d+:",
  "error:",
  "warning:"
]
max_lines = 50


[[tests.errcheck]]
name = "issues shown"
input = """
main.go:10:5: ignored error
utils.go:15:1: unchecked error return
"""
expected = """
main.go:10:5: ignored error
utils.go:15:1: unchecked error return"""

[[tests.errcheck]]
name = "silent success stays empty"
input = ""
expected = ""