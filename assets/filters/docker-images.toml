[filters.docker-images]
description = "Compact docker images output"
match_command = "^docker\\s+images\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^REPOSITORY\\s+TAG"
]
keep_lines_matching = [
  "^\\w+",
  "<none>"
]
max_lines = 30

[[tests.docker-images]]
name = "list images"
input = """
REPOSITORY    TAG       IMAGE ID       CREATED        SIZE
nginx         latest    abc123def456   2 days ago     188MB
postgres      15        def456abc123   3 days ago     372MB
myapp         latest    ghi789jkl012   1 hour ago     256MB
"""
expected = """
nginx         latest    abc123def456   2 days ago     188MB
postgres      15        def456abc123   3 days ago     372MB
myapp         latest    ghi789jkl012   1 hour ago     256MB"""

[[tests.docker-images]]
name = "dangling images kept"
input = """
REPOSITORY    TAG       IMAGE ID       CREATED        SIZE
<none>        <none>    abc123def456   2 days ago     188MB
"""
expected = "<none>        <none>    abc123def456   2 days ago     188MB"
