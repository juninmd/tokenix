[filters.terraform-apply]
description = "Compact terraform apply output"
match_command = "^terraform\\s+apply\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*data\\.",
  "^\\s*# ",
  "^\\s*Creation complete",
  "^\\s*Modification complete",
  "^\\s*Destruction complete",
  "^Apply complete"
]
keep_lines_matching = [
  "Error:",
  "Warning:",
  "Error: ",
  "│ Error",
  "│ Warning",
  "still creating",
  "still modifying",
  "still destroying"
]
max_lines = 60


[[tests.terraform-apply]]
name = "error shown"
input = """
aws_instance.web: Creating...
aws_instance.web: Still creating... [10s elapsed]
aws_instance.web: Still creating... [20s elapsed]
Error: Error launching instance: InvalidParameterValue
"""
expected = "Error: Error launching instance: InvalidParameterValue"