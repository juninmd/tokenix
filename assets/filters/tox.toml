[filters.tox]
description = "Compact tox multi-env output: keep per-env result summary"
match_command = "^tox\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\.pkg:",
  "^\\s*install_deps>",
  "^\\s*commands\\[\\d+\\]>",
  "^\\s*[a-z0-9_.-]+: (?:install|freeze|create|recreate)",
  "^ROOT:",
]
keep_lines_matching = [
  ": OK ",
  ": FAIL ",
  "evaluation failed",
  "congratulations",
  "^\\s*[a-z0-9_.-]+: (?:OK|FAIL)",
  "error:",
  "^ERROR:",
  "summary",
  "FAILED",
  "^E\\s+",
  "^>\\s",
  "Traceback",
  "^\\s+File \"",
  "assert",
  "\\.py:\\d+",
  "\\d+ (?:failed|errors?)",
]
max_lines = 40
replace_patterns = [
  ["\\(\\d+\\.\\d+ seconds\\)", "(<duration>)"],
]
token_budget = 1500

[[tests.tox]]
name = "env summary kept"
input = """
py311: install_deps> pip install -r requirements.txt
py311: commands[0]> pytest
.pkg: _optional_hooks> python /usr/lib/build
py311: OK (12.34 seconds)
py312: commands[0]> pytest
py312: FAIL code 1 (10.01 seconds)
  evaluation failed :( (22.50 seconds)
"""
expected = """py311: OK (<duration>)
py312: FAIL code 1 (<duration>)
  evaluation failed :( (<duration>)"""

[[tests.tox]]
name = "wrapped pytest failure detail survives"
input = """
py312: install_deps> pip install -r requirements.txt
py312: commands[0]> pytest
============================= test session starts ==============================
collected 3 items
test_utils.py ..F                                                        [100%]
=================================== FAILURES ===================================
__________________________________ test_add ___________________________________
    def test_add():
>       assert add(1, 2) == 3
E       assert 4 == 3
test_utils.py:5: AssertionError
FAILED test_utils.py::test_add - assert 4 == 3
========================= 1 failed, 2 passed in 0.05s ==========================
py312: FAIL code 1 (10.01 seconds)
  evaluation failed :( (22.50 seconds)
"""
expected = """>       assert add(1, 2) == 3
E       assert 4 == 3
test_utils.py:5: AssertionError
FAILED test_utils.py::test_add - assert 4 == 3
========================= 1 failed, 2 passed in 0.05s ==========================
py312: FAIL code 1 (<duration>)
  evaluation failed :( (<duration>)"""

[[tests.tox]]
name = "all green collapses"
input = """
py311: install_deps> pip install -e .
py311: commands[0]> pytest
py311: OK (8.20 seconds)
  congratulations :) (9.00 seconds)
"""
expected = """py311: OK (<duration>)
  congratulations :) (<duration>)"""
