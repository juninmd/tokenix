[filters.pnpm-list]
description = "Compact pnpm list output"
match_command = "^pnpm\\s+(list|ls|ll|la)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\w+@",
  "^\\s*dependencies:",
  "^\\s*devDependencies:",
  "^\\s*optionalDependencies:",
  "^\\s*peerDependencies:",
  "^\\s*\\w+:\\s*\\w+@",
]
keep_lines_matching = [
  "^\\s*\\w+@",
  "not installed",
  "missing",
  "extraneous",
  "UNMET",
]
max_lines = 50


[[tests.pnpm-list]]
name = "unmet dependency"
input = """
my-project@1.0.0 /home/user/my-project
├── typescript@5.2.2
UNMET PEER DEPENDENCY @babel/core@^7.0.0
"""
expected = "UNMET PEER DEPENDENCY @babel/core@^7.0.0"