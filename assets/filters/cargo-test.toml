[filters.cargo-test]
description = "Compact cargo test output aggressively"
match_command = "^cargo\\s+test\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Compiling",
  "^\\s*Running unittests",
  "^\\s*Running tests/",
  "^\\s*Doc-tests",
  "^\\s*Finished",
  "^\\s*running \\d+ test",
]
keep_lines_matching = [
  "test result:",
  "FAILED",
  "PASSED",
  "error\\[",
  "warning:",
  "thread.*panicked",
  "panicked at",
  "assert",
  "diff",
  "left / right",
]
max_lines = 60
replace_patterns = [
  ["target/debug/deps/[a-z0-9_-]+-[a-f0-9]+", "target/debug/deps/<test_binary>"],
  ["\\d+\\.\\d+s", "<duration>"],
  ["thread '([^']+)' panicked at", "panic in $1"],
]
extract_sections = [
  { start_pattern = "---- .+ stdout ----", end_pattern = "^\\s*$", include_markers = true, max_matches = 5 },
  { start_pattern = "failures:", end_pattern = "^\\s*$", include_markers = true, max_matches = 1 },
]
deduplicate_blocks = { min_block_lines = 2, similarity = 0.7 }
token_budget = 3000


[[tests.cargo-test]]
name = "test failure shown"
input = """
   Compiling my-crate v0.1.0
    Finished test [unoptimized + debuginfo] target(s) in 2.3s
     Running unittests src/lib.rs (target/debug/deps/my_crate-abc123)

running 5 tests
test test_add ... ok
test test_fail ... FAILED

failures:
    test_fail

test result: FAILED. 4 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out
"""
expected = """
test test_fail ... FAILED
test result: FAILED. 4 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out"""

[[tests.cargo-test]]
name = "silent success stays empty"
input = ""
expected = ""