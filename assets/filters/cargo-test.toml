[filters.cargo-test]
description = "Compact cargo test output aggressively"
match_command = "^cargo\\s+test\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Compiling",
  "^\\s*Downloading",
  "^\\s*Downloaded",
  "^\\s*Running unittests",
  "^\\s*Running tests/",
  "^\\s*Doc-tests",
  "^\\s*Finished",
  "^\\s*running \\d+ test",
  "^test .+ \\.\\.\\. ok$",
]
max_lines = 60
replace_patterns = [
  ["target/debug/deps/[a-z0-9_-]+-[a-f0-9]+", "target/debug/deps/<test_binary>"],
  ["\\d+\\.\\d+s", "<duration>"],
  ["thread '([^']+)' panicked at", "panic in $1"],
]
deduplicate_blocks = { min_block_lines = 2, similarity = 0.7 }
token_budget = 3000


[[tests.cargo-test]]
name = "panic payload with left/right values survives"
input = """
   Compiling my-crate v0.1.0
    Finished test [unoptimized + debuginfo] target(s) in 2.3s
     Running unittests src/lib.rs (target/debug/deps/my_crate-abc123)

running 5 tests
test test_add ... ok
test test_fail ... FAILED

failures:

---- test_fail stdout ----
thread 'test_fail' panicked at src/lib.rs:10:5:
assertion `left == right` failed
  left: 3
 right: 4
note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace

failures:
    test_fail

test result: FAILED. 4 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out
"""
expected = """test test_fail ... FAILED
failures:
---- test_fail stdout ----
panic in test_fail src/lib.rs:10:5:
assertion `left == right` failed
  left: 3
 right: 4
note: run with `RUST_BACKTRACE=1` environment variable to display a backtrace
failures:
    test_fail
test result: FAILED. 4 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out"""

[[tests.cargo-test]]
name = "all green keeps only the result line"
