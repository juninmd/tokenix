[filters.cargo-test]
description = "Compact cargo test output"
match_command = "^cargo\\s+test\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Compiling",
  "^\\s*Running unittests",
  "^\\s*Running tests/",
  "^\\s*test result: ok\\.",
  "^\\s*Doc-tests"
]
keep_lines_matching = [
  "test result:",
  "FAILED",
  "PASSED",
  "error\\[",
  "warning:",
  "thread.*panicked"
]
max_lines = 80
on_empty = "cargo test: all tests passed"

[[tests.cargo-test]]
name = "all tests pass"
input = """
   Compiling my-crate v0.1.0
    Finished test [unoptimized + debuginfo] target(s) in 2.3s
     Running unittests src/lib.rs (target/debug/deps/my_crate-abc123)

running 5 tests
test test_add ... ok
test test_sub ... ok
test test_mul ... ok
test test_div ... ok
test test_mod ... ok

test result: ok. 5 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out
"""
expected = "cargo test: all tests passed"

[[tests.cargo-test]]
name = "test failure shown"
input = """
   Compiling my-crate v0.1.0
    Finished test [unoptimized + debuginfo] target(s) in 2.3s
     Running unittests src/lib.rs (target/debug/deps/my_crate-abc123)

running 5 tests
test test_add ... ok
test test_fail ... FAILED

failures:
    test_fail

test result: FAILED. 4 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out
"""
expected = """
test test_fail ... FAILED
test result: FAILED. 4 passed; 1 failed; 0 ignored; 0 measured; 0 filtered out"""