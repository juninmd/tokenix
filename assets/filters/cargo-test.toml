test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in 0.01s
"""
expected = """test result: ok. 2 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out; finished in <duration>"""

