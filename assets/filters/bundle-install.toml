[filters.bundle-install]
description = "Compact bundle install output"
match_command = "^bundle\\s+install\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Fetching ",
  "^\\s*Installing ",
  "^\\s*Using ",
  "^\\s*Bundle complete",
  "^\\s*\\d+ gem",
  "^\\s*\\d+ dependency"
]
keep_lines_matching = [
  "Error:",
  "error:",
  "Failed",
  "Could not find",
  "Bundler::GemNotFound"
]
max_lines = 40


[[tests.bundle-install]]
name = "missing gem error preserved"
input = """
Fetching gem metadata from https://rubygems.org/..........
Resolving dependencies...
Could not find gem 'rails (= 9.9.9)' in rubygems repository https://rubygems.org/ or installed locally.

The source contains the following gems matching 'rails':
  * rails-7.1.3
"""
expected = "Could not find gem 'rails (= 9.9.9)' in rubygems repository https://rubygems.org/ or installed locally."

[[tests.bundle-install]]
name = "silent success stays empty"
input = ""
expected = ""