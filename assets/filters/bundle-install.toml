[filters.bundle-install]
description = "Compact bundle install output"
match_command = "^bundle\\s+install\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Fetching ",
  "^\\s*Installing ",
  "^\\s*Using ",
  "^\\s*Bundle complete",
  "^\\s*\\d+ gem",
  "^\\s*\\d+ dependency"
]
keep_lines_matching = [
  "Error:",
  "error:",
  "Failed",
  "Could not find",
  "Bundler::GemNotFound"
]
max_lines = 40
on_empty = "bundle install: ok"

[[tests.bundle-install]]
name = "clean install"
input = """
Fetching gem metadata from https://rubygems.org/..........
Fetching gem metadata from https://rubygems.org/.
Resolving dependencies...
Using rake 13.0.6
Using concurrent-ruby 1.1.10
Using minitest 5.16.3
Bundle complete! 15 Gemfile dependencies, 45 gems now installed.
Use `bundle info [gemname]` to see where a bundled gem is installed.
"""
expected = "bundle install: ok"