[filters.sqlfluff]
description = "Compact sqlfluff output"
match_command = "^sqlfluff\\s+(lint|fix|parse)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*All files passed",
  "^\\s*\\d+ file\\(s\\) passed"
]
keep_lines_matching = [
  "^\\w+:\\d+:\\d+:",
  "L:",
  "P:",
  "Error:",
  "Warning:"
]
max_lines = 50


