[filters.cargo-fix]
description = "Keep cargo fix applied-fix lines and warnings, drop compile noise"
match_command = "^cargo\\s+fix\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Checking ",
  "^\\s*Compiling ",
  "^\\s*Finished ",
  "^\\s*Downloading ",
  "^\\s*Downloaded ",
]
max_lines = 60
on_empty = "cargo fix: no changes"

[[tests.cargo-fix]]
name = "applied fixes kept"
input = """
    Checking app v0.1.0
       Fixed src/main.rs (2 fixes)
    Finished dev profile in 1.2s
"""
expected = "       Fixed src/main.rs (2 fixes)"

[[tests.cargo-fix]]
name = "unfixable diagnostic block survives"
input = """
    Checking app v0.1.0
warning: failed to automatically apply fixes suggested by rustc
error[E0308]: mismatched types
 --> src/main.rs:3:13
  |
3 |     let x: i32 = "hello";
  |            ---   ^^^^^^^ expected `i32`, found `&str`
error: could not compile `app` (bin "app") due to 1 previous error
"""
expected = """warning: failed to automatically apply fixes suggested by rustc
error[E0308]: mismatched types
 --> src/main.rs:3:13
  |
3 |     let x: i32 = "hello";
  |            ---   ^^^^^^^ expected `i32`, found `&str`
error: could not compile `app` (bin "app") due to 1 previous error"""

[[tests.cargo-fix]]
name = "nothing to fix collapses"
input = """
    Checking app v0.1.0
    Finished dev profile in 1.2s
"""
expected = "cargo fix: no changes"
