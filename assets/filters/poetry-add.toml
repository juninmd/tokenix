[filters.poetry-add]
description = "Compact poetry add output"
match_command = "^poetry\\s+add\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Using version",
  "^\\s*Resolving dependencies",
  "^\\s*Package operations:",
  "^\\s*• Installing",
  "^\\s*• Updating",
  "^\\s*Generating lock file",
  "^\\s*Lock file up to date"
]
keep_lines_matching = [
  "Error:",
  "error:",
  "Failed",
  "Could not find",
  "SolverProblemError",
  "version solving failed"
]
max_lines = 40


[[tests.poetry-add]]
name = "version solving failure preserved"
input = """
Using version ^99.0 for requests

Resolving dependencies... (0.5s)

Because my-project depends on requests (^99.0) which doesn't match any versions, version solving failed.
"""
expected = "Because my-project depends on requests (^99.0) which doesn't match any versions, version solving failed."

[[tests.poetry-add]]
name = "silent success stays empty"
input = ""
expected = ""