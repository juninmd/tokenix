[filters.composer-install]
description = "Compact composer install output"
match_command = "^composer\\s+install\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Loading composer repositories",
  "^\\s*Installing dependencies",
  "^\\s*Package operations:",
  "^\\s*\\s*- Installing",
  "^\\s*Generating",
  "^\\s*\\d+ packages installed",
  "^\\s*\\d+ packages updated"
]
keep_lines_matching = [
  "Error:",
  "error:",
  "Failed",
  "Could not find",
  "Installation failed",
  "could not be resolved",
  "^\\s*Problem \\d",
  "^\\s*- "
]
max_lines = 40
on_empty = "composer install: ok"

[[tests.composer-install]]
name = "clean install"
input = """
Loading composer repositories with package information
Installing dependencies (including require-dev) from lock file
Package operations: 12 installs, 0 updates, 0 removals
  - Installing symfony/polyfill-ctype (v1.28.0): Extracting archive
  - Installing symfony/console (v6.4.0): Extracting archive
Generating autoload files
12 packages installed in 2.3s
"""
expected = "composer install: ok"

[[tests.composer-install]]
name = "dependency resolution failure preserved"
input = """
Loading composer repositories with package information
Installing dependencies (including require-dev) from lock file
Your requirements could not be resolved to an installable set of packages.

  Problem 1
    - Root composer.json requires php >=8.3 but your php version (8.1.27) does not satisfy that requirement.

Installation failed, reverting ./composer.json and ./composer.lock to their original content.
"""
expected = """
Your requirements could not be resolved to an installable set of packages.
  Problem 1
    - Root composer.json requires php >=8.3 but your php version (8.1.27) does not satisfy that requirement.
Installation failed, reverting ./composer.json and ./composer.lock to their original content."""