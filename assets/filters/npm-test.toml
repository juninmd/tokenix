[filters.npm-test]
description = "Compact npm test output"
match_command = "^npm\\s+test\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^> ",
  "^\\s*npm notice",
  "^\\s*npm WARN"
]
keep_lines_matching = [
  "FAIL",
  "PASS",
  "Test Suites:",
  "Tests:",
  "Error:",
  "TypeError:",
  "AssertionError",
  "●",
  "Expected",
  "Received",
  "expect\\(",
  "not ok",
  "^\\s+at ",
  "^\\s*[-+] ",
  "^\\s*>?\\s*\\d+ \\|",
  "^\\s*\\|"
]
max_lines = 60

[[tests.npm-test]]
name = "tests pass"
input = """
> my-project@1.0.0 test
> jest

 PASS  src/utils.test.ts
 PASS  src/components.test.tsx
Test Suites: 2 passed, 2 total
Tests:       15 passed, 15 total
"""
expected = """
 PASS  src/utils.test.ts
 PASS  src/components.test.tsx
Test Suites: 2 passed, 2 total
Tests:       15 passed, 15 total"""

[[tests.npm-test]]
name = "test failure keeps matcher, diff, code frame and stack"
input = """
> my-project@1.0.0 test
> jest

 FAIL  src/utils.test.ts
  ● add › should add two numbers

    expect(received).toBe(expected)

    Expected: 3
    Received: 4

      11 |   const sum = add(1, 2);
    > 12 |   expect(sum).toBe(3);
         |               ^
      13 | });

      at Object.<anonymous> (src/utils.test.ts:12:15)

Test Suites: 1 failed, 1 total
Tests:       1 failed, 14 passed, 15 total
"""
expected = """
 FAIL  src/utils.test.ts
  ● add › should add two numbers
    expect(received).toBe(expected)
    Expected: 3
    Received: 4
      11 |   const sum = add(1, 2);
    > 12 |   expect(sum).toBe(3);
         |               ^
      13 | });
      at Object.<anonymous> (src/utils.test.ts:12:15)
Test Suites: 1 failed, 1 total
Tests:       1 failed, 14 passed, 15 total"""