[filters.npm-test]
description = "Compact npm test output"
match_command = "^npm\\s+test\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^> ",
  "^\\s*npm notice",
  "^\\s*npm WARN"
]
keep_lines_matching = [
  "FAIL",
  "PASS",
  "Test Suites:",
  "Tests:",
  "Error:",
  "TypeError:",
  "AssertionError"
]
max_lines = 60
on_empty = "npm test: passed"

[[tests.npm-test]]
name = "tests pass"
input = """
> my-project@1.0.0 test
> jest

 PASS  src/utils.test.ts
 PASS  src/components.test.tsx
Test Suites: 2 passed, 2 total
Tests:       15 passed, 15 total
"""
expected = """
 PASS  src/utils.test.ts
 PASS  src/components.test.tsx
Test Suites: 2 passed, 2 total
Tests:       15 passed, 15 total"""

[[tests.npm-test]]
name = "test failure shown"
input = """
> my-project@1.0.0 test
> jest

 FAIL  src/utils.test.ts
  ● add › should add two numbers

    expect(received).toBe(expected)

    Expected: 3
    Received: 4
"""
expected = " FAIL  src/utils.test.ts"