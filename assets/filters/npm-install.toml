[filters.npm-install]
description = "Compact npm/pnpm/yarn install outputs"
match_command = "^(npm|pnpm|yarn|ni)\\s+(install|add|i|in|inst|insta|instal)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]",
  "Progress:",
  "│",
  "Fetched",
  "Resolving",
  "Extracting",
  "Checking",
  "up to date",
  "packages in",
  "found 0 vulnerabilities",
  "audited \\d+ packages",
  "npm WARN deprecated"
]
max_lines = 40
on_empty = "npm install: ok"

[[tests.npm-install]]
name = "clean install collapses to ok"
input = """
added 120 packages in 3s

up to date

found 0 vulnerabilities
"""
expected = "npm install: ok"

[[tests.npm-install]]
name = "vulnerabilities survive"
input = """
added 120 packages in 3s

found 7 vulnerabilities (2 moderate, 5 high)
  run `npm audit fix` to address them
"""
expected = """
found 7 vulnerabilities (2 moderate, 5 high)
  run `npm audit fix` to address them"""
