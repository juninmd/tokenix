[filters.npm-install]
description = "Compact npm/pnpm/yarn install outputs"
match_command = "^(npm|pnpm|yarn|ni)\\s+(install|add|i|in|inst|insta|instal)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏]",
  "Progress:",
  "│",
  "Fetched",
  "Resolving",
  "Extracting",
  "Checking",
  "up to date",
  "packages in",
  "found \\d+ vulnerabilities",
  "audited \\d+ packages",
  "npm WARN deprecated"
]
max_lines = 40
on_empty = "npm install: ok"
