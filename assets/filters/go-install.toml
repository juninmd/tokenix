[filters.go-install]
description = "Surface go install errors verbatim, collapse download noise and silent success"
match_command = "^go\\s+install\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^go: downloading ",
  "^go: extracting ",
  "^go: found ",
]
max_lines = 60
on_empty = "go install: ok"

[[tests.go-install]]
name = "download noise collapses on success"
input = """
go: downloading github.com/spf13/cobra v1.8.0
go: downloading github.com/spf13/pflag v1.0.5
"""
expected = "go install: ok"

[[tests.go-install]]
name = "build error keeps package header and continuations"
input = """
go: downloading github.com/x/y v1.0.0
# github.com/x/y
../y/main.go:5:2: undefined: Bar
../y/main.go:9:4: cannot use v (variable of type int) as string value in argument to Print
	have (int)
	want (string)
"""
expected = """
# github.com/x/y
../y/main.go:5:2: undefined: Bar
../y/main.go:9:4: cannot use v (variable of type int) as string value in argument to Print
	have (int)
	want (string)"""
