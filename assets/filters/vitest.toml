[filters.vitest]
description = "Compact Vitest test output"
match_command = "^((pnpm\\s+exec|pnpm\\s+dlx|yarn\\s+dlx|deno\\s+task|npx|bunx|pnpm|yarn)\\s+)?vitest\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*PASS\\s+",
  "^\\s*Test Files\\s+",
  "^\\s*Tests\\s+",
  "^\\s*Time\\s+"
]
keep_lines_matching = [
  "FAIL",
  "× ",
  "AssertionError",
  "Error:",
  "TypeError:",
  "ReferenceError:",
  "SyntaxError:"
]
max_lines = 80


[[tests.vitest]]
name = "failure shown"
input = """
 FAIL  src/utils.test.ts [ src/utils.test.ts ]
 × add › should add two numbers
   AssertionError: expected 4 toBe 3
   => 12 |   expect(add(1, 2)).toBe(3);
        |             ^

 Test Files  1 failed (2)
 Tests  1 failed (5)
"""
expected = """
 FAIL  src/utils.test.ts [ src/utils.test.ts ]
 × add › should add two numbers
   AssertionError: expected 4 toBe 3"""

