[filters.vitest]
description = "Compact Vitest test output"
match_command = "^((pnpm\\s+exec|pnpm\\s+dlx|yarn\\s+dlx|deno\\s+task|npx|bunx|pnpm|yarn)\\s+)?vitest\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*PASS\\s+",
  "^\\s*Test Files\\s+\\d+ passed",
  "^\\s*Tests\\s+\\d+ passed",
  "^\\s*Time\\s+",
  "^\\s*Start at\\s+",
  "^\\s*Duration\\s+"
]
keep_lines_matching = [
  "FAIL",
  "failed",
  "× ",
  "AssertionError",
  "Error:",
  "TypeError:",
  "ReferenceError:",
  "SyntaxError:",
  "→ ",
  "Expected",
  "Received",
  "^\\s*[-+] ",
  "^\\s*❯ ",
  "^\\s*>?\\s*\\d+\\|",
  "^\\s*\\|"
]
max_lines = 80


[[tests.vitest]]
name = "failure keeps diff, code frame, caret and summary"
input = """
 ❯ src/utils.test.ts (5 tests | 1 failed)
   × add › should add two numbers 12ms
     → expected 4 to be 3

⎯⎯⎯⎯⎯⎯⎯ Failed Tests 1 ⎯⎯⎯⎯⎯⎯⎯

 FAIL  src/utils.test.ts > add > should add two numbers
AssertionError: expected 4 to be 3

- Expected
+ Received

- 3
+ 4

 ❯ src/utils.test.ts:12:29
     11|   test('should add', () => {
     12|     expect(add(1, 2)).toBe(3)
       |                       ^
     13|   })

 Test Files  1 failed (1)
      Tests  1 failed | 4 passed (5)
   Duration  1.2s
"""
expected = """
