[filters.hadolint]
description = "Compact hadolint output"
match_command = "^hadolint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+:\\d+\\s+",
  "Error:",
  "Warning:",
  "Info:",
  "Style:"
]
max_lines = 50


[[tests.hadolint]]
name = "issues shown"
input = """
Dockerfile:10 DL3008 Pin versions in apt get install
Dockerfile:15 DL3015 Avoid additional packages by specifying --no-install-recommends
"""
expected = """
Dockerfile:10 DL3008 Pin versions in apt get install
Dockerfile:15 DL3015 Avoid additional packages by specifying --no-install-recommends"""