[filters.docker-build]
description = "Compact docker build output"
match_command = "^docker\\s+(build|buildx\\s+build)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*#\\d+",
  "^\\s*CACHED",
  "^\\s*DONE",
  "^\\s*\\d+\\.\\d+s",
  "^\\s*=> =>",
  "^\\s*=> ",
  "^\\s*\\d+/\\d+",
  "^\\s*\\d+\\.\\d+kB",
  "^\\s*naming to"
]
keep_lines_matching = [
  "error:",
  "failed to",
  "ERROR:",
  "failed to solve"
]
max_lines = 50
on_empty = "docker build: success"

[[tests.docker-build]]
name = "clean build"
input = """
[+] Building 12.3s (10/10) FINISHED
 => [internal] load build definition from Dockerfile
 => => transferring dockerfile: 32B
 => [internal] load .dockerignore
 => => transferring context: 2B
 => [internal] load metadata for docker.io/library/node:20-alpine
 => [1/5] FROM docker.io/library/node:20-alpine
 => [2/5] WORKDIR /app
 => [3/5] COPY package*.json ./
 => [4/5] RUN npm ci
 => [5/5] COPY . .
 => exporting to image
 => => exporting layers
 => => writing image sha256:abc123
"""
expected = "docker build: success"

[[tests.docker-build]]
name = "build failure shown"
input = """
[+] Building 5.2s (6/10)
 => [internal] load build definition from Dockerfile
 => => transferring dockerfile: 32B
 => [3/5] RUN npm ci
 => ERROR: failed to solve: process "/bin/sh -c npm ci" did not complete successfully: exit code: 1
------
 > [3/5] RUN npm ci:
------
error: could not resolve dependency
"""
expected = "error: could not resolve dependency"