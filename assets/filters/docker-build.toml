[filters.docker-build]
description = "Compact docker build output aggressively"
match_command = "^docker\\s+(build|buildx\\s+build)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*#\\d+",
  "^\\s*CACHED",
  "^\\s*DONE",
  "^\\s*\\d+\\.\\d+s",
  "^\\s*=> =>",
  "^\\s*=> ",
  "^\\s*\\d+/\\d+",
  "^\\s*\\d+\\.\\d+kB",
  "^\\s*naming to",
  "^\\s*\\d+\\.\\d+MB",
  "^\\s*\\d+\\.\\d+GB",
  "^\\s*extracting",
  "^\\s*pulling",
]
keep_lines_matching = [
  "error:",
  "failed to",
  "ERROR:",
  "failed to solve",
  "warning:",
  "WARN",
]
max_lines = 40
replace_patterns = [
  ["sha256:[a-f0-9]{64}", "sha256:<hash>"],
  ["[a-f0-9]{12,}(?=\\s|$)", "<layer_id>"],
  ["\\d+\\.\\d+s", "<duration>"],
  ["docker\\.io/library/[^:]+:[^\\s]+", "docker.io/library/<image>"],
]
extract_sections = [
  { start_pattern = "ERROR:", end_pattern = "^\\s*$", include_markers = true, max_matches = 3 },
  { start_pattern = "------", end_pattern = "------", include_markers = true, max_matches = 2 },
]
deduplicate_blocks = { min_block_lines = 2, similarity = 0.7 }
token_budget = 2000


[[tests.docker-build]]
name = "build failure shown"
input = """
[+] Building 5.2s (6/10)
 => [internal] load build definition from Dockerfile
 => => transferring dockerfile: 32B
 => [3/5] RUN npm ci
 => ERROR: failed to solve: process "/bin/sh -c npm ci" did not complete successfully: exit code: 1
 ------
  > [3/5] RUN npm ci:
 ------
 error: could not resolve dependency
"""
expected = " error: could not resolve dependency"

