[filters.git-clone]
description = "Compact git clone output"
match_command = "^git\\s+clone\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Cloning into",
  "^remote:",
  "^Receiving objects:",
  "^Resolving deltas:",
  "^Checking out"
]
keep_lines_matching = [
  "error:",
  "fatal:",
  "failed",
  "Permission denied",
  "Repository not found"
]
max_lines = 20


[[tests.git-clone]]
name = "error shown"
input = """
Cloning into 'my-repo'...
fatal: repository 'https://github.com/user/nonexistent.git' not found
"""
expected = """
fatal: repository 'https://github.com/user/nonexistent.git' not found"""

[[tests.git-clone]]
name = "silent success stays empty"
input = ""
expected = ""