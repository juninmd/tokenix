[filters.gradle-build]
description = "Compact Gradle build output"
match_command = "^(./gradlew|gradle)\\s+(build|assemble|compileJava)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^> Task :",
  "^> Configuring",
  "^BUILD SUCCESSFUL",
  "^\\d+ actionable task",
  "^Deprecated Gradle features"
]
keep_lines_matching = [
  "ERROR",
  "FAILED",
  "BUILD FAILED",
  "Compilation failed",
  "Test.*FAILED",
  "> Task .* FAILED"
]
max_lines = 60


[[tests.gradle-build]]
name = "build failure shown"
input = """
> Task :compileJava FAILED
/src/main/java/com/example/Main.java:10: error: cannot find symbol
  symbol:   variable foo
  location: class com.example.Main
1 error

> Task :compileJava FAILED

FAILURE: Build failed with an exception.

* What went wrong:
Execution failed for task ':compileJava'.
> Compilation failed; see the compiler error output for details.

BUILD FAILED in 5s
"""
expected = """
> Compilation failed; see the compiler error output for details.
BUILD FAILED in 5s"""