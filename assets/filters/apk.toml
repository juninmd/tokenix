[filters.apk]
description = "Compact apk (Alpine) add/del output, keep result summary"
match_command = "^(?:sudo\\s+)?apk\\s+(add|del|upgrade|fix)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^fetch https?://",
  "^\\(\\d+/\\d+\\) (?:Installing|Purging) ",
  "^Executing busybox",
  "^Executing .*-trigger",
]
keep_lines_matching = [
  "^OK:",
  "^ERROR:",
  "^WARNING:",
  "unsatisfiable constraints",
  "No such package",
  "^\\(\\d+/\\d+\\) (?:Upgrading|Replacing) ",
]
max_lines = 40
on_empty = "apk: ok"
token_budget = 1200

[[tests.apk]]
name = "result kept, per-package churn dropped"
input = """
fetch https://dl-cdn.alpinelinux.org/alpine/v3.19/main/x86_64/APKINDEX.tar.gz
fetch https://dl-cdn.alpinelinux.org/alpine/v3.19/community/x86_64/APKINDEX.tar.gz
(1/3) Installing oniguruma (6.9.8-r0)
(2/3) Installing jq (1.7.1-r0)
(3/3) Installing libxml2 (2.11.7-r0)
Executing busybox-1.36.1-r15.trigger
OK: 12 MiB in 18 packages
"""
expected = """OK: 12 MiB in 18 packages"""

[[tests.apk]]
name = "missing package surfaced"
input = """
fetch https://dl-cdn.alpinelinux.org/alpine/v3.19/main/x86_64/APKINDEX.tar.gz
ERROR: unable to select packages:
  nosuchpkg (no such package):
    required by: world[nosuchpkg]
"""
expected = """ERROR: unable to select packages:"""
