[filters.git-stash]
description = "Compact git stash output"
match_command = "^git\\s+stash\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Saved working directory",
  "^Dropped refs/stash",
  "^HEAD is now at",
  "^No local changes to save"
]
keep_lines_matching = [
  "error:",
  "fatal:",
  "failed"
]
max_lines = 20
on_empty = "git stash: done"

[[tests.git-stash]]
name = "clean stash"
input = """
Saved working directory and index state WIP on main: abc1234 Add feature
"""
expected = "git stash: done"

[[tests.git-stash]]
name = "pop with conflict"
input = """
Auto-merging src/main.rs
CONFLICT (content): Merge conflict in src/main.rs
The stash entry is kept in case you need it again.
"""
expected = """
Auto-merging src/main.rs
CONFLICT (content): Merge conflict in src/main.rs
The stash entry is kept in case you need it again."""