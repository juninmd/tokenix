[filters.git-stash]
description = "Compact git stash output"
match_command = "^git\\s+stash\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Saved working directory",
  "^Dropped refs/stash",
  "^HEAD is now at",
  "^No local changes to save"
]
keep_lines_matching = [
  "error:",
  "fatal:",
  "failed"
]
max_lines = 20


