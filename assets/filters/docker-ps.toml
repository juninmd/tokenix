[filters.docker-ps]
description = "Compact docker ps output"
match_command = "^docker\\s+ps\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^CONTAINER ID"
]
keep_lines_matching = [
  "Up ",
  "Exited",
  "Restarting",
  "Paused",
  "Dead"
]
max_lines = 30

[[tests.docker-ps]]
name = "running containers"
input = """
CONTAINER ID   IMAGE           COMMAND                  CREATED         STATUS         PORTS                    NAMES
abc123def456   nginx:alpine    "/docker-entrypoint.…"   2 hours ago     Up 2 hours     0.0.0.0:8080->80/tcp     web
def456abc123   postgres:15     "docker-entrypoint.s…"   2 hours ago     Up 2 hours     5432/tcp                 db
"""
expected = """
abc123def456   nginx:alpine    "/docker-entrypoint.…"   2 hours ago     Up 2 hours     0.0.0.0:8080->80/tcp     web
def456abc123   postgres:15     "docker-entrypoint.s…"   2 hours ago     Up 2 hours     5432/tcp                 db"""

[[tests.docker-ps]]
name = "exited container shown"
input = """
CONTAINER ID   IMAGE           COMMAND                  CREATED         STATUS                     PORTS     NAMES
abc123def456   nginx:alpine    "/docker-entrypoint.…"   2 hours ago     Up 2 hours                 0.0.0.0:8080->80/tcp     web
def456abc123   postgres:15     "docker-entrypoint.s…"   2 hours ago     Exited (1) 5 minutes ago             db
"""
expected = """
abc123def456   nginx:alpine    "/docker-entrypoint.…"   2 hours ago     Up 2 hours                 0.0.0.0:8080->80/tcp     web
def456abc123   postgres:15     "docker-entrypoint.s…"   2 hours ago     Exited (1) 5 minutes ago             db"""