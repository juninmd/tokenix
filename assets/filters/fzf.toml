[filters.fzf]
description = "Compact fzf output"
match_command = "^fzf\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
max_lines = 30

[[tests.fzf]]
name = "selection made"
input = """
src/main.rs
"""
expected = """
src/main.rs"""

[[tests.fzf]]
name = "no selection"
input = """
"""
expected = ""