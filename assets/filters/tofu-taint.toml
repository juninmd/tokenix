[filters.tofu-taint]
description = "Compact OpenTofu taint output"
match_command = "^tofu\\s+taint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Resource instance"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "marked as tainted",
  "No such resource"
]
max_lines = 20

[[tests.tofu-taint]]
name = "error shown"
input = """
Error: No such resource instance
"""
expected = "Error: No such resource instance"

[[tests.tofu-taint]]
name = "silent success stays empty"
input = ""
expected = ""