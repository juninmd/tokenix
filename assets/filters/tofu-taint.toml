[filters.tofu-taint]
description = "Compact OpenTofu taint output"
match_command = "^tofu\\s+taint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Resource instance"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "marked as tainted",
  "No such resource"
]
max_lines = 20


