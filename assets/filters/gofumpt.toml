[filters.gofumpt]
description = "Compact gofumpt output"
match_command = "^gofumpt\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+\\.go:\\d+:\\d+:",
  "error:",
  "warning:"
]
max_lines = 30


[[tests.gofumpt]]
name = "files changed"
input = """
main.go:10:5: missing comma
utils.go:15:1: extra blank line
"""
expected = """
main.go:10:5: missing comma
utils.go:15:1: extra blank line"""