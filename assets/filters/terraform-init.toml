[filters.terraform-init]
description = "Compact terraform init output"
match_command = "^terraform\\s+init\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Initializing the backend",
  "^Initializing provider plugins",
  "^\\s*Finding ",
  "^\\s*Installing ",
  "^\\s*Installed ",
  "^Terraform has been successfully initialized"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "Failed",
  "Failed to",
  "│ Error",
  "│ Warning"
]
max_lines = 40


[[tests.terraform-init]]
name = "error shown"
input = """
Initializing the backend...
Error: Failed to get existing workspaces: accessing S3 bucket: AccessDenied
"""
expected = """
Error: Failed to get existing workspaces: accessing S3 bucket: AccessDenied"""