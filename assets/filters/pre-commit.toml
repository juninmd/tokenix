[filters.pre-commit]
description = "Compact pre-commit output aggressively"
match_command = "^pre-commit\\s+(run|install|autoupdate)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\[INFO\\]",
  "^\\s*Installing",
  "^\\s*Installing environment",
  "^\\s*\\d+ passed",
  "^\\s*\\d+ failed",
  "^\\s*All hooks passed",
  "^\\s*\\.\\.\\.\\.\\.Passed",
  "^\\s*\\.\\.\\.\\.\\.Skipped",
  "^\\s*\\d+\\.\\d+s$",
  "^\\s*Environment:",
]
keep_lines_matching = [
  "FAILED",
  "Error:",
  "error:",
  "Hook failed",
  "returned non-zero",
  "Failed",
  "warning",
  "WARNING",
]
max_lines = 30
on_empty = "pre-commit: passed"
replace_patterns = [
  ["https://github\\.com/[^\\s]+", "github.com/<repo>"],
  ["\\.\\.\\.\\.\\.\\.+Passed", "Passed"],
  ["\\.\\.\\.\\.\\.\\.+Failed", "Failed"],
  ["\\.\\.\\.\\.\\.\\.+Skipped", "Skipped"],
  ["\\d+\\.\\d+s", "<duration>"],
]
extract_sections = [
  { start_pattern = "^\\s*[-*] hook id:", end_pattern = "^\\s*$", include_markers = true, max_matches = 10 },
  { start_pattern = "Error:", end_pattern = "^\\s*$", include_markers = true, max_matches = 5 },
]
deduplicate_blocks = { min_block_lines = 2, similarity = 0.7 }
token_budget = 1500

[[tests.pre-commit]]
name = "hooks pass"
input = """
[INFO] Installing environment for https://github.com/pre-commit/pre-commit-hooks.
[INFO] Once installed this environment will be reused.
[INFO] This may take a few minutes...
Trim Trailing Whitespace...............................................Passed
Fix End of Files......................................................Passed
Check Yaml............................................................Passed
"""
expected = "pre-commit: passed"

[[tests.pre-commit]]
name = "hook failure shown"
input = """
Check Yaml............................................................Failed
- hook id: check-yaml
- exit code: 1

Error: Invalid YAML: mapping values are not allowed here
  in ".github/workflows/ci.yml", line 10, column 15
"""
expected = "Error: Invalid YAML: mapping values are not allowed here"

[[tests.pre-commit]]
name = "multiple hook failures deduplicated"
input = """
Check Yaml............................................................Failed
- hook id: check-yaml
- exit code: 1

Error: Invalid YAML: mapping values are not allowed here

Check JSON............................................................Failed
- hook id: check-json
- exit code: 1

Error: Invalid JSON: unexpected token

Check TOML............................................................Failed
- hook id: check-toml
- exit code: 1

Error: Invalid TOML: key not found
"""
expected = """
Error: Invalid YAML: mapping values are not allowed here
Check JSONFailed
Error: Invalid JSON: unexpected token
Check TOMLFailed
Error: Invalid TOML: key not found"""