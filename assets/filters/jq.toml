[filters.jq]
description = "Compact jq output"
match_command = "^jq\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "parse error",
  "error:",
  "Invalid"
]
max_lines = 50
on_empty = "jq: ok"

[[tests.jq]]
name = "clean json output"
input = """
{
  "name": "John",
  "age": 30,
  "city": "New York"
}
"""
expected = "jq: ok"

[[tests.jq]]
name = "parse error shown"
input = """
parse error: Invalid numeric literal at line 2, column 10
"""
expected = """
parse error: Invalid numeric literal at line 2, column 10"""