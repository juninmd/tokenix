[filters.jq]
description = "Compact jq output"
match_command = "^jq\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
max_lines = 50

[[tests.jq]]
name = "clean json output"
input = """
{
  "name": "John",
  "age": 30,
  "city": "New York"
}
"""
expected = '''
{
  "name": "John",
  "age": 30,
  "city": "New York"
}'''

[[tests.jq]]
name = "json containing Invalid and error fields passes through complete"
input = """
{
  "status": "Invalid",
  "error": null,
  "message": "validation failed upstream"
}
"""
expected = '''
{
  "status": "Invalid",
  "error": null,
  "message": "validation failed upstream"
}'''

[[tests.jq]]
name = "parse error shown"
input = """
parse error: Invalid numeric literal at line 2, column 10
"""
expected = """
parse error: Invalid numeric literal at line 2, column 10"""
