[filters.cargo-clippy]
description = "Compact cargo clippy output"
match_command = "^cargo\\s+clippy\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Checking",
  "^\\s*Finished",
  "^\\s*Fresh"
]
keep_lines_matching = [
  "warning:",
  "error:",
  "note:"
]
max_lines = 80

[[tests.cargo-clippy]]
name = "clean"
input = """
Checking my-crate v0.1.0
Finished dev [unoptimized + debuginfo] target(s) in 0.5s
"""
expected = "cargo clippy: no warnings"

[[tests.cargo-clippy]]
name = "warnings shown"
input = """
Checking my-crate v0.1.0
warning: unused import: `std::io::Write`
 --> src/main.rs:5:5
  |
5 | use std::io::Write;
  |     ^^^^^^^^^^^^^^
  |
  = note: `#[warn(unused_imports)]` on by default
  = help: remove the import

warning: this `if` can be removed
 --> src/main.rs:10:5
  |
10 |     if true {
  |     ^^^^^^^
  |
  = help: remove the `if` block

Finished dev [unoptimized + debuginfo] target(s) in 0.5s
"""
expected = """
warning: unused import: `std::io::Write`
  = note: `#[warn(unused_imports)]` on by default
warning: this `if` can be removed"""