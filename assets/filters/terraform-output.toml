[filters.terraform-output]
description = "Compact terraform output output"
match_command = "^terraform\\s+output\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+\\s*=",
  "Error:",
  "Error:"
]
max_lines = 30

[[tests.terraform-output]]
name = "outputs shown"
input = """
instance_ip = "54.123.45.67"
instance_id = "i-1234567890abcdef0"
vpc_id = "vpc-12345678"
"""
expected = "instance_ip = \"54.123.45.67\"\ninstance_id = \"i-1234567890abcdef0\"\nvpc_id = \"vpc-12345678\""

