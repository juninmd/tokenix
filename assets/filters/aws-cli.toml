[filters.aws-cli]
description = "Compact AWS CLI output"
match_command = "^aws\\s+\\w+\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*{",
  "^\\s*}"
]
keep_lines_matching = [
  "Error",
  "error",
  "Invalid",
  "AccessDenied",
  "UnauthorizedOperation",
  "Throttling",
  "Rate exceeded"
]
max_lines = 50


[[tests.aws-cli]]
name = "error shown"
input = """
An error occurred (UnauthorizedOperation) when calling the DescribeInstances operation: You are not authorized to perform this operation.
"""
expected = """
An error occurred (UnauthorizedOperation) when calling the DescribeInstances operation: You are not authorized to perform this operation."""