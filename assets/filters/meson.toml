[filters.meson]
description = "Compact meson setup/compile output, keep errors and key facts"
match_command = "^meson\\s+(setup|compile|configure|test|install)\\b"
passthrough_when_emptied = true
strip_ansi = true
keep_lines_matching = [
  "ERROR:",
  "WARNING:",
  "^meson.build:\\d+",
  "Build targets in project",
  "^Project name:",
  "^\\s*\\d+/\\d+ \\S.*(?:FAIL|ERROR|TIMEOUT)",
  "Ok:\\s+\\d+",
  "Fail:\\s+\\d+",
  "Build failed",
  "(?i)\\berror",
  "^FAILED:",
  "^ninja: build stopped",
  "^\\s*\\d+ \\|",
  "^\\s*\\|",
]
max_lines = 50
token_budget = 1500

[[tests.meson]]
name = "compile failure keeps compiler diagnostic, snippet and caret"
input = """
INFO: autodetecting backend as ninja
ninja: Entering directory `/work/build'
[1/2] Compiling C object mylib.o
FAILED: mylib.o
cc -Ilib -c ../lib/foo.c -o mylib.o
../lib/foo.c: In function 'main':
../lib/foo.c:5:5: error: 'x' undeclared (first use in this function)
    5 |     x = 5;
      |     ^
ninja: build stopped: subcommand failed.
"""
expected = """FAILED: mylib.o
../lib/foo.c:5:5: error: 'x' undeclared (first use in this function)
    5 |     x = 5;
      |     ^
ninja: build stopped: subcommand failed."""

[[tests.meson]]
name = "build error surfaced"
input = """
The Meson build system
Version: 1.3.0
Source dir: /work
Build dir: /work/build
meson.build:12:0: ERROR: Unknown compiler(s): cc
"""
expected = """meson.build:12:0: ERROR: Unknown compiler(s): cc"""

[[tests.meson]]
name = "test summary kept"
input = """
ninja: Entering directory `/work/build'
1/3 mylib_test          OK              0.05s
2/3 io_test             FAIL            0.12s
3/3 net_test            OK              0.03s

Ok:                 2
Fail:               1
"""
expected = """2/3 io_test             FAIL            0.12s
Ok:                 2
Fail:               1"""
