[filters.cargo-build]
description = "Compact cargo build output"
match_command = "^cargo\\s+build\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Compiling",
  "^\\s*Fresh",
  "^\\s*Finished"
]
keep_lines_matching = [
  "error\\[",
  "warning:",
  "note:"
]
max_lines = 80
on_empty = "cargo build: build succeeded"

[[tests.cargo-build]]
name = "clean build"
input = """
   Compiling libc v0.2.150
   Compiling my-crate v0.1.0
    Finished dev [unoptimized + debuginfo] target(s) in 2.3s
"""
expected = "cargo build: build succeeded"

[[tests.cargo-build]]
name = "build with warnings"
input = """
   Compiling my-crate v0.1.0
warning: unused import: `std::io::Write`
 --> src/main.rs:5:5
  |
5 | use std::io::Write;
  |     ^^^^^^^^^^^^^^
  |
  = note: `#[warn(unused_imports)]` on by default

    Finished dev [unoptimized + debuginfo] target(s) in 1.2s
"""
expected = """warning: unused import: `std::io::Write`
  = note: `#[warn(unused_imports)]` on by default"""