[filters.cargo-build]
description = "Compact cargo build output"
match_command = "^cargo\\s+build\\b"
passthrough_when_emptied = true
strip_ansi = true
# rustc writes every diagnostic to stderr; without this the filter never sees them.
filter_stderr = true
notify_on_truncate = true
priority_lines = ["^error"]
# A warning keeps its message and location; its snippet is most of the bytes.
# Errors are not capped: their snippet carries the compiler's suggested fix.
block_caps = [
  { start = "^warning(\\[[\\w-]+\\])?: ", end = "^(\\s*$|[A-Za-z])", max_lines = 2 },
]
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Compiling",
  "^\\s*Fresh",
  "^\\s*Downloading",
  "^\\s*Downloaded"
]
max_lines = 80

[[tests.cargo-build]]
name = "clean build"
input = """
   Compiling libc v0.2.150
   Compiling my-crate v0.1.0
    Finished dev [unoptimized + debuginfo] target(s) in 2.3s
"""
expected = "    Finished dev [unoptimized + debuginfo] target(s) in 2.3s"

[[tests.cargo-build]]
name = "build with warnings"
input = """
   Compiling my-crate v0.1.0
warning: unused import: `std::io::Write`
 --> src/main.rs:5:5
  |
5 | use std::io::Write;
  |     ^^^^^^^^^^^^^^
  |
  = note: `#[warn(unused_imports)]` on by default

    Finished dev [unoptimized + debuginfo] target(s) in 1.2s
"""
expected = """warning: unused import: `std::io::Write`
 --> src/main.rs:5:5
    Finished dev [unoptimized + debuginfo] target(s) in 1.2s
[... 5 detail lines omitted from 1 blocks ...]"""

[[tests.cargo-build]]
name = "errors keep their snippet while warnings collapse"
input = """
   Compiling demo v0.1.0 (/work/demo)
warning: unused variable: `unused_1`
 --> src/lib.rs:3:38
  |
3 | pub fn helper_1(x: i64) -> i64 { let unused_1 = x; x * 1 }
  |                                      ^^^^^^^^ help: prefix it with an underscore: `_unused_1`

error[E0425]: cannot find value `undefined_var` in this scope
 --> src/lib.rs:1:47
  |
1 | pub fn add(a: i64, b: i64) -> i64 { a + b + undefined_var }
  |                                             ^^^^^^^^^^^^^ not found in this scope

error: could not compile `demo` (lib) due to 1 previous error; 1 warning emitted
"""
expected = """
warning: unused variable: `unused_1`
 --> src/lib.rs:3:38
error[E0425]: cannot find value `undefined_var` in this scope
 --> src/lib.rs:1:47
  |
1 | pub fn add(a: i64, b: i64) -> i64 { a + b + undefined_var }
  |                                             ^^^^^^^^^^^^^ not found in this scope
error: could not compile `demo` (lib) due to 1 previous error; 1 warning emitted
[... 3 detail lines omitted from 1 blocks ...]"""
