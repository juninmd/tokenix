[filters.earthly]
description = "Keep earthly result banner and output artifacts, drop per-step logs"
match_command = "^earthly\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "\\|\\s+--> ",
  "\\|\\s+RUN ",
  "\\|\\s+COPY ",
]
keep_lines_matching = [
  "=== SUCCESS ===",
  "=== FAILURE ===",
  "Image .* output as",
  "Artifact .* output as",
  "(?i)error",
  "(?i)fail",
  "\\*failed\\*",
]
max_lines = 60
on_empty = "earthly: done"

[[tests.earthly]]
name = "result and artifacts kept"
input = """
+build | --> RUN go build
+build | RUN go build ./...
+build | Image +build output as docker.io/app:latest
=========================== SUCCESS ===========================
"""
expected = """+build | Image +build output as docker.io/app:latest
=========================== SUCCESS ==========================="""

[[tests.earthly]]
name = "failure keeps failed-target recap output"
input = """
+build | --> RUN go build ./...
Repeating the output of the command that caused the failure
+build *failed* | --> RUN go build ./...
+build *failed* | ./main.go:10:5: undefined: foo
+build *failed* | ERROR: command exited with code 1
=========================== FAILURE ===========================
Error: build target +build failed
"""
expected = """Repeating the output of the command that caused the failure
+build *failed* | ./main.go:10:5: undefined: foo
+build *failed* | ERROR: command exited with code 1
=========================== FAILURE ===========================
Error: build target +build failed"""
