[filters.helm-status]
description = "Compact helm status output"
match_command = "^helm\\s+status\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^NAME:",
  "^LAST DEPLOYED:",
  "^NAMESPACE:",
  "^REVISION:",
  "^TEST SUITE:"
]
keep_lines_matching = [
  "^STATUS:",
  "Error:",
  "FAILED",
  "failed"
]
max_lines = 30

[[tests.helm-status]]
name = "clean status"
input = """
NAME: myapp
LAST DEPLOYED: Mon Jan 15 10:30:00 2024
NAMESPACE: default
STATUS: deployed
REVISION: 1
TEST SUITE: None
"""
expected = "STATUS: deployed"

[[tests.helm-status]]
name = "failed status"
input = """
NAME: myapp
LAST DEPLOYED: Mon Jan 15 10:30:00 2024
NAMESPACE: default
STATUS: failed
REVISION: 1
TEST SUITE: None
"""
expected = "STATUS: failed"