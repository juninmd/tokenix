[filters.pipx-install]
description = "Compact pipx install output"
match_command = "^pipx\\s+install\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*installing ",
  "^\\s*installed package",
  "^\\s*done",
  "^\\s*\\✓",
  "^\\s*✔"
]
keep_lines_matching = [
  "Error:",
  "error:",
  "ERROR",
  "Fatal error",
  "Error installing",
  "failed",
  "FAILED",
  "not found"
]
max_lines = 20


[[tests.pipx-install]]
name = "pip resolution failure preserved"
input = """
Fatal error from pip prevented installation. Full pip output in file:
    /home/user/.local/state/pipx/log/cmd_2024-01-15_pip_errors.log

Some possibly relevant errors from pip install:
    ERROR: Could not find a version that satisfies the requirement nonexistent-package-xyz (from versions: none)
    ERROR: No matching distribution found for nonexistent-package-xyz

Error installing nonexistent-package-xyz.
"""
expected = """
Fatal error from pip prevented installation. Full pip output in file:
    ERROR: Could not find a version that satisfies the requirement nonexistent-package-xyz (from versions: none)
    ERROR: No matching distribution found for nonexistent-package-xyz
Error installing nonexistent-package-xyz."""

[[tests.pipx-install]]
name = "silent success stays empty"
input = ""
expected = ""