[filters.pytest]
description = "Compact pytest test runs"
match_command = "^(python\\s+-m\\s+)?pytest\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^platform\\s+",
  "^cachedir:",
  "^rootdir:",
  "^configfile:",
  "^plugins:",
  "^collected \\d+ items",
  "^passed in",
  "^\\.+[\\s$]",
  "^\\s*\\d+%\\s*$",
  "^[\\.sFp]+$"
]
max_lines = 80
on_empty = "pytest: all tests passed"

[[tests.pytest]]
name = "All pytest tests pass"
input = """
============================= test session starts =============================
platform linux -- Python 3.10.5, pytest-7.1.2, pluggy-1.0.0
rootdir: /home/user/project
collected 3 items

test_main.py ...                                                         [100%]

============================== 3 passed in 0.05s ===============================
"""
expected = """============================= test session starts =============================
test_main.py ...                                                         [100%]
============================== 3 passed in 0.05s ==============================="""

[[tests.pytest]]
name = "Pytest failure"
input = """
============================= test session starts =============================
platform linux -- Python 3.10.5, pytest-7.1.2, pluggy-1.0.0
rootdir: /home/user/project
collected 2 items

test_main.py .F                                                          [100%]

================================── FAILURES ──==================================
__________________________________ test_fail ___________________________________

    def test_fail():
>       assert False
E       assert False

test_main.py:8: AssertionError
=========================== short test summary info ============================
FAILED test_main.py::test_fail - assert False
========================= 1 failed, 1 passed in 0.08s ==========================
"""
expected = """============================= test session starts =============================
test_main.py .F                                                          [100%]
================================── FAILURES ──==================================
__________________________________ test_fail ___________________________________
    def test_fail():
>       assert False
E       assert False
test_main.py:8: AssertionError
=========================== short test summary info ============================
FAILED test_main.py::test_fail - assert False
========================= 1 failed, 1 passed in 0.08s =========================="""
