[filters.pytest]
description = "Compact pytest output"
match_command = "^(python\\s+-m\\s+)?pytest\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\.\\.\\.",

  "^\\s*---",
  "^\\s*passed\\s+in\\s+",
  "^\\s*\\d+ passed",
  "^\\s*\\d+ failed",
  "^\\s*\\d+ skipped",
  "^\\s*\\d+ warnings",

  "^\\s*PASSED",
  "^\\s*SKIPPED"
]
keep_lines_matching = [
  "passed",
  "FAILED",
  "ERROR",
  "AssertionError",
  "Traceback",
  "File ",
  "assert ",
  "^E\\s+",
  "^>\\s",
  "\\.py:\\d+",
  "^_+ [^_].* _+$",
]
max_lines = 80


[[tests.pytest]]
name = "assert failure keeps header, source, E-continuations and location"
input = """
============================= test session starts ==============================
collected 3 items

test_utils.py ..F                                                        [100%]

=================================== FAILURES ===================================
__________________________________ test_add ___________________________________

    def test_add():
>       assert add(1, 2) == 3
E       assert 4 == 3
E        +  where 4 = add(1, 2)

test_utils.py:5: AssertionError
=========================== short test summary info ============================
FAILED test_utils.py::test_add - assert 4 == 3
============================= 1 failed, 2 passed in 0.05s ======================
"""
expected = """
__________________________________ test_add ___________________________________
>       assert add(1, 2) == 3
E       assert 4 == 3
E        +  where 4 = add(1, 2)
test_utils.py:5: AssertionError
FAILED test_utils.py::test_add - assert 4 == 3
============================= 1 failed, 2 passed in 0.05s ======================"""

[[tests.pytest]]
name = "silent success stays empty"
input = ""
expected = ""