[filters.mongosh]
description = "Compact mongosh output"
match_command = "^mongosh\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Current Mongosh Log ID:",
  "^\\s*Connecting to:",
  "^\\s*Using MongoDB:",
  "^\\s*For mongosh info"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "MongoServerError",
  "MongoNetworkError",
  "MongoCursorExhaustedError"
]
max_lines = 30
on_empty = "mongosh: ok"

[[tests.mongosh]]
name = "clean connection"
input = """
Current Mongosh Log ID: 65a1b2c3d4e5f6a7b8c9d0e1
Connecting to:      mongodb://localhost:27017/?directConnection=true&serverSelectionTimeoutMS=2000&appName=mongosh+2.2.0
Using MongoDB:      7.0.5
Using Mongosh:      2.2.0

test> 
"""
expected = "mongosh: ok"

[[tests.mongosh]]
name = "error shown"
input = """
MongoServerError: Authentication failed.
"""
expected = """
MongoServerError: Authentication failed."""