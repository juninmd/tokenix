[filters.mongosh]
description = "Compact mongosh output"
match_command = "^mongosh\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Current Mongosh Log ID:",
  "^\\s*Connecting to:",
  "^\\s*Using MongoDB:",
  "^\\s*For mongosh info"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "MongoServerError",
  "MongoNetworkError",
  "MongoCursorExhaustedError"
]
max_lines = 30


[[tests.mongosh]]
name = "error shown"
input = """
MongoServerError: Authentication failed.
"""
expected = """
MongoServerError: Authentication failed."""

[[tests.mongosh]]
name = "silent success stays empty"
input = ""
expected = ""