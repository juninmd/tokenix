[filters.tofu-destroy]
description = "Compact OpenTofu destroy output"
match_command = "^tofu\\s+destroy\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\w+\\.\\w+:\\s+Destroying",
  "^\\s*\\w+\\.\\w+:\\s+Destruction complete",
  "^Destroy complete"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "Failed",
  "│ Error",
  "│ Warning",
  "still destroying"
]
max_lines = 50
on_empty = "tofu destroy: complete"

[[tests.tofu-destroy]]
name = "clean destroy"
input = """
aws_instance.web: Destroying... [id=i-1234567890abcdef0]
aws_instance.web: Destruction complete after 5s

Destroy complete! Resources: 1 destroyed.
"""
expected = "tofu destroy: complete"

[[tests.tofu-destroy]]
name = "error shown"
input = """
aws_instance.web: Destroying... [id=i-1234567890abcdef0]
aws_instance.web: Still destroying... [10s elapsed]
Error: Error terminating instance: InvalidInstanceID.NotFound
"""
expected = "Error: Error terminating instance: InvalidInstanceID.NotFound"