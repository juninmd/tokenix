[filters.eslint]
description = "Compact ESLint output"
match_command = "^(npx\\s+)?eslint\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+ problems?",
  "^\\s*✔",
  "^\\s*No problems"
]
max_lines = 100


[[tests.eslint]]
name = "issues shown"
input = """
/src/main.ts
  10:5  error  'x' is assigned a value but never used  @typescript-eslint/no-unused-vars
  15:1  warning  Line too long  max-len

✖ 2 problems (1 error, 1 warning)
"""
expected = """/src/main.ts
  10:5  error  'x' is assigned a value but never used  @typescript-eslint/no-unused-vars
  15:1  warning  Line too long  max-len
✖ 2 problems (1 error, 1 warning)"""

[[tests.eslint]]
name = "silent success stays empty"
input = ""
expected = ""