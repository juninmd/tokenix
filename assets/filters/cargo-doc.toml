[filters.cargo-doc]
description = "Compact cargo doc output"
match_command = "^cargo\\s+doc\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Documenting",
  "^\\s*Compiling",
  "^\\s*Checking",
  "^\\s*Fresh",
  "^\\s*Downloading",
  "^\\s*Downloaded"
]
max_lines = 50

[[tests.cargo-doc]]
name = "clean doc generation"
input = """
Documenting my-crate v0.1.0
Finished dev [unoptimized + debuginfo] target(s) in 2.3s
"""
expected = "Finished dev [unoptimized + debuginfo] target(s) in 2.3s"

[[tests.cargo-doc]]
name = "warning block survives"
input = """
Documenting my-crate v0.1.0
warning: unresolved link to `Missing`
 --> src/lib.rs:4:6
  |
4 | /// [Missing]
  |      ^^^^^^^ no item named `Missing` in scope
  |
  = note: `#[warn(rustdoc::broken_intra_doc_links)]` on by default

Finished dev [unoptimized + debuginfo] target(s) in 2.3s
"""
expected = """warning: unresolved link to `Missing`
 --> src/lib.rs:4:6
  |
4 | /// [Missing]
  |      ^^^^^^^ no item named `Missing` in scope
  |
  = note: `#[warn(rustdoc::broken_intra_doc_links)]` on by default
Finished dev [unoptimized + debuginfo] target(s) in 2.3s"""
