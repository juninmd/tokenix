[filters.maven-build]
description = "Compact Maven build output"
match_command = "^mvn\\s+(clean\\s+)?verify\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\[INFO\\]\\s+---",
  "^\\[INFO\\]\\s+Building ",
  "^\\[INFO\\]\\s+Downloading ",
  "^\\[INFO\\]\\s+Downloaded ",
  "^\\[INFO\\]\\s+BUILD SUCCESS",
  "^\\[INFO\\]\\s+Total time:",
  "^\\[INFO\\]\\s+Finished at:",
  "^\\[INFO\\]\\s+Final Memory:"
]
keep_lines_matching = [
  "ERROR",
  "FAILURE",
  "BUILD FAILURE",
  "Compilation failure",
  "Test failures",
  "There are test failures",
  "^\\s+(?:symbol|location|required|found|reason):",
  "^[\\w.]*(?:Exception|Error)(?::|$)",
  "^Caused by:",
  "^\\s*(?:expected|but was)\\s*:"
]
max_lines = 60


[[tests.maven-build]]
name = "build failure keeps javac symbol/location continuations"
command = "mvn verify"
input = """
[INFO] Scanning for projects...
[INFO]
[INFO] --- maven-compiler-plugin:3.8.1:compile (default-compile) @ my-project ---
[INFO] Changes detected - recompiling the module!
[INFO] Compiling 15 source files to /project/target/classes
[INFO] -------------------------------------------------------------
[ERROR] COMPILATION ERROR :
[INFO] -------------------------------------------------------------
[ERROR] /project/src/main/java/com/example/Main.java:[10,5] cannot find symbol
  symbol:   variable foo
  location: class com.example.Main
[INFO] 1 error
[INFO] -------------------------------------------------------------
[INFO] ------------------------------------------------------------------------
[INFO] BUILD FAILURE
[INFO] ------------------------------------------------------------------------
"""
expected = """
[ERROR] COMPILATION ERROR :
[ERROR] /project/src/main/java/com/example/Main.java:[10,5] cannot find symbol
  symbol:   variable foo
  location: class com.example.Main
[INFO] BUILD FAILURE"""

