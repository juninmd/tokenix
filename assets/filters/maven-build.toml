[filters.maven-build]
description = "Compact Maven build output"
match_command = "^mvn\\s+(clean\\s+)?(install|package|compile|verify|test)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\[INFO\\]\\s+---",
  "^\\[INFO\\]\\s+Building ",
  "^\\[INFO\\]\\s+Downloading ",
  "^\\[INFO\\]\\s+Downloaded ",
  "^\\[INFO\\]\\s+BUILD SUCCESS",
  "^\\[INFO\\]\\s+Total time:",
  "^\\[INFO\\]\\s+Finished at:",
  "^\\[INFO\\]\\s+Final Memory:"
]
keep_lines_matching = [
  "ERROR",
  "FAILURE",
  "BUILD FAILURE",
  "Compilation failure",
  "Test failures",
  "There are test failures"
]
max_lines = 60
on_empty = "maven build: success"

[[tests.maven-build]]
name = "clean build"
input = """
