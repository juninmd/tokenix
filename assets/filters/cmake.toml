[filters.cmake]
description = "Compact cmake output"
match_command = "^cmake\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^-- ",
  "^\\s*Configuring done",
  "^\\s*Generating done",
  "^\\s*Build files have been written"
]
keep_lines_matching = [
  "CMake Error",
  "CMake Warning",
  "error:",
  "FAILED"
]
max_lines = 50

[[tests.cmake]]
name = "clean configure"
input = """
-- The C compiler identification is GNU 13.2.0
-- The CXX compiler identification is GNU 13.2.0
-- Configuring done
-- Generating done
-- Build files have been written to: /build
"""
expected = '''
-- The C compiler identification is GNU 13.2.0
-- The CXX compiler identification is GNU 13.2.0
-- Configuring done
-- Generating done
-- Build files have been written to: /build'''

[[tests.cmake]]
name = "error shown"
input = """
-- The C compiler identification is GNU 13.2.0
CMake Error at CMakeLists.txt:10 (find_package):
  Could not find a package configuration file provided by "Qt6" with any of
  the following names:
    Qt6Config.cmake
    qt6-config.cmake
"""
expected = "CMake Error at CMakeLists.txt:10 (find_package):"