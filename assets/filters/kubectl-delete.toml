[filters.kubectl-delete]
description = "Compact kubectl delete output"
match_command = "^kubectl\\s+delete\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\w+/\\w+\\s+deleted$"
]
keep_lines_matching = [
  "error:",
  "Error:",
  "Failed",
  "FAILED",
  "cannot",
  "not found"
]
max_lines = 30


[[tests.kubectl-delete]]
name = "error shown"
input = """
error: resource(s) were provided, but no name, label selector, or --all flag specified
"""
expected = """
error: resource(s) were provided, but no name, label selector, or --all flag specified"""

[[tests.kubectl-delete]]
name = "silent success stays empty"
input = ""
expected = ""