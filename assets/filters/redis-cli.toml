[filters.redis-cli]
description = "Compact redis-cli output"
match_command = "^redis-cli\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "ERROR",
  "Error",
  "ERR ",
  "WRONGTYPE",
  "NIL"
]
max_lines = 30


[[tests.redis-cli]]
name = "error shown"
input = """
ERR unknown command 'INVALID', with args beginning with:
"""
expected = """
ERR unknown command 'INVALID', with args beginning with:"""