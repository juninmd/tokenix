[filters.bundle]
description = "Compact Bundler output"
match_command = "^bundle\\s+(add|outdated|show)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Fetching",
  "^Installing",
  "^Using ",
  "^Bundle complete",
  "^\\d+ gem",
  "^\\d+ dependency",
  "^Resolving dependencies",
  "^Fetching gem metadata",
  "^Fetching source index",
  "^Removing",
]
keep_lines_matching = [
  "Bundler::",
  "Error",
  "error:",
  "Could not find",
  "No matching version",
  "retry",
  "Retry",
  "An error occurred",
  "Installing",
  "Updating",
  "Removed",
]
max_lines = 40


[[tests.bundle]]
name = "error shown"
input = """
Fetching gem metadata from https://rubygems.org/..........
Resolving dependencies.......
Could not find gem 'nonexistent-gem' in any of the gem sources listed in your Gemfile.
"""
expected = """
Could not find gem 'nonexistent-gem' in any of the gem sources listed in your Gemfile."""

[[tests.bundle]]
name = "silent success stays empty"
input = ""
expected = ""