[filters.cargo-deny]
description = "Compact cargo-deny output: keep advisories/bans/license failures"
match_command = "^cargo\\s+deny\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "error\\[",
  "error:",
  "warning\\[",
  "warning:",
  "FAILED",
  "RUSTSEC",
  "denied",
  "rejected",
  "vulnerability",
  "unmaintained"
]
max_lines = 80
on_empty = "cargo deny: ok"
token_budget = 2500

[[tests.cargo-deny]]
name = "all checks pass"
input = """
2026-06-16 advisories ok
2026-06-16 bans ok
2026-06-16 licenses ok
2026-06-16 sources ok
"""
expected = "cargo deny: ok"

[[tests.cargo-deny]]
name = "advisory failure preserved"
input = """
2026-06-16 starting checks
error[vulnerability]: ring 0.16.20 has a known vulnerability (RUSTSEC-2025-0001)
2026-06-16 advisories FAILED
"""
expected = """
error[vulnerability]: ring 0.16.20 has a known vulnerability (RUSTSEC-2025-0001)
2026-06-16 advisories FAILED"""
