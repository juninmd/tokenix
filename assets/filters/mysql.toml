[filters.mysql]
description = "Compact mysql output"
match_command = "^mysql\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Welcome to the MySQL monitor",
  "^\\s*Copyright",
  "^\\s*Your MySQL connection id",
  "^\\s*Server version",
  "^\\s*Type 'help'"
]
keep_lines_matching = [
  "ERROR",
  "Error",
  "FAILED",
  "Unknown database",
  "Access denied"
]
max_lines = 50


[[tests.mysql]]
name = "error shown"
input = """
ERROR 1049 (42000): Unknown database 'mydb'
"""
expected = """
ERROR 1049 (42000): Unknown database 'mydb'"""