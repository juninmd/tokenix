[filters.rails-routes]
description = "Compact rails routes output, keeping every route line"
match_command = "^(bundle\\s+exec\\s+)?rails\\s+routes\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Prefix",
  "^\\s*Verb",
  "^\\s*URI Pattern",
  "^\\s*Controller#Action",
]
keep_lines_matching = [
  "\\b(GET|POST|PUT|PATCH|DELETE)\\b",
  "Error",
  "aborted"
]
max_lines = 20

[[tests.rails-routes]]
name = "all routes preserved"
input = """
      Prefix Verb   URI Pattern                    Controller#Action
        root GET    /                              home#index
     users GET    /users(.:format)                 users#index
           POST   /users(.:format)                 users#create
  new_user GET    /users/new(.:format)             users#new
 edit_user GET    /users/:id/edit(.:format)        users#edit
"""
expected = """
        root GET    /                              home#index
     users GET    /users(.:format)                 users#index
           POST   /users(.:format)                 users#create
  new_user GET    /users/new(.:format)             users#new
 edit_user GET    /users/:id/edit(.:format)        users#edit"""

[[tests.rails-routes]]
name = "pending migration abort preserved"
input = """
rails aborted!
ActiveRecord::PendingMigrationError: Migrations are pending. To resolve this issue, run: bin/rails db:migrate
"""
expected = """
rails aborted!
ActiveRecord::PendingMigrationError: Migrations are pending. To resolve this issue, run: bin/rails db:migrate"""