[filters.tofu-workspace]
description = "Compact OpenTofu workspace output"
match_command = "^tofu\\s+workspace\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\*",
  "^\\s+"
]
max_lines = 20
on_empty = "tofu workspace: default"

[[tests.tofu-workspace]]
name = "list workspaces"
input = """
  default
* dev
  staging
  prod
"""
expected = """
  default
* dev
  staging
  prod"""

[[tests.tofu-workspace]]
name = "new workspace"
input = """
Workspace "staging" created.
Switched to workspace "staging".
"""
expected = "tofu workspace: default"