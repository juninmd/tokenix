[filters.tap]
description = "Keep TAP failures and summary, drop passing assertions"
match_command = "^(npx\\s+)?tap\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^ok \\d",
  "^\\s*ok \\d",
]
keep_lines_matching = [
  "^not ok",
  "^\\s*not ok",
  "^# (failed|pass|fail|tests)",
  "^1\\.\\.\\d",
  "(?i)error",
  "^\\s{2,}\\S",
]
max_lines = 80
on_empty = "tap: all tests passed"

[[tests.tap]]
name = "failure keeps YAML diagnostic block"
input = """
ok 1 - test one
not ok 2 - test two
  ---
  found: 4
  wanted: 3
  at:
    line: 8
    column: 10
    file: test/math.test.js
  stack: |
    Test.<anonymous> (test/math.test.js:8:10)
  ...
ok 3 - test three
1..3
# failed 1 of 3 tests
"""
expected = """not ok 2 - test two
  ---
  found: 4
  wanted: 3
  at:
    line: 8
    column: 10
    file: test/math.test.js
  stack: |
    Test.<anonymous> (test/math.test.js:8:10)
  ...
1..3
# failed 1 of 3 tests"""

[[tests.tap]]
name = "all pass collapses"
input = """
ok 1 - test one
ok 2 - test two
"""
expected = "tap: all tests passed"
