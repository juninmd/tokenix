[filters.docker-system]
description = "Compact docker system output"
match_command = "^docker\\s+system\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^TYPE\\b",
  "^Images\\b",
  "^Containers\\b",
  "^Local Volumes\\b",
  "^Build Cache\\b",
  "error",
  "Error"
]
max_lines = 30

[[tests.docker-system]]
name = "disk usage table preserved"
input = """
TYPE            TOTAL     ACTIVE    SIZE      RECLAIMABLE
Images          15        5         2.5GB     1.8GB (72%)
Containers      10        3         100MB     50MB (50%)
Local Volumes   8         4         500MB     200MB (40%)
Build Cache     20        2         1.2GB     1.0GB (83%)
"""
expected = """
TYPE            TOTAL     ACTIVE    SIZE      RECLAIMABLE
Images          15        5         2.5GB     1.8GB (72%)
Containers      10        3         100MB     50MB (50%)
Local Volumes   8         4         500MB     200MB (40%)
Build Cache     20        2         1.2GB     1.0GB (83%)"""

[[tests.docker-system]]
name = "daemon error preserved"
input = """
Error response from daemon: Cannot connect to the Docker daemon at unix:///var/run/docker.sock. Is the docker daemon running?
"""
expected = "Error response from daemon: Cannot connect to the Docker daemon at unix:///var/run/docker.sock. Is the docker daemon running?"
