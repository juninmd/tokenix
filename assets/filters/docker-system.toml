[filters.docker-system]
description = "Compact docker system output"
match_command = "^docker\\s+system\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Total",
  "^\\s*Reclaimable"
]
keep_lines_matching = [
  "Images:",
  "Containers:",
  "Local Volumes:",
  "Build Cache:"
]
max_lines = 30
on_empty = "docker system: ok"

[[tests.docker-system]]
name = "disk usage"
input = """
TYPE            TOTAL     ACTIVE    SIZE      RECLAIMABLE
Images          15        5         2.5GB     1.8GB (72%)
Containers      10        3         100MB     50MB (50%)
Local Volumes   8         4         500MB     200MB (40%)
Build Cache     20        2         1.2GB     1.0GB (83%)
"""
expected = """
Images          15        5         2.5GB     1.8GB (72%)
Containers      10        3         100MB     50MB (50%)
Local Volumes   8         4         500MB     200MB (40%)
Build Cache     20        2         1.2GB     1.0GB (83%)"""