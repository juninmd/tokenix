[filters.tofu-state]
description = "Compact OpenTofu state output"
match_command = "^tofu\\s+state\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+\\.\\w+",
  "Error:",
  "Error:",
  "No such resource"
]
max_lines = 30

[[tests.tofu-state]]
name = "list resources"
input = """
aws_instance.web
aws_s3_bucket.data
aws_security_group.web
"""
expected = """
aws_instance.web
aws_s3_bucket.data
aws_security_group.web"""

[[tests.tofu-state]]
name = "silent success stays empty"
input = ""
expected = ""