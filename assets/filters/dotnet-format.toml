[filters.dotnet-format]
description = "Compact dotnet format output"
match_command = "^dotnet\\s+format\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Microsoft",
  "^\\s*Copyright",
  "^\\s*Determine projects to format",
  "^\\s*Formatting",
  "^\\s*Formatted",
  "^\\s*\\d+ file",
  "^\\s*\\d+ project",
  "^\\s*No files",
]
keep_lines_matching = [
  "error:",
  "Error:",
  "Failed",
  "FAILED",
  "warning:",
  "Warning:",
]
max_lines = 30

[[tests.dotnet-format]]
name = "warning shown"
input = """
warning: IDE0005 Using directive is unnecessary
"""
expected = "warning: IDE0005 Using directive is unnecessary"

[[tests.dotnet-format]]
name = "silent success stays empty"
input = ""
expected = ""