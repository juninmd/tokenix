[filters.phpstan]
description = "Compact PHPStan output: keep error rows and the result line"
match_command = "\\b(?:phpstan|vendor/bin/phpstan)\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*-{3,}",
  "^\\s*={3,}",
  "^\\s*\\d+/\\d+ \\[",
]
keep_lines_matching = [
  "\\[OK\\]",
  "\\[ERROR\\]",
  "Found \\d+ error",
  "No errors",
  "^\\s+Line\\b",
  "^\\s+\\d+\\s+[A-Za-z]",
  "^\\s+\\S+\\.php",
  "^\\s+[🪪💡]",
  "^\\s{9,}\\S",
]
max_lines = 60
token_budget = 2000

[[tests.phpstan]]
name = "error rows, wrapped message and identifier rows kept"
input = """
 ------ -----------------------------------------------
  Line   src/Foo.php
 ------ -----------------------------------------------
  12     Method App\\Foo::bar() has no return type
         🪪  missingType.return
  20     Parameter #1 $items of method App\\Foo::sum() expects
         array<int>, array<string> given.
         🪪  argument.type
         💡 Change the parameter type or cast the values.
 ------ -----------------------------------------------

 [ERROR] Found 2 errors
"""
expected = """  Line   src/Foo.php
  12     Method App\\Foo::bar() has no return type
         🪪  missingType.return
  20     Parameter #1 $items of method App\\Foo::sum() expects
         array<int>, array<string> given.
         🪪  argument.type
         💡 Change the parameter type or cast the values.
 [ERROR] Found 2 errors"""

[[tests.phpstan]]
name = "clean run keeps OK"
input = """
 12/12 [============================] 100%

 [OK] No errors
"""
expected = """ [OK] No errors"""
