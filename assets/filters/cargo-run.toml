[filters.cargo-run]
description = "Strip cargo compile noise from cargo run, keep program output"
match_command = "^cargo\\s+run\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Compiling",
  "^\\s*Fresh",
  "^\\s*Finished",
  "^\\s*Running `",
  "^\\s*Downloaded",
  "^\\s*Downloading",
  "^\\s*Updating",
  "^\\s*Locking",
  "^\\s*Blocking",
]
max_lines = 80

[[tests.cargo-run]]
name = "program output kept, build noise stripped"
input = """
   Compiling my-crate v0.1.0
    Finished dev [unoptimized + debuginfo] target(s) in 1.8s
     Running `target/debug/my-crate`
hello from app
result: 42
"""
expected = """hello from app
result: 42"""

[[tests.cargo-run]]
name = "compile error passes through"
input = """
   Compiling my-crate v0.1.0
error[E0308]: mismatched types
 --> src/main.rs:3:9
  |
3 |     let x: u32 = "no";
  |         ^ expected `u32`, found `&str`
error: could not compile `my-crate` (bin "my-crate") due to 1 previous error
"""
expected = """error[E0308]: mismatched types
 --> src/main.rs:3:9
  |
3 |     let x: u32 = "no";
  |         ^ expected `u32`, found `&str`
error: could not compile `my-crate` (bin "my-crate") due to 1 previous error"""

[[tests.cargo-run]]
name = "silent program"
input = """
    Finished dev [unoptimized + debuginfo] target(s) in 0.1s
     Running `target/debug/my-crate`
"""
expected = '''
    Finished dev [unoptimized + debuginfo] target(s) in 0.1s
     Running `target/debug/my-crate`'''
