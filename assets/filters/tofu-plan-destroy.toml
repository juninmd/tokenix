[filters.tofu-plan-destroy]
description = "Compact OpenTofu plan -destroy output"
match_command = "^tofu\\s+plan\\s+.*-destroy\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Plan:",
  "^\\s*\\d+ to destroy"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "│ Error",
  "│ Warning",
  "# ",
  "-/"
]
max_lines = 60
on_empty = "tofu plan -destroy: nothing to destroy"

[[tests.tofu-plan-destroy]]
name = "destroy plan"
input = """
Plan: 0 to add, 0 to change, 2 to destroy.

# aws_instance.web will be destroyed
# aws_s3_bucket.data will be destroyed
"""
expected = """
# aws_instance.web will be destroyed
# aws_s3_bucket.data will be destroyed"""