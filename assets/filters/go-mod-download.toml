[filters.go-mod-download]
description = "Compact go mod download output"
match_command = "^go\\s+mod\\s+download\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^go: finding",
  "^go: downloading",
  "^go: extracting"
]
max_lines = 20


[[tests.go-mod-download]]
name = "unknown revision error preserved"
input = """
go: downloading github.com/missing/pkg v1.0.0
go: github.com/missing/pkg@v1.0.0: reading github.com/missing/pkg/go.mod at revision v1.0.0: unknown revision v1.0.0
"""
expected = "go: github.com/missing/pkg@v1.0.0: reading github.com/missing/pkg/go.mod at revision v1.0.0: unknown revision v1.0.0"

[[tests.go-mod-download]]
name = "silent success stays empty"
input = ""
expected = ""