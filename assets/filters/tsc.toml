[filters.tsc]
description = "Compact TypeScript compiler output"
match_command = "^(npx\\s+)?tsc\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Found \\d+ errors?\\.",
  "^npm warn Unknown project config"
]
max_lines = 100



[[tests.tsc]]
name = "errors shown"
input = """
src/main.ts(10,5): error TS2304: Cannot find name 'foo'.
src/utils.ts(15,1): error TS2322: Type 'string' is not assignable to type 'number'.
Found 2 errors.
"""
expected = """src/main.ts(10,5): error TS2304: Cannot find name 'foo'.
src/utils.ts(15,1): error TS2322: Type 'string' is not assignable to type 'number'."""