[filters.terraform-state]
description = "Compact terraform state output"
match_command = "^terraform\\s+state\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+\\.\\w+",
  "Error:",
  "Error:",
  "No such resource"
]
max_lines = 30
on_empty = "terraform state: no resources"

[[tests.terraform-state]]
name = "list resources"
input = """
aws_instance.web
aws_s3_bucket.data
aws_security_group.web
"""
expected = """
aws_instance.web
aws_s3_bucket.data
aws_security_group.web"""

[[tests.terraform-state]]
name = "show resource"
input = """
# aws_instance.web:
resource "aws_instance" "web" {
  ami           = "ami-12345678"
  instance_type = "t3.micro"
}
"""
expected = "terraform state: no resources"