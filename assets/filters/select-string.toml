[filters.select-string]
description = "Compact PowerShell Select-String output"
match_command = "^Select-String\\b|\\|\\s*Select-String\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  ":",
  "Select-String :",
  "Cannot",
  "não pode",
  "Error",
  "Exception",
]
max_lines = 80

[[tests.select-string]]
name = "powershell binding error"
command = "Get-Content log.txt | Select-String -Pattern ERROR"
input = """
Select-String : O objeto de entrada não pode ser associado a quaisquer parâmetros do comando
No linha:1 caractere:1
"""
expected = """
Select-String : O objeto de entrada não pode ser associado a quaisquer parâmetros do comando
No linha:1 caractere:1"""

[[tests.select-string]]
name = "silent success stays empty"
input = ""
expected = ""