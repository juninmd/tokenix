[filters.go-vet]
description = "Compact go vet output"
match_command = "^go\\s+vet\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+\\.go:\\d+:\\d+:",
  "error:",
  "warning:"
]
max_lines = 50


[[tests.go-vet]]
name = "issues shown"
input = """
main.go:10:5: loop condition never evaluates to false
utils.go:15:1: unreachable code
"""
expected = """
main.go:10:5: loop condition never evaluates to false
utils.go:15:1: unreachable code"""