[filters.go-vet]
description = "Compact go vet output"
match_command = "^go\\s+vet\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "\\.go:\\d+:\\d+:",
  "^# ",
  "error:",
  "warning:"
]
max_lines = 50


[[tests.go-vet]]
name = "issues shown with package header and relative paths"
input = """
# github.com/user/project
./main.go:10:5: loop condition never evaluates to false
pkg/utils/utils.go:15:1: unreachable code
"""
expected = """
# github.com/user/project
./main.go:10:5: loop condition never evaluates to false
pkg/utils/utils.go:15:1: unreachable code"""

[[tests.go-vet]]
name = "silent success stays empty"
input = ""
expected = ""
