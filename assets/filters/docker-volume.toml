[filters.docker-volume]
description = "Compact docker volume output"
match_command = "^docker\\s+volume\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^DRIVER\\s+VOLUME NAME"
]
keep_lines_matching = [
  "^\\w+",
  "local",
  "nfs"
]
max_lines = 30

[[tests.docker-volume]]
name = "list volumes"
input = """
DRIVER    VOLUME NAME
local     myapp_db_data
local     myapp_redis_data
"""
expected = """
local     myapp_db_data
local     myapp_redis_data"""

[[tests.docker-volume]]
name = "missing volume error preserved"
input = """
Error response from daemon: get myvol: no such volume
"""
expected = "Error response from daemon: get myvol: no such volume"
