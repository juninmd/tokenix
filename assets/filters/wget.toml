[filters.wget]
description = "Compact wget output"
match_command = "^wget\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^--\\d{4}-\\d{2}-\\d{2} ",
  "^\\s*Resolving ",
  "^\\s*Connecting ",
  "^\\s*HTTP request sent",
  "^\\s*Length: ",
  "^\\s*Saving to: ",
  "^\\s*\\d+%",
  "^\\s*\\[",
  "^\\s*\\d+\\.\\d+ [KM]B/s",
]
keep_lines_matching = [
  "ERROR",
  "failed",
  "Connection refused",
  "No such file",
  "404 Not Found",
  "403 Forbidden"
]
max_lines = 20


[[tests.wget]]
name = "error shown"
input = """
--2024-01-15 10:30:00--  https://example.com/missing.zip
HTTP request sent, awaiting response... 404 Not Found
2024-01-15 10:30:01 ERROR 404: Not Found.
"""
expected = """
2024-01-15 10:30:01 ERROR 404: Not Found."""