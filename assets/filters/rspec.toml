[filters.rspec]
description = "Compact RSpec output — keep failures and summary"
match_command = "^(bundle\\s+exec\\s+)?rspec\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\.",
  "^\\*",
  "^\\s*Finished in",
  "^\\s*Randomized with seed",
]
keep_lines_matching = [
  "Failures:",
  "failed",
  "Error",
  "Error:",
  "expect",
  "expected",
  "received",
  "got:",
  "backtrace",
  "NoMethodError",
  "ArgumentError",
  "RuntimeError",
  "Summary",
  "examples?",
  "failures?",
  "pending",
  "^\\s*\\d+\\) ",
  "^\\s*# \\./",
  "^rspec \\./",
]
max_lines = 50


[[tests.rspec]]
name = "failure keeps test name, expected/got, backtrace and summary"
input = """
..F..

Failures:

  1) User#name returns the name
     Failure/Error: expect(user.name).to eq("John")

       expected: "John"
            got: "Jane"

       (compared using ==)
     # ./spec/models/user_spec.rb:10:in `block (2 levels) in <top (required)>'

Finished in 0.5 seconds
5 examples, 1 failure

Failed examples:

rspec ./spec/models/user_spec.rb:10 # User#name returns the name
"""
expected = """Failures:
  1) User#name returns the name
     Failure/Error: expect(user.name).to eq("John")
       expected: "John"
            got: "Jane"
     # ./spec/models/user_spec.rb:10:in `block (2 levels) in <top (required)>'
5 examples, 1 failure
Failed examples:
rspec ./spec/models/user_spec.rb:10 # User#name returns the name"""

[[tests.rspec]]
name = "green run keeps summary line"
input = """
.....

Finished in 0.03 seconds (files took 0.2 seconds to load)
5 examples, 0 failures
"""
expected = "5 examples, 0 failures"

[[tests.rspec]]
name = "silent success stays empty"
input = ""
expected = ""