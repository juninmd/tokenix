[filters.git-diff]
description = "Compact git diff output"
match_command = "^git\\s+diff\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^diff --git",
  "^index ",
  "^--- ",
  "^\\+\\+\\+ ",
  "^@@ "
]
keep_lines_matching = [
  "^\\+",
  "^\\-",
  "^\\\\ "
]
max_lines = 100
on_empty = "git diff: no changes"

[[tests.git-diff]]
name = "simple diff"
input = """
diff --git a/src/main.rs b/src/main.rs
index 1234567..abcdefg 100644
--- a/src/main.rs
+++ b/src/main.rs
@@ -1,5 +1,6 @@
 fn main() {
     println!("Hello, world!");
+    println!("New line");
 }
"""
expected = """
+    println!("New line");"""

[[tests.git-diff]]
name = "deletion shown"
input = """
diff --git a/src/main.rs b/src/main.rs
index 1234567..abcdefg 100644
--- a/src/main.rs
+++ b/src/main.rs
@@ -1,6 +1,5 @@
 fn main() {
     println!("Hello, world!");
-    println!("Old line");
 }
"""
expected = """
-    println!("Old line");"""