[filters.git-diff]
description = "Compact git diff output"
match_command = "^git\\s+diff\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^index ",
  "^--- ",
  "^\\+\\+\\+ ",
  "^@@ "
]
keep_lines_matching = [
  "^\\+",
  "^\\-",
  "^\\\\ ",
  "^diff --git"
]
max_lines = 100
# `git diff --stat` / `--name-only` have no +/- hunk lines; show the real summary
# instead of a false "no changes".
passthrough_when_emptied = true

[[tests.git-diff]]
name = "stat format is not falsely reported empty"
input = """
 Cargo.toml  |  6 +
 src/main.rs | 12 ++--
 2 files changed, 18 insertions(+), 2 deletions(-)
"""
expected = """
 Cargo.toml  |  6 +
 src/main.rs | 12 ++--
 2 files changed, 18 insertions(+), 2 deletions(-)"""

[[tests.git-diff]]
name = "simple diff"
input = """
diff --git a/src/main.rs b/src/main.rs
index 1234567..abcdefg 100644
--- a/src/main.rs
+++ b/src/main.rs
@@ -1,5 +1,6 @@
 fn main() {
     println!("Hello, world!");
+    println!("New line");
 }
 """
expected = """
diff --git a/src/main.rs b/src/main.rs
+    println!("New line");"""

[[tests.git-diff]]
name = "deletion shown"
input = """
diff --git a/src/main.rs b/src/main.rs
index 1234567..abcdefg 100644
--- a/src/main.rs
+++ b/src/main.rs
@@ -1,6 +1,5 @@
 fn main() {
     println!("Hello, world!");
-    println!("Old line");
 }
 """
expected = """
diff --git a/src/main.rs b/src/main.rs
-    println!("Old line");"""

[[tests.git-diff]]
name = "silent success stays empty"
input = ""
expected = ""