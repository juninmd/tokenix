[filters.git-cherry-pick]
description = "Compact `git cherry-pick` output — keep conflict/error/hint lines, summarize a clean pick."
match_command = "^git\\s+cherry-pick\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
keep_lines_matching = [
  "CONFLICT",
  "error:",
  "fatal:",
  "hint:",
  "Auto-merging",
  "could not apply",
  "after resolving the conflicts",
]
max_lines = 30
on_empty = "git cherry-pick: ok"

[[tests.git-cherry-pick]]
name = "clean pick collapses to ok"
input = """
[main 1a2b3c4] Fix typo in README
 Date: Mon Jun 22 10:00:00 2026 +0000
 1 file changed, 1 insertion(+), 1 deletion(-)
"""
expected = "git cherry-pick: ok"

[[tests.git-cherry-pick]]
name = "conflict preserved"
input = """
Auto-merging src/main.rs
CONFLICT (content): Merge conflict in src/main.rs
error: could not apply 1a2b3c4... Fix bug
hint: after resolving the conflicts, mark them with
hint: "git add/rm <pathspec>", then run "git cherry-pick --continue".
"""
expected = """Auto-merging src/main.rs
CONFLICT (content): Merge conflict in src/main.rs
error: could not apply 1a2b3c4... Fix bug
hint: after resolving the conflicts, mark them with
hint: "git add/rm <pathspec>", then run "git cherry-pick --continue"."""
