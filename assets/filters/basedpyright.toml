[filters.basedpyright]
description = "Compact basedpyright output"
match_command = "^basedpyright\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*\\d+ errors?",
  "^\\s*\\d+ warnings?",
  "^\\s*\\d+ informations?",
  "^\\s*\\d+ hints?"
]
keep_lines_matching = [
  "^\\w+:\\d+:\\d+:",
  "error:",
  "warning:",
  "information:",
  "hint:"
]
max_lines = 60


[[tests.basedpyright]]
name = "errors shown"
input = """
src/main.py:10:5: error: Variable "foo" is not defined  [reportUndefinedVariable]
src/utils.py:15:1: warning: Line too long  [reportLineTooLong]
"""
expected = """
src/main.py:10:5: error: Variable "foo" is not defined  [reportUndefinedVariable]
src/utils.py:15:1: warning: Line too long  [reportLineTooLong]"""