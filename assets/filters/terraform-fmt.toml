[filters.terraform-fmt]
description = "Compact terraform fmt output"
match_command = "^terraform\\s+fmt\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
keep_lines_matching = [
  "^\\w+\\.tf",
  "Error:",
  "Error:",
  "failed"
]
max_lines = 20

[[tests.terraform-fmt]]
name = "files formatted"
input = """
main.tf
variables.tf
outputs.tf
"""
expected = """
main.tf
variables.tf
outputs.tf"""

[[tests.terraform-fmt]]
name = "silent success stays empty"
input = ""
expected = ""