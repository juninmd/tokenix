[filters.yarn-test]
description = "Compact yarn test output"
match_command = "^yarn\\s+test\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\$ ",
  "^\\s*yarn run",
  "^\\s*Done in"
]
keep_lines_matching = [
  "FAIL",
  "PASS",
  "Test Suites:",
  "Tests:",
  "Error:",
  "TypeError:",
  "AssertionError",
  "●",
  "Expected",
  "Received",
  "error Command failed",
  "expect\\(",
  "^\\s+at ",
  "^\\s*[-+] ",
  "^\\s*>?\\s*\\d+ \\|",
  "^\\s*\\|"
]
max_lines = 60

[[tests.yarn-test]]
name = "tests pass with counts visible"
input = """
yarn run v1.22.19
$ jest
 PASS  src/utils.test.ts
Test Suites: 1 passed, 1 total
Tests:       10 passed, 10 total
Done in 2.34s.
"""
expected = """
 PASS  src/utils.test.ts
Test Suites: 1 passed, 1 total
Tests:       10 passed, 10 total"""

[[tests.yarn-test]]
name = "failing test keeps matcher, diff, code frame and stack"
input = """
yarn run v1.22.19
$ jest
 FAIL  src/auth.test.ts
  ● login › rejects invalid password

    expect(received).toBe(expected) // Object.is equality

    Expected: 401
    Received: 200

      10 |   const res = await login('bad');
    > 11 |   expect(res.status).toBe(401);
         |                      ^
      12 | });

      at Object.<anonymous> (src/auth.test.ts:11:22)

Test Suites: 1 failed, 1 total
Tests:       1 failed, 9 passed, 10 total
error Command failed with exit code 1.
"""
expected = """
 FAIL  src/auth.test.ts
  ● login › rejects invalid password
    expect(received).toBe(expected) // Object.is equality
    Expected: 401
    Received: 200
      10 |   const res = await login('bad');
    > 11 |   expect(res.status).toBe(401);
         |                      ^
      12 | });
      at Object.<anonymous> (src/auth.test.ts:11:22)
Test Suites: 1 failed, 1 total
Tests:       1 failed, 9 passed, 10 total
error Command failed with exit code 1."""

[[tests.yarn-test]]
name = "object diff lines preserved"
input = """
yarn run v1.22.19
$ jest
 FAIL  src/user.test.ts
  ● user › builds profile

    expect(received).toEqual(expected) // deep equality

    - Expected - 1
    + Received + 1

      Object {
    -   "name": "John",
    +   "name": "Jane",
      }

Test Suites: 1 failed, 1 total
Tests:       1 failed, 0 passed, 1 total
error Command failed with exit code 1.
"""
expected = """
 FAIL  src/user.test.ts
  ● user › builds profile
    expect(received).toEqual(expected) // deep equality
    - Expected - 1
    + Received + 1
    -   "name": "John",
    +   "name": "Jane",
Test Suites: 1 failed, 1 total
Tests:       1 failed, 0 passed, 1 total
error Command failed with exit code 1."""