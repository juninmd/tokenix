[filters.yarn-test]
description = "Compact yarn test output"
match_command = "^yarn\\s+test\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\$ ",
  "^\\s*yarn run",
  "^\\s*Done in"
]
keep_lines_matching = [
  "FAIL",
  "PASS",
  "Test Suites:",
  "Tests:",
  "Error:",
  "TypeError:",
  "AssertionError"
]
max_lines = 60
on_empty = "yarn test: passed"

[[tests.yarn-test]]
name = "tests pass"
input = """
yarn run v1.22.19
$ jest
 PASS  src/utils.test.ts
Test Suites: 1 passed, 1 total
Tests:       10 passed, 10 total
Done in 2.34s.
"""
expected = "yarn test: passed"