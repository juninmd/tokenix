[filters.rails-migrate]
description = "Compact Rails db:migrate output"
match_command = "^(bundle\\s+exec\\s+)?rails\\s+db:migrate\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*==",
  "^\\s*--",
]
keep_lines_matching = [
  "migrated",
  "CreateTable",
  "AddColumn",
  "RemoveColumn",
  "CreateIndex",
  "RemoveIndex",
  "down",
  "up",
]
max_lines = 30


