[filters.terraform-plan]
description = "Compact terraform plan output aggressively"
match_command = "^terraform\\s+plan\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Refreshing Terraform state",
  "^\\s*data\\.",
  "^\\s*# ",
  "^\\s*\\+\\/\\-",
  "^\\s*\\-",
  "^Plan:",
  "^\\s*\\d+ to add",
  "^\\s*\\d+ to change",
  "^\\s*\\d+ to destroy",
  "^\\s*Terraform used the selected providers",
  "^\\s*Resource actions are indicated",
  "^\\s*[+~-] create",
  "^\\s*[+~-] update in-place",
  "^\\s*[+~-] destroy",
  "^\\s*[+~-] read",
  "^\\s*\\(\\d+/\\)",
]
keep_lines_matching = [
  "Error:",
  "Warning:",
  "Error: ",
  "│ Error",
  "│ Warning",
  "Plan:",
  "to add",
  "to change",
  "to destroy",
  "No changes",
]
max_lines = 50
on_empty = "terraform plan: no changes"
replace_patterns = [
  ["\\(ID: [a-f0-9-]+\\)", "(ID: <uuid>)"],
  ["[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}", "<resource_id>"],
  ["arn:aws:[^\\s]+", "arn:aws:<resource>"],
  ["\\d+\\.\\d+s", "<duration>"],
]
extract_sections = [
  { start_pattern = "^\\s*[+~-]", end_pattern = "^\\s*$", include_markers = true, max_matches = 20 },
  { start_pattern = "Error:", end_pattern = "^\\s*$", include_markers = true, max_matches = 5 },
]
deduplicate_blocks = { min_block_lines = 3, similarity = 0.75 }
summarize_json = { max_array_items = 5, max_depth = 2 }
token_budget = 2000

[[tests.terraform-plan]]
name = "no changes"
input = """
No changes. Infrastructure is up-to-date.
"""
expected = "No changes. Infrastructure is up-to-date."

[[tests.terraform-plan]]
name = "plan with changes shown"
input = """
Terraform used the selected providers to generate the following execution plan.
Resource actions are indicated with the following symbols:
  + create
  ~ update in-place
  - destroy

Plan: 2 to add, 1 to change, 1 to destroy.
"""
expected = "terraform plan: no changes"

[[tests.terraform-plan]]
name = "many similar resources deduplicated"
input = """
  + create aws_instance.web[0]
  + create aws_instance.web[1]
  + create aws_instance.web[2]
  + create aws_instance.web[3]
  + create aws_instance.web[4]
  ~ update in-place aws_security_group.sg[0]
  ~ update in-place aws_security_group.sg[1]

Plan: 7 to add, 2 to change, 0 to destroy.
"""
expected = "terraform plan: no changes"