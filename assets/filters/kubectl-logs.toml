[filters.kubectl-logs]
description = "Compact kubectl logs output"
match_command = "^kubectl(?:\\s+(?:-[A-Za-z][-A-Za-z0-9]*|--[A-Za-z][-A-Za-z0-9]*)(?:[=\\s]+\\S+)?)*\\s+logs\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$"
]
# Keep the error/warning lines AND the structured context that follows them in
# JSON/pino-style logs (the `error:`/`"message"`/`"name"`/`stack`/`at ...` lines).
# Without these, the headline "ERROR" line is kept but the line that actually
# says *what* went wrong (e.g. `"message": "require is not defined"`) is dropped.
keep_lines_matching = [
  "ERROR",
  "FATAL",
  "PANIC",
  "Exception",
  "Error:",
  "Error from server",
  "Failed",
  "WARN",
  "error",
  "\"message\"",
  "\"name\"",
  "_description",
  "stack",
  "^\\s+at\\s"
]
truncate_lines_at = 240
max_lines = 120

[[tests.kubectl-logs]]
name = "logs with errors"
input = """
2024-01-15 10:30:00 INFO  Starting server on port 8080
2024-01-15 10:30:01 INFO  Connected to database
2024-01-15 10:30:02 ERROR Failed to connect to redis: connection refused
2024-01-15 10:30:03 WARN  Retrying in 5s
2024-01-15 10:30:08 INFO  Connected to redis
"""
expected = """
2024-01-15 10:30:02 ERROR Failed to connect to redis: connection refused
2024-01-15 10:30:03 WARN  Retrying in 5s"""

[[tests.kubectl-logs]]
name = "missing pod error preserved"
input = """
Error from server (NotFound): pods "myapp-abc123" not found
"""
expected = """
Error from server (NotFound): pods "myapp-abc123" not found"""


[[tests.kubectl-logs]]
name = "pino error context and stack preserved"
input = """
[03:14:05] INFO: Processando upload enfileirado
[03:14:05] ERROR: Failed to decrypt YouTube refresh token from database
    error: {
      "name": "ReferenceError",
      "message": "require is not defined",
        at getYouTubeAuth (/app/src/core/youtube.service.ts:158:7)
    }
[03:14:05] WARN: YouTube token validation failed
"""
expected = """
[03:14:05] ERROR: Failed to decrypt YouTube refresh token from database
    error: {
      "name": "ReferenceError",
      "message": "require is not defined",
        at getYouTubeAuth (/app/src/core/youtube.service.ts:158:7)
[03:14:05] WARN: YouTube token validation failed"""
