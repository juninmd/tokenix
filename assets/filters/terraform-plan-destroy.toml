[filters.terraform-plan-destroy]
description = "Compact terraform plan -destroy output"
match_command = "^terraform\\s+plan\\s+.*-destroy\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Plan:",
  "^\\s*\\d+ to destroy"
]
keep_lines_matching = [
  "Error:",
  "Error:",
  "│ Error",
  "│ Warning",
  "# ",
  "-/"
]
max_lines = 60

[[tests.terraform-plan-destroy]]
name = "destroy plan"
input = """
Plan: 0 to add, 0 to change, 2 to destroy.

# aws_instance.web will be destroyed
# aws_s3_bucket.data will be destroyed
"""
expected = """
# aws_instance.web will be destroyed
# aws_s3_bucket.data will be destroyed"""

[[tests.terraform-plan-destroy]]
name = "nothing to destroy is honest"
input = """
No changes. No objects need to be destroyed.

Plan: 0 to add, 0 to change, 0 to destroy.
"""
expected = '''
No changes. No objects need to be destroyed.

Plan: 0 to add, 0 to change, 0 to destroy.'''
