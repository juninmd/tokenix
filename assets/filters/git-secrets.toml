[filters.git-secrets]
description = "Keep git-secrets matched-secret lines and errors, collapse clean scans"
match_command = "^git[ -]secrets\\b"
passthrough_when_emptied = true
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
keep_lines_matching = [
  "prohibited",
  "\\[ERROR\\]",
  ":\\d+:",
  "(?i)error",
]
max_lines = 80
on_empty = "git-secrets: no secrets found"

[[tests.git-secrets]]
name = "matched secret kept"
input = """
config/prod.env:5:AWS_SECRET_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE
[ERROR] Matched one or more prohibited patterns
"""
expected = """config/prod.env:5:AWS_SECRET_ACCESS_KEY=AKIAIOSFODNN7EXAMPLE
[ERROR] Matched one or more prohibited patterns"""

[[tests.git-secrets]]
name = "clean scan collapses"
input = ""
expected = "git-secrets: no secrets found"
