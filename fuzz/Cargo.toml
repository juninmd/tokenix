[package]
name = "tokenix-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
hex = "0.4"
libfuzzer-sys = "0.4"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
toml = "1.1"
tree-sitter = "0.26"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"

[[bin]]
name = "chunker_inputs"
path = "fuzz_targets/chunker_inputs.rs"
test = false
doc = false
bench = false

[workspace]
